<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест ономатопей · LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080d0a;color:#edf3dc;font-family:Arial,sans-serif}.app{display:grid;grid-template-columns:340px 1fr;height:100vh}.side{overflow:auto;padding:13px;background:#101713;border-right:1px solid #354438}.side h1{margin:0 0 4px;color:#e2c943;font-size:21px}.lead{margin:0 0 12px;color:#bdc9ad;font-size:12px;line-height:1.4}.g{border:1px solid #354438;border-radius:10px;padding:10px;margin-bottom:9px;background:#ffffff05}.g h2{margin:0 0 8px;color:#f8eda2;font-size:12px;letter-spacing:.07em}.r{display:grid;grid-template-columns:1fr 94px;gap:8px;align-items:center;margin:6px 0}.r label{font-size:12px}.r input[type=range]{width:100%}.r input[type=number],.r select,.r input[type=color]{width:100%;padding:6px;background:#080d09;color:#eef3dc;border:1px solid #435446;border-radius:7px}textarea{width:100%;min-height:78px;background:#080d09;color:#eef3dc;border:1px solid #435446;border-radius:8px;padding:8px}.file{width:100%;font-size:11px}.buttons,.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}button{border:0;border-radius:8px;padding:8px;background:#ddc43a;color:#171300;font-weight:900;cursor:pointer}button.alt{background:#1a241d;color:#eef3dc;border:1px solid #405344}.pane{position:relative;min-width:0;background:#050806}.bar{position:absolute;z-index:30;left:12px;top:10px;background:#07100add;border:1px solid #334239;border-radius:8px;padding:7px 9px;font:700 11px Consolas}.coord{position:absolute;z-index:30;right:12px;top:10px;background:#07100add;border:1px solid #334239;border-radius:8px;padding:7px 9px;font:700 11px Consolas}.vp{position:absolute;inset:0;padding:48px 16px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.scaler{position:relative;transform-origin:center}.stage{position:relative;width:1920px;height:1020px;overflow:hidden;background:#111;box-shadow:0 12px 40px #000b}.live{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#111}.shot{position:absolute;inset:0;background:center/contain no-repeat;display:none}.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4}.grid{position:absolute;inset:0;display:none;z-index:5;pointer-events:none;background-image:linear-gradient(#ffe66a55 1px,transparent 1px),linear-gradient(90deg,#ffe66a55 1px,transparent 1px);background-size:96px 96px}.bubble{position:absolute;z-index:20;left:23%;top:74%;width:500px;transform:translate(-50%,-50%);cursor:grab;transform-origin:center}.bubble.drag{cursor:grabbing}.bubble img{display:block;width:100%;height:auto;pointer-events:none}.blank{width:100%;aspect-ratio:1.48;background:#f4eedc;border:10px solid #111;clip-path:polygon(3% 9%,91% 2%,99% 16%,97% 83%,31% 86%,18% 100%,20% 86%,3% 85%);background-image:radial-gradient(#1114 1.5px,transparent 1.6px);background-size:15px 15px}.txt{position:absolute;inset:19% 12% 22% 13%;display:flex;align-items:center;font-weight:900;font-style:italic;font-size:28px;line-height:1.02;color:#241912;text-transform:uppercase;white-space:pre-wrap;overflow:hidden;pointer-events:none}.code{white-space:pre-wrap;font:11px/1.4 Consolas;background:#070c08;border:1px solid #354438;border-radius:7px;padding:7px;color:#d7e7c3;max-height:145px;overflow:auto}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px}@media(max-width:950px){.app{grid-template-columns:300px 1fr}}</style></head><body><div class="app"><aside class="side"><h1>Тест ономатопей · LIVE</h1><p class="lead">Фон — <b>реальна сцена 4-го рівня</b>. Рухай тестову плашку прямо поверх карти або RX-01.</p><div class="g"><h2>СЦЕНА</h2><div class="r"><label>Живий фон</label><select id="scene"><option value="map">4 рівень · КАРТА</option><option value="rx">4 рівень · RX-01</option><option value="shot">Свій скрін</option></select></div><div class="r"><label>Формат</label><select id="size"><option value="1920x1020">1920×1020</option><option value="1920x1080">1920×1080</option><option value="1618x972">1618×972</option><option value="1366x768">1366×768</option></select></div><div class="r"><label>Затемнення</label><input id="dim" type="range" min="0" max=".7" step=".01" value="0"></div><div class="checks"><label><input id="grid" type="checkbox"> сітка</label><label><input id="hideOld" type="checkbox" checked> ховати старі репліки</label></div><div style="margin-top:7px"><input id="shotFile" class="file" type="file" accept="image/*"></div></div><div class="g"><h2>ПЛАШКА</h2><div class="r"><label>Ширина px</label><input id="w" type="number" value="500" min="100" max="1400"></div><div class="r"><label>Scale</label><input id="scale" type="range" min=".2" max="2" step=".01" value="1"></div><div class="r"><label>Кут</label><input id="rot" type="range" min="-30" max="30" step=".1" value="0"></div><div class="r"><label>X %</label><input id="x" type="range" min="0" max="100" step=".1" value="23"></div><div class="r"><label>Y %</label><input id="y" type="range" min="0" max="100" step=".1" value="74"></div><div class="r"><label>Opacity</label><input id="op" type="range" min=".1" max="1" step=".01" value="1"></div><div class="checks"><label><input id="shadow" type="checkbox" checked> тінь</label><label><input id="textOn" type="checkbox" checked> текст поверх</label></div><div style="margin-top:7px"><input id="png" class="file" type="file" accept="image/*"></div><div class="presets" style="margin-top:7px"><button class="alt" data-p="tl">Ліво ↑</button><button class="alt" data-p="bl">Ліво ↓</button><button class="alt" data-p="tr">Право ↑</button><button class="alt" data-p="br">Право ↓</button></div></div><div class="g"><h2>ТЕКСТ</h2><textarea id="text">Почнемо з карти.
Для початку розберись із масштабом.
Натисни «+», потім «−».</textarea><div class="r"><label>Розмір</label><input id="fs" type="range" min="12" max="72" step="1" value="28"></div><div class="r"><label>Line height</label><input id="lh" type="range" min=".75" max="1.5" step=".01" value="1.02"></div><div class="r"><label>Колір</label><input id="color" type="color" value="#241912"></div></div><div class="g"><h2>ЕКСПОРТ</h2><div class="buttons"><button id="css">Копіювати CSS</button><button id="json">Копіювати JSON</button></div><div id="code" class="code" style="margin-top:7px"></div></div></aside><main class="pane"><div class="bar">LIVE preview · drag & drop</div><div id="coord" class="coord"></div><div id="vp" class="vp"><div id="scaler" class="scaler"><div id="stage" class="stage"><iframe id="live" class="live" src="../stages/15_level4_map.html"></iframe><div id="shot" class="shot"></div><div id="dimLayer" class="dim"></div><div id="gridLayer" class="grid"></div><div id="bubble" class="bubble"><div id="blank" class="blank"></div><img id="img" style="display:none"><div id="txt" class="txt"></div></div></div></div></div></main></div><script>const $=id=>document.getElementById(id),E={scene:$('scene'),size:$('size'),dim:$('dim'),grid:$('grid'),hideOld:$('hideOld'),shotFile:$('shotFile'),w:$('w'),scale:$('scale'),rot:$('rot'),x:$('x'),y:$('y'),op:$('op'),shadow:$('shadow'),textOn:$('textOn'),png:$('png'),text:$('text'),fs:$('fs'),lh:$('lh'),color:$('color'),stage:$('stage'),vp:$('vp'),scaler:$('scaler'),live:$('live'),shot:$('shot'),dimLayer:$('dimLayer'),gridLayer:$('gridLayer'),bubble:$('bubble'),blank:$('blank'),img:$('img'),txt:$('txt'),coord:$('coord'),code:$('code')};let shotURL='',drag=false;function sanitize(){if(!E.hideOld.checked)return;try{const d=E.live.contentDocument;if(!d)return;['.petro','.toast','.speech','.onomatopoeia','.onoWrap'].forEach(s=>d.querySelectorAll(s).forEach(n=>n.style.display='none'))}catch(e){}}E.live.onload=()=>setTimeout(sanitize,250);function fit(){const [w,h]=E.size.value.split('x').map(Number),r=E.vp.getBoundingClientRect(),z=Math.min((r.width-30)/w,(r.height-62)/h,1);E.stage.style.width=w+'px';E.stage.style.height=h+'px';E.scaler.style.width=w+'px';E.scaler.style.height=h+'px';E.scaler.style.transform=`scale(${z})`}function scene(){if(E.scene.value==='map'){E.live.style.display='block';E.shot.style.display='none';if(!E.live.src.includes('15_level4_map'))E.live.src='../stages/15_level4_map.html'}else if(E.scene.value==='rx'){E.live.style.display='block';E.shot.style.display='none';if(!E.live.src.includes('16_level4_rx'))E.live.src='../stages/16_level4_rx.html'}else{E.live.style.display='none';E.shot.style.display='block';E.shot.style.backgroundImage=shotURL?`url(${shotURL})`:'linear-gradient(135deg,#ddd,#aaa)';E.shot.style.backgroundSize='contain';E.shot.style.backgroundPosition='center';E.shot.style.backgroundRepeat='no-repeat'}}function update(){fit();scene();sanitize();E.dimLayer.style.opacity=E.dim.value;E.gridLayer.style.display=E.grid.checked?'block':'none';E.bubble.style.width=E.w.value+'px';E.bubble.style.left=E.x.value+'%';E.bubble.style.top=E.y.value+'%';E.bubble.style.opacity=E.op.value;E.bubble.style.transform=`translate(-50%,-50%) scale(${E.scale.value}) rotate(${E.rot.value}deg)`;E.bubble.style.filter=E.shadow.checked?'drop-shadow(0 12px 18px #0008)':'none';E.txt.textContent=E.text.value;E.txt.style.display=E.textOn.checked?'flex':'none';E.txt.style.fontSize=E.fs.value+'px';E.txt.style.lineHeight=E.lh.value;E.txt.style.color=E.color.value;E.coord.textContent=`X ${Number(E.x.value).toFixed(1)}% · Y ${Number(E.y.value).toFixed(1)}% · W ${E.w.value}px`;const css=`left:${Number(E.x.value).toFixed(1)}%; top:${Number(E.y.value).toFixed(1)}%; width:${E.w.value}px; transform:translate(-50%,-50%) scale(${E.scale.value}) rotate(${E.rot.value}deg); opacity:${E.op.value};`;const obj={x:+E.x.value,y:+E.y.value,width:+E.w.value,scale:+E.scale.value,rotate:+E.rot.value,opacity:+E.op.value,fontSize:+E.fs.value,lineHeight:+E.lh.value};E.code.textContent=css+'\n\n'+JSON.stringify(obj,null,2)}[...document.querySelectorAll('input,select,textarea')].forEach(n=>{n.addEventListener('input',update);n.addEventListener('change',update)});E.shotFile.onchange=e=>{const f=e.target.files[0];if(!f)return;shotURL=URL.createObjectURL(f);E.scene.value='shot';update()};E.png.onchange=e=>{const f=e.target.files[0];if(!f)return;E.img.src=URL.createObjectURL(f);E.img.style.display='block';E.blank.style.display='none';E.textOn.checked=false;update()};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=b.dataset.p;if(p==='tl'){E.x.value=22;E.y.value=24}if(p==='bl'){E.x.value=22;E.y.value=76}if(p==='tr'){E.x.value=78;E.y.value=24}if(p==='br'){E.x.value=78;E.y.value=76}update()});E.bubble.onpointerdown=e=>{e.preventDefault();drag=true;E.bubble.classList.add('drag');E.bubble.setPointerCapture(e.pointerId)};E.bubble.onpointermove=e=>{if(!drag)return;const r=E.stage.getBoundingClientRect();E.x.value=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)).toFixed(1);E.y.value=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100)).toFixed(1);update()};E.bubble.onpointerup=()=>{drag=false;E.bubble.classList.remove('drag')};$('css').onclick=()=>navigator.clipboard.writeText(E.code.textContent.split('\n\n')[0]);$('json').onclick=()=>navigator.clipboard.writeText(E.code.textContent.split('\n\n')[1]);window.addEventListener('resize',fit);update();</script></body></html>
