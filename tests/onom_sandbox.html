<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Onomatopoeia Sandbox</title><style>
:root{
--panel-bg:#101612;
--panel-border:#334034;
--accent:#d8c86d;
--ink:#0d0d0d;
--paper:#f4eedc;
--ui:#d9ddb7;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0b0f0d;
color:#eef2da;
height:100vh;
overflow:hidden;
}
.app{
display:grid;
grid-template-columns: 360px 1fr;
height:100vh;
}
.sidebar{
border-right:1px solid var(--panel-border);
background:linear-gradient(180deg,#111914,#0d130f);
overflow:auto;
padding:16px;
}
.sidebar h1{
margin:0 0 6px;
font-size:22px;
color:var(--accent);
}
.sidebar p.lead{
margin:0 0 16px;
color:#c7cfaa;
font-size:13px;
line-height:1.45;
}
.group{
border:1px solid var(--panel-border);
border-radius:12px;
padding:12px;
margin-bottom:12px;
background:rgba(255,255,255,.02);
}
.group h2{
margin:0 0 10px;
font-size:14px;
color:#f4f0b5;
letter-spacing:.4px;
text-transform:uppercase;
}
.row{
display:grid;
grid-template-columns: 1fr 88px;
gap:10px;
align-items:center;
margin:8px 0;
}
.row label{font-size:13px;color:#dde5c2}
.row input[type="number"], .row select, .row input[type="text"], .row input[type="color"]{
width:100%;
background:#0a0f0b;
color:#eef2da;
border:1px solid #465543;
border-radius:8px;
padding:7px 8px;
}
.row input[type="range"]{width:100%}
textarea{
width:100%;
min-height:92px;
resize:vertical;
background:#0a0f0b;
color:#eef2da;
border:1px solid #465543;
border-radius:10px;
padding:10px;
font-size:14px;
line-height:1.35;
}
.inline2{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{
appearance:none;border:none;cursor:pointer;
background:#e0c73a;color:#161200;font-weight:900;
padding:10px 12px;border-radius:10px;font-size:13px;
box-shadow:0 2px 0 rgba(0,0,0,.25);
}
button.secondary{background:#1b241d;color:#eff3d9;border:1px solid #3f5140}
button.full{grid-column:1/-1}
.stageWrap{
position:relative;
overflow:auto;
padding:20px;
display:flex;
align-items:flex-start;
justify-content:center;
}
.stage{
position:relative;
width:1366px;
height:768px;
background:#d6d1be;
border:1px solid #202720;
border-radius:10px;
overflow:hidden;
box-shadow:0 16px 40px rgba(0,0,0,.35);
user-select:none;
}
.bg-map{
background:
radial-gradient(circle at 20% 30%, rgba(62,126,89,.22) 0 10%, transparent 11%),
radial-gradient(circle at 68% 18%, rgba(78,127,76,.18) 0 9%, transparent 10%),
radial-gradient(circle at 78% 75%, rgba(60,114,83,.18) 0 8%, transparent 9%),
linear-gradient(90deg, transparent 0 23%, rgba(0,0,0,.08) 23.1%, transparent 23.2%, transparent 48%, rgba(0,0,0,.06) 48.1%, transparent 48.2%, transparent 72%, rgba(0,0,0,.08) 72.1%, transparent 72.2%),
linear-gradient(0deg, transparent 0 23%, rgba(0,0,0,.08) 23.1%, transparent 23.2%, transparent 48%, rgba(0,0,0,.06) 48.1%, transparent 48.2%, transparent 72%, rgba(0,0,0,.08) 72.1%, transparent 72.2%),
linear-gradient(135deg,#ebe5cf,#e1dcc6 50%,#e8e3d1);
background-size:auto,auto,auto,180px 180px,180px 180px,auto;
}
.bg-rx{
background:
linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.18)),
radial-gradient(circle at 70% 25%, rgba(46,119,124,.16), transparent 20%),
radial-gradient(circle at 28% 60%, rgba(173,127,46,.18), transparent 24%),
linear-gradient(180deg,#212724,#151b18 55%, #111714);
}
.bg-dark{background:#111}
.bg-light{background:#f2efe7}
.gridOverlay{
position:absolute;inset:0;pointer-events:none;opacity:0;
background-image:
linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
background-size:40px 40px;
}
.gridOverlay.show{opacity:1}
.crosshair{
position:absolute;width:100%;height:100%;pointer-events:none;opacity:.0;
background:
linear-gradient(90deg, transparent 49.95%, rgba(255,0,0,.45) 49.95%, rgba(255,0,0,.45) 50.05%, transparent 50.05%),
linear-gradient(0deg, transparent 49.95%, rgba(255,0,0,.45) 49.95%, rgba(255,0,0,.45) 50.05%, transparent 50.05%);
}
.crosshair.show{opacity:1}
.bubble{
position:absolute;
left:18%; top:68%;
transform:translate(-50%,-50%) scale(.64) rotate(-4deg);
width:620px;
opacity:1;
cursor:grab;
filter:drop-shadow(0 10px 16px rgba(0,0,0,.32));
transform-origin:center center;
}
.bubble.dragging{cursor:grabbing}
.bubbleSvg{display:block;width:100%;height:auto}
.bubbleText{
position:absolute;
left:84px; right:78px; top:92px; bottom:102px;
display:flex; align-items:center; justify-content:center;
text-align:left;
font-weight:900;
font-style:italic;
color:#1a1a1a;
font-size:28px;
line-height:1.02;
letter-spacing:-.3px;
text-transform:uppercase;
white-space:pre-wrap;
overflow:hidden;
}
.codeOut{
white-space:pre-wrap;
font-family:Consolas, monospace;
font-size:12px;
background:#081009;
border:1px solid #334034;
color:#dff0c7;
border-radius:10px;
padding:10px;
min-height:124px;
}
.hint{
font-size:12px;color:#b8c7a0;line-height:1.45;margin-top:8px;
}
.topBadge{
position:absolute; right:10px; top:10px;
background:rgba(0,0,0,.58); color:#fff; font:700 12px Arial;
padding:8px 10px; border-radius:8px; z-index:3;
}
.fileInput{font-size:12px;color:#c9d4b4}
@media (max-width:1100px){
.app{grid-template-columns:1fr}
.sidebar{height:46vh;border-right:none;border-bottom:1px solid var(--panel-border)}
.stageWrap{height:54vh}
}
</style></head><body><div class="app"><aside class="sidebar"><h1>Тест ономатопей</h1><p class="lead">Sandbox для підбору <b>розміру</b>, <b>тексту</b>, <b>позиції</b>, <b>нахилу</b> та <b>масштабу</b> плашки. Можна рухати мишкою прямо по сцені.</p><div class="group"><h2>Текст</h2><textarea id="textInput">Почнемо з карти.
Для початку розберись із масштабом.
Натисни «+», потім «−».</textarea><div class="inline2" style="margin-top:10px"><button id="presetShort" class="secondary">Коротка фраза</button><button id="presetLong" class="secondary">Довша фраза</button></div></div><div class="group"><h2>Сцена</h2><div class="row"><label>Фон сцени</label><select id="bgMode"><option value="map">Карта</option><option value="rx">RX-01</option><option value="dark">Темний</option><option value="light">Світлий</option><option value="custom">Свій фон</option></select></div><div class="row"><label>Розмір сцени</label><select id="stageSize"><option value="1366x768">1366 × 768</option><option value="1618x972">1618 × 972</option><option value="1280x720">1280 × 720</option><option value="1920x1080">1920 × 1080</option></select></div><div class="row"><label>Сітка</label><input id="showGrid" type="checkbox" /></div><div class="row"><label>Центр</label><input id="showCross" type="checkbox" /></div><div class="row"><label>Завантажити фон</label><input id="bgUpload" class="fileInput" type="file" accept="image/*" /></div></div><div class="group"><h2>Плашка</h2><div class="row"><label>Ширина плашки</label><input id="bubbleWidth" type="number" value="620" min="180" max="1200" /></div><div class="row"><label>Scale</label><input id="scale" type="range" min="0.2" max="2" step="0.01" value="0.64" /></div><div class="row"><label>Кут (°)</label><input id="rotate" type="range" min="-35" max="35" step="0.1" value="-4" /></div><div class="row"><label>Прозорість</label><input id="opacity" type="range" min="0.15" max="1" step="0.01" value="1" /></div><div class="row"><label>X (%)</label><input id="posX" type="range" min="0" max="100" step="0.1" value="18" /></div><div class="row"><label>Y (%)</label><input id="posY" type="range" min="0" max="100" step="0.1" value="68" /></div><div class="row"><label>Тінь</label><input id="shadowToggle" type="checkbox" checked /></div><div class="row"><label>Завантажити PNG плашку</label><input id="bubbleUpload" class="fileInput" type="file" accept="image/*" /></div></div><div class="group"><h2>Текст у плашці</h2><div class="row"><label>Розмір тексту</label><input id="fontSize" type="range" min="12" max="72" step="1" value="28" /></div><div class="row"><label>Line-height</label><input id="lineHeight" type="range" min="0.75" max="1.6" step="0.01" value="1.02" /></div><div class="row"><label>Letter-spacing</label><input id="letterSpacing" type="range" min="-2" max="4" step="0.1" value="-0.3" /></div><div class="row"><label>Колір тексту</label><input id="textColor" type="color" value="#1a1a1a" /></div><div class="row"><label>Стиль</label><select id="fontStyle"><option value="italic">Italic</option><option value="normal">Normal</option></select></div><div class="row"><label>Вирівнювання</label><select id="textAlign"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></div><div class="row"><label>Uppercase</label><input id="uppercase" type="checkbox" checked /></div></div><div class="group"><h2>Внутрішні відступи</h2><div class="row"><label>Top</label><input id="padTop" type="number" min="0" max="300" value="92" /></div><div class="row"><label>Right</label><input id="padRight" type="number" min="0" max="300" value="78" /></div><div class="row"><label>Bottom</label><input id="padBottom" type="number" min="0" max="300" value="102" /></div><div class="row"><label>Left</label><input id="padLeft" type="number" min="0" max="300" value="84" /></div></div><div class="group"><h2>Експорт</h2><div class="btns"><button id="copyCss">Скопіювати CSS</button><button id="copyJson">Скопіювати JSON</button><button id="resetBtn" class="secondary">Скинути</button><button id="copyText" class="secondary">Скопіювати фразу</button></div><div id="codeOut" class="codeOut"></div><div class="hint">Порада: перетягуй плашку мишкою, а потім дивись точні X/Y у коді.</div></div></aside><main class="stageWrap"><div id="stage" class="stage bg-map"><div class="topBadge" id="topBadge">1366 × 768</div><div id="gridOverlay" class="gridOverlay"></div><div id="crosshair" class="crosshair"></div><div id="bubble" class="bubble"><img id="bubbleImage" class="bubbleSvg" alt="bubble" /><div id="bubbleText" class="bubbleText"></div></div></div></main></div><script>
const els = {
stage: document.getElementById('stage'),
bubble: document.getElementById('bubble'),
bubbleText: document.getElementById('bubbleText'),
bubbleImage: document.getElementById('bubbleImage'),
textInput: document.getElementById('textInput'),
bgMode: document.getElementById('bgMode'),
stageSize: document.getElementById('stageSize'),
showGrid: document.getElementById('showGrid'),
showCross: document.getElementById('showCross'),
bgUpload: document.getElementById('bgUpload'),
bubbleUpload: document.getElementById('bubbleUpload'),
bubbleWidth: document.getElementById('bubbleWidth'),
scale: document.getElementById('scale'),
rotate: document.getElementById('rotate'),
opacity: document.getElementById('opacity'),
posX: document.getElementById('posX'),
posY: document.getElementById('posY'),
shadowToggle: document.getElementById('shadowToggle'),
fontSize: document.getElementById('fontSize'),
lineHeight: document.getElementById('lineHeight'),
letterSpacing: document.getElementById('letterSpacing'),
textColor: document.getElementById('textColor'),
fontStyle: document.getElementById('fontStyle'),
textAlign: document.getElementById('textAlign'),
uppercase: document.getElementById('uppercase'),
padTop: document.getElementById('padTop'),
padRight: document.getElementById('padRight'),
padBottom: document.getElementById('padBottom'),
padLeft: document.getElementById('padLeft'),
codeOut: document.getElementById('codeOut'),
gridOverlay: document.getElementById('gridOverlay'),
crosshair: document.getElementById('crosshair'),
topBadge: document.getElementById('topBadge')
};
const defaultSVG = encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.1" fill="#000" opacity="0.25"/><circle cx="13" cy="13" r="1.8" fill="#000" opacity="0.18"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/></filter></defs><path filter="url(#shadow)" d="M46 72 L560 52 L642 118 L627 414 L159 414 L63 450 L78 414 L46 408 Z" fill="#f4eedc" stroke="#111" stroke-width="13" stroke-linejoin="round"/><path d="M46 72 L560 52 L642 118 L627 414 L159 414 L63 450 L78 414 L46 408 Z" fill="url(#dots)" opacity="0.7"/></svg>
`);
els.bubbleImage.src = 'data:image/svg+xml;charset=UTF-8,' + defaultSVG;
let customBgURL = '';
let customBubbleURL = '';
let drag = null;
function stageSizeApply() {
const [w,h] = els.stageSize.value.split('x').map(Number);
els.stage.style.width = w + 'px';
els.stage.style.height = h + 'px';
els.topBadge.textContent = `${w} × ${h}`;
}
function bgApply() {
els.stage.classList.remove('bg-map','bg-rx','bg-dark','bg-light');
const mode = els.bgMode.value;
if (mode === 'custom' && customBgURL) {
els.stage.style.backgroundImage = `url('${customBgURL}')`;
els.stage.style.backgroundSize = 'cover';
els.stage.style.backgroundPosition = 'center';
els.stage.style.backgroundColor = '#111';
} else {
els.stage.style.backgroundImage = '';
els.stage.style.backgroundSize = '';
els.stage.style.backgroundPosition = '';
els.stage.classList.add(
mode === 'map' ? 'bg-map' :
mode === 'rx' ? 'bg-rx' :
mode === 'dark' ? 'bg-dark' : 'bg-light'
);
}
}
function update() {
els.bubble.style.width = els.bubbleWidth.value + 'px';
els.bubble.style.left = els.posX.value + '%';
els.bubble.style.top = els.posY.value + '%';
els.bubble.style.opacity = els.opacity.value;
els.bubble.style.transform = `translate(-50%,-50%) scale(${els.scale.value}) rotate(${els.rotate.value}deg)`;
els.bubble.style.filter = els.shadowToggle.checked
? 'drop-shadow(0 10px 16px rgba(0,0,0,.32))'
: 'none';
els.bubbleText.textContent = els.textInput.value;
els.bubbleText.style.fontSize = els.fontSize.value + 'px';
els.bubbleText.style.lineHeight = els.lineHeight.value;
els.bubbleText.style.letterSpacing = els.letterSpacing.value + 'px';
els.bubbleText.style.color = els.textColor.value;
els.bubbleText.style.fontStyle = els.fontStyle.value;
els.bubbleText.style.textAlign = els.textAlign.value;
els.bubbleText.style.textTransform = els.uppercase.checked ? 'uppercase' : 'none';
els.bubbleText.style.left = els.padLeft.value + 'px';
els.bubbleText.style.right = els.padRight.value + 'px';
els.bubbleText.style.top = els.padTop.value + 'px';
els.bubbleText.style.bottom = els.padBottom.value + 'px';
els.gridOverlay.classList.toggle('show', els.showGrid.checked);
els.crosshair.classList.toggle('show', els.showCross.checked);
stageSizeApply();
bgApply();
renderCode();
}
function renderCode() {
const css = `.onoWrap{\n  left:${Number(els.posX.value).toFixed(1)}%;\n  top:${Number(els.posY.value).toFixed(1)}%;\n  width:${els.bubbleWidth.value}px;\n  opacity:${els.opacity.value};\n  transform:translate(-50%,-50%) scale(${els.scale.value}) rotate(${els.rotate.value}deg);\n  filter:${els.shadowToggle.checked ? 'drop-shadow(0 10px 16px rgba(0,0,0,.32))' : 'none'};\n}\n.onoText{\n  left:${els.padLeft.value}px;\n  right:${els.padRight.value}px;\n  top:${els.padTop.value}px;\n  bottom:${els.padBottom.value}px;\n  font-size:${els.fontSize.value}px;\n  line-height:${els.lineHeight.value};\n  letter-spacing:${els.letterSpacing.value}px;\n  color:${els.textColor.value};\n  font-style:${els.fontStyle.value};\n  text-align:${els.textAlign.value};\n  text-transform:${els.uppercase.checked ? 'uppercase' : 'none'};\n}`;
const json = {
xPercent: Number(els.posX.value),
yPercent: Number(els.posY.value),
width: Number(els.bubbleWidth.value),
scale: Number(els.scale.value),
rotate: Number(els.rotate.value),
opacity: Number(els.opacity.value),
fontSize: Number(els.fontSize.value),
lineHeight: Number(els.lineHeight.value),
letterSpacing: Number(els.letterSpacing.value),
textColor: els.textColor.value,
textAlign: els.textAlign.value,
fontStyle: els.fontStyle.value,
uppercase: els.uppercase.checked,
padding: {
top: Number(els.padTop.value),
right: Number(els.padRight.value),
bottom: Number(els.padBottom.value),
left: Number(els.padLeft.value)
},
text: els.textInput.value
};
els.codeOut.textContent = css + "\n\nJSON:\n" + JSON.stringify(json, null, 2);
}
function copy(text) {
navigator.clipboard.writeText(text).then(()=>{
const old = document.title;
document.title = 'Скопійовано ✓';
setTimeout(()=>document.title=old, 900);
});
}
document.getElementById('copyCss').onclick = () => {
const all = els.codeOut.textContent.split('\n\nJSON:')[0];
copy(all);
};
document.getElementById('copyJson').onclick = () => {
const all = els.codeOut.textContent.split('JSON:\n')[1];
copy(all);
};
document.getElementById('copyText').onclick = () => copy(els.textInput.value);
document.getElementById('resetBtn').onclick = () => location.reload();
document.getElementById('presetShort').onclick = () => { els.textInput.value = 'Північ угорі.\nТепер — GPS.'; update(); };
document.getElementById('presetLong').onclick = () => { els.textInput.value = 'Почнемо з карти.\nДля початку розберись із масштабом.\nНатисни «+», потім «−».'; update(); };
[...document.querySelectorAll('input, select, textarea')].forEach(el => {
el.addEventListener('input', update);
el.addEventListener('change', update);
});
els.bgUpload.addEventListener('change', e => {
const file = e.target.files[0];
if (!file) return;
customBgURL = URL.createObjectURL(file);
els.bgMode.value = 'custom';
update();
});
els.bubbleUpload.addEventListener('change', e => {
const file = e.target.files[0];
if (!file) return;
customBubbleURL = URL.createObjectURL(file);
els.bubbleImage.src = customBubbleURL;
});
els.bubble.addEventListener('pointerdown', e => {
const rect = els.stage.getBoundingClientRect();
const bubbleRect = els.bubble.getBoundingClientRect();
drag = {
offsetX: e.clientX - bubbleRect.left - bubbleRect.width / 2,
offsetY: e.clientY - bubbleRect.top - bubbleRect.height / 2,
rect
};
els.bubble.classList.add('dragging');
els.bubble.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove', e => {
if (!drag) return;
const rect = els.stage.getBoundingClientRect();
let x = ((e.clientX - rect.left - drag.offsetX) / rect.width) * 100;
let y = ((e.clientY - rect.top - drag.offsetY) / rect.height) * 100;
x = Math.max(0, Math.min(100, x));
y = Math.max(0, Math.min(100, y));
els.posX.value = x.toFixed(1);
els.posY.value = y.toFixed(1);
update();
});
window.addEventListener('pointerup', () => {
if (!drag) return;
drag = null;
els.bubble.classList.remove('dragging');
});
update();
</script></body></html>
