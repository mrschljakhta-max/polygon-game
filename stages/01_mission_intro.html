<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RX-01 — коміксова заставка</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
body{font-family:Arial,sans-serif}
.stage{
  position:fixed; inset:0; margin:auto;
  width:min(100vw,calc(100vh * 1.7777778));
  height:min(100vh,calc(100vw / 1.7777778));
  background:#050505;
  overflow:hidden;
}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:27.35fr 23.15fr 24.55fr 24.95fr;background:#050505}
.panel{position:relative;overflow:hidden;background:#050505;border-right:5px solid #090909;visibility:hidden;opacity:0;transition:opacity 1s ease}
.panel:last-child{border-right:0}
.panel.show{visibility:visible;opacity:1}
.panel>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.caption{position:absolute;z-index:3;visibility:hidden;opacity:0;transition:opacity 1s ease;filter:drop-shadow(0 6px 5px rgba(0,0,0,.45))}
.caption.show{visibility:visible;opacity:1}
.caption img{display:block;width:100%;height:auto}
.polygon{left:2.5%;top:2.2%;width:92%}
.krr{left:2%;top:27%;width:94%}
.first{left:4%;bottom:6%;width:91%}
.contact{left:8%;top:58%;width:84%}
.today{left:4%;top:8%;width:92%}
.click{left:11%;bottom:4%;width:78%}
.next{position:absolute;right:2%;bottom:2%;z-index:20;visibility:hidden;opacity:0;min-width:220px;min-height:78px;border:2px solid #111;background:#e9c443;color:#111;font:1000 clamp(22px,2vw,32px)/1 Arial,sans-serif;letter-spacing:.08em;padding:22px 44px;cursor:pointer;box-shadow:6px 6px 0 #111;transition:opacity .8s ease,transform .18s ease}
.next.show{visibility:visible;opacity:1}
.next:hover{transform:translateY(-2px)}
.next:active{transform:translateY(0)}
@media(max-width:1100px){
  .panel{border-right:3px solid #090909}
  .next{min-width:176px;min-height:64px;padding:18px 32px;font-size:clamp(19px,3.5vw,26px)}
}
</style>
</head>
<body>
<div class="stage">
  <div class="grid">
    <section class="panel" id="p1">
      <img class="bg" src="../assets/p12_0001_75ac8f55381f6d4f.png" alt="Полігон">
      <div class="caption polygon" id="polygon"><img src="../assets/p12_0002_291aae677fbf1554.png" alt="Полігон 07:02"></div>
      <div class="caption krr" id="krr"><img src="../assets/p12_0003_c2364a798163c06e.png" alt="КРРР—ШШШШШ!"></div>
    </section>
    <section class="panel" id="p2">
      <img class="bg" src="../assets/p12_0004_1a7ca5a121643e2b.png" alt="RX-01">
      <div class="caption first" id="first"><img src="../assets/p12_0005_7b1da80d0ebb29a4.png" alt="Перший виїзд!"></div>
    </section>
    <section class="panel" id="p3">
      <img class="bg" src="../assets/p12_0006_3d3f9a54d7658dc1.png" alt="Інструктор">
      <div class="caption contact" id="contact"><img src="../assets/p12_0007_34a9f29a7dcdadfb.png" alt="На зв'язок!!!"></div>
    </section>
    <section class="panel" id="p4">
      <img class="bg" src="../assets/p12_0008_b3e4af93c493ff55.png" alt="Робота з RX-01">
      <div class="caption today" id="today"><img src="../assets/p12_0009_c05e2a04d5681c71.png" alt="Сьогодні працюєш сам — я поруч."></div>
      <div class="caption click" id="click"><img src="../assets/p12_0010_5d139dc50b67217f.png" alt="Клац!"></div>
    </section>
  </div>
  <button class="next" id="nextBtn">ДАЛІ</button>
</div>
<script>
const seq=[
  ['p1',0],
  ['polygon',2000],
  ['krr',4000],
  ['p2',6000],
  ['first',8000],
  ['p3',10000],
  ['contact',12000],
  ['p4',14000],
  ['today',16000],
  ['click',18000]
];
let timers=[];
function run(){
  timers.forEach(clearTimeout);timers=[];
  document.querySelectorAll('.panel,.caption,#nextBtn').forEach(el=>el.classList.remove('show'));
  seq.forEach(([id,t])=>timers.push(setTimeout(()=>document.getElementById(id).classList.add('show'),t)));
  timers.push(setTimeout(()=>document.getElementById('nextBtn').classList.add('show'),20000));
}
function goNext(){
  try{parent.postMessage({type:'RX01_INTRO_DONE'},'*')}catch(e){}
}
document.getElementById('nextBtn').addEventListener('click',goNext);
window.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&document.getElementById('nextBtn').classList.contains('show')){e.preventDefault();goNext()}});
run();
</script>
</body>
</html>
