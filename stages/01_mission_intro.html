<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RX-01 — коміксова заставка</title>
<link rel="preload" as="image" href="../assets/p12_0001_75ac8f55381f6d4f.png" fetchpriority="high">
<link rel="preload" as="image" href="../assets/p12_0002_291aae677fbf1554.png" fetchpriority="high">
<link rel="preload" as="image" href="../assets/p12_0003_c2364a798163c06e.png" fetchpriority="high">
<link rel="preload" as="image" href="../assets/button_dali_exact.webp?v=20260827-real1" fetchpriority="low">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
body{font-family:Arial,sans-serif}
.stage{
  position:fixed;inset:0;margin:auto;
  width:min(100vw,calc(100vh * 1.7777778));
  height:min(100vh,calc(100vw / 1.7777778));
  background:#050505;overflow:hidden
}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:27.35fr 23.15fr 24.55fr 24.95fr;background:#050505}
.panel{position:relative;overflow:hidden;background:#050505;border-right:5px solid #090909;visibility:hidden;opacity:0;transition:opacity 1s ease;will-change:opacity}
.panel:last-child{border-right:0}
.panel.show{visibility:visible;opacity:1}
.panel>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.caption{position:absolute;z-index:3;visibility:hidden;opacity:0;transition:opacity 1s ease;filter:drop-shadow(0 6px 5px rgba(0,0,0,.45));will-change:opacity}
.caption.show{visibility:visible;opacity:1}
.caption img{display:block;width:100%;height:auto}
.polygon{left:2.5%;top:2.2%;width:92%}
.krr{left:2%;top:27%;width:94%}
.first{left:4%;bottom:6%;width:91%}
.contact{left:8%;top:58%;width:84%}
.today{left:4%;top:8%;width:92%}
.click{left:11%;bottom:4%;width:78%}
.next{
  position:absolute;
  left:83.4089%;
  top:89.4797%;
  width:16.3735%;
  height:9.9742%;
  z-index:20;
  visibility:hidden;
  opacity:0;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  cursor:pointer;
  transform:translateY(10px) scale(.96);
  transform-origin:center;
  transition:opacity .38s ease,transform .42s cubic-bezier(.2,.9,.25,1);
  -webkit-tap-highlight-color:transparent
}
.next.show{visibility:visible;opacity:1;transform:translateY(0) scale(1)}
.next img{
  display:block;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;
  transform-origin:center;
  filter:drop-shadow(5px 7px 0 rgba(0,0,0,.78))
}
.next.show img{animation:nextIdle 2.4s ease-in-out .55s infinite}
.next:hover img{animation:none;transform:scale(1.045);filter:drop-shadow(7px 9px 0 rgba(0,0,0,.82)) drop-shadow(0 0 14px rgba(255,210,35,.25))}
.next:active img{animation:none;transform:scale(.975);filter:drop-shadow(3px 4px 0 rgba(0,0,0,.82))}
.next:focus-visible{outline:3px solid #fff2a8;outline-offset:5px}
@keyframes nextIdle{
  0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(5px 7px 0 rgba(0,0,0,.78)) drop-shadow(0 0 0 rgba(255,210,35,0))}
  50%{transform:translateY(-2px) scale(1.025);filter:drop-shadow(6px 9px 0 rgba(0,0,0,.8)) drop-shadow(0 0 13px rgba(255,210,35,.24))}
}
@media(prefers-reduced-motion:reduce){.panel,.caption,.next{transition:none!important}.next.show img{animation:none!important}}
@media(max-width:1100px){.panel{border-right:3px solid #090909}}
</style>
</head>
<body>
<div class="stage">
  <div class="grid">
    <section class="panel" id="p1">
      <img class="bg" src="../assets/p12_0001_75ac8f55381f6d4f.png" alt="Полігон" loading="eager" decoding="async" fetchpriority="high">
      <div class="caption polygon" id="polygon"><img src="../assets/p12_0002_291aae677fbf1554.png" alt="Полігон 07:02" loading="eager" decoding="async" fetchpriority="high"></div>
      <div class="caption krr" id="krr"><img src="../assets/p12_0003_c2364a798163c06e.png" alt="КРРР—ШШШШШ!" loading="eager" decoding="async" fetchpriority="high"></div>
    </section>
    <section class="panel" id="p2">
      <img class="bg" src="../assets/p12_0004_1a7ca5a121643e2b.png" alt="RX-01" loading="eager" decoding="async" fetchpriority="low">
      <div class="caption first" id="first"><img src="../assets/p12_0005_7b1da80d0ebb29a4.png" alt="Перший виїзд!" loading="eager" decoding="async" fetchpriority="low"></div>
    </section>
    <section class="panel" id="p3">
      <img class="bg" src="../assets/p12_0006_3d3f9a54d7658dc1.png" alt="Інструктор" loading="eager" decoding="async" fetchpriority="low">
      <div class="caption contact" id="contact"><img src="../assets/p12_0007_34a9f29a7dcdadfb.png" alt="На зв'язок!!!" loading="eager" decoding="async" fetchpriority="low"></div>
    </section>
    <section class="panel" id="p4">
      <img class="bg" src="../assets/p12_0008_b3e4af93c493ff55.png" alt="Робота з RX-01" loading="eager" decoding="async" fetchpriority="low">
      <div class="caption today" id="today"><img src="../assets/p12_0009_c05e2a04d5681c71.png" alt="Сьогодні працюєш сам — я поруч." loading="eager" decoding="async" fetchpriority="low"></div>
      <div class="caption click" id="click"><img src="../assets/p12_0010_5d139dc50b67217f.png" alt="Клац!" loading="eager" decoding="async" fetchpriority="low"></div>
    </section>
  </div>
  <button class="next" id="nextBtn" aria-label="Далі"><img src="../assets/button_dali_exact.webp?v=20260827-real1" alt="" draggable="false"></button>
</div>
<script>
const frameGroups=['p1','p2','p3','p4'];
const imageReady=new WeakMap();
function prepareImage(image){
  if(imageReady.has(image))return imageReady.get(image);
  const loaded=image.complete?Promise.resolve():new Promise(resolve=>{
    image.addEventListener('load',resolve,{once:true});
    image.addEventListener('error',resolve,{once:true});
  });
  const ready=loaded.then(async()=>{
    if(!image.naturalWidth||typeof image.decode!=='function')return;
    try{await image.decode()}catch(error){}
  });
  imageReady.set(image,ready);
  return ready;
}
function prepareElement(id){const element=document.getElementById(id);return Promise.all([...element.querySelectorAll('img')].map(prepareImage))}
const groupReady=new Map(frameGroups.map(id=>[id,prepareElement(id)]));
const wait=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));
const nextPaint=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
async function reveal(id,groupId=id){if(groupReady.has(groupId))await groupReady.get(groupId);document.getElementById(id).classList.add('show')}
async function run(){
  document.querySelectorAll('.panel,.caption,#nextBtn').forEach(el=>el.classList.remove('show'));
  await groupReady.get('p1');
  await nextPaint();
  await reveal('p1','p1');
  await wait(2000);
  await reveal('polygon','p1');
  await wait(2000);
  await reveal('krr','p1');
  await wait(2000);
  await reveal('p2','p2');
  await wait(2000);
  await reveal('first','p2');
  await wait(2000);
  await reveal('p3','p3');
  await wait(2000);
  await reveal('contact','p3');
  await wait(2000);
  await reveal('p4','p4');
  await wait(2000);
  await reveal('today','p4');
  await wait(2000);
  await reveal('click','p4');
  await wait(2000);
  document.getElementById('nextBtn').classList.add('show');
}
function goNext(){try{parent.postMessage({type:'RX01_INTRO_DONE'},'*')}catch(e){}}
document.getElementById('nextBtn').addEventListener('click',goNext);
window.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&document.getElementById('nextBtn').classList.contains('show')){e.preventDefault();goNext()}});
run();
</script>
</body>
</html>
