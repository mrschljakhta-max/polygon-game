<script>
const frameGroups=['p1','p2','p3','p4'];const imageReady=new WeakMap();
function prepareImage(image){if(imageReady.has(image))return imageReady.get(image);const loaded=image.complete?Promise.resolve():new Promise(resolve=>{image.addEventListener('load',resolve,{once:true});image.addEventListener('error',resolve,{once:true})});const ready=loaded.then(async()=>{if(!image.naturalWidth||typeof image.decode!=='function')return;try{await image.decode()}catch(error){}});imageReady.set(image,ready);return ready}
function prepareElement(id){const element=document.getElementById(id);return Promise.all([...element.querySelectorAll('img')].map(prepareImage))}
const groupReady=new Map(frameGroups.map(id=>[id,prepareElement(id)]));const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));const nextPaint=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
async function reveal(id,groupId=id){if(groupReady.has(groupId))await groupReady.get(groupId);document.getElementById(id).classList.add('show')}
async function run(){document.querySelectorAll('.panel,.caption,#nextBtn').forEach(el=>el.classList.remove('show'));await groupReady.get('p1');await nextPaint();await reveal('p1','p1');await wait(2000);await reveal('polygon','p1');await wait(2000);await reveal('krr','p1');await wait(2000);await reveal('p2','p2');await wait(2000);await reveal('first','p2');await wait(2000);await reveal('p3','p3');await wait(2000);await reveal('contact','p3');await wait(2000);await reveal('p4','p4');await wait(2000);await reveal('today','p4');await wait(2000);await reveal('click','p4');await wait(2000);document.getElementById('nextBtn').classList.add('show')}
function goNext(){try{parent.postMessage({type:'RX01_INTRO_DONE'},'*')}catch(e){}}
document.getElementById('nextBtn').addEventListener('click',goNext);window.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&document.getElementById('nextBtn').classList.contains('show')){e.preventDefault();goNext()}});run();
</script>
