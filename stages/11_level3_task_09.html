<script>

const RX_EMO={"05_displeased": "../assets/asset_0024_fc8c07f27522be7b.png", "01_neutral": "../assets/asset_0015_8a9f2b53c4cb74b5.png", "03_approval": "../assets/asset_0025_9dbffa15836adb10.png", "04_think": "../assets/asset_0026_3914834e8434d0f6.png", "08_victory": "../assets/asset_0027_d98edc8a97ff1582.png", "07_hint": "../assets/asset_0017_69b9347013345bb0.png", "06_angry": "../assets/asset_0028_4494bc88abe8df1a.png", "02_command": "../assets/asset_0018_47f319ec4ea0381c.png"};
const RX_ONO={"05": "../assets/asset_0029_8694f4cebb6b1958.png", "12": "../assets/asset_0030_c88fac623639f6d0.png", "08": "../assets/asset_0031_531ebf55ad91d975.png", "02": "../assets/asset_0032_1ea6e705e4eac417.png", "09": "../assets/asset_0033_1cb0400dd270b71f.png", "04": "../assets/asset_0034_25c0257ac2aa7731.png", "10": "../assets/asset_0035_1a810fa03ce800d6.png", "11": "../assets/asset_0036_1a6af5f3e5536dfc.png", "06": "../assets/asset_0037_61a4801422be661b.png", "07": "../assets/asset_0038_fd5cb468564821f7.png", "03": "../assets/asset_0039_68b51272aaab9aac.png", "01": "../assets/asset_0040_5f48ed5c614017fa.png"};
let rxErrors=0, rxOnoBusy=false, rxOnoTimer=null;
const rxTaskPlaque=document.getElementById('rxTaskPlaque');
const rxErrorPlaque=document.getElementById('rxErrorPlaque');
const rxPetro=document.getElementById('rxPetro');
const rxOno=document.getElementById('rxOno');

function rxShowOno(key,emo,holdMs){
  if(rxOnoBusy) return; // Петрович не перебиває сам себе
  rxOnoBusy=true;
  if(RX_EMO[emo]) rxPetro.src=RX_EMO[emo];
  if(RX_ONO[key]) rxOno.src=RX_ONO[key];
  rxOno.classList.remove('show'); void rxOno.offsetWidth; rxOno.classList.add('show');
  clearTimeout(rxOnoTimer);
  rxOnoTimer=setTimeout(()=>{
    rxOno.classList.remove('show');
    setTimeout(()=>{rxOnoBusy=false;},180);
  },Math.max(2000,holdMs||2000));
}
function rxSetTask(n){rxTaskPlaque.textContent='ЗАВДАННЯ '+String(n).padStart(2,'0')+' / 10';rxTaskPlaque.classList.remove('bump');void rxTaskPlaque.offsetWidth;rxTaskPlaque.classList.add('bump')}
function rxSetErrors(n){rxErrors=n;rxErrorPlaque.textContent='ПОМИЛОК: '+n}

(() => {
  const CONFIG=window.RX01_CONFIG||{};
  const MISSION=Number(CONFIG.mission||6);
  const IS_JORDAN=!!CONFIG.jordan;
  const JORDAN_STEPS=[
    {target:42,falsePeaks:[{az:218,strength:5.5,width:24}]},
    {target:118,falsePeaks:[{az:305,strength:6.4,width:18},{az:23,strength:4.2,width:24}]},
    {target:203,falsePeaks:[{az:82,strength:6.8,width:17}]},
    {target:311,falsePeaks:[{az:154,strength:7.1,width:16},{az:28,strength:4.4,width:24}]},
    {target:257,falsePeaks:[{az:66,strength:6.2,width:19}]},
    {target:6,falsePeaks:[{az:186,strength:5.8,width:22}]}
  ];
  let jordanStep=0;
  let TARGET=IS_JORDAN?JORDAN_STEPS[0].target:Number(CONFIG.target||137);
  let FALSE_PEAKS=IS_JORDAN?JORDAN_STEPS[0].falsePeaks:(CONFIG.falsePeaks||[]);
  let taskIndex = 0;
  let wrongLocks = 0;
  let enabled = true;
  let locked = false;
  let az = 0;
  let mode = 'coarse';
  let scanning = false;
  let scanTimer = null;
  let measured = new Map();
  let noisePhase=IS_JORDAN?73.4:(MISSION*31.7);
  let holdTimer = null;
  let repeatTimer = null;
  let holdStartedAt = 0;

  const azEl = document.getElementById('azimuthDisplay');
  const signalDot = document.getElementById('signalDot');
  const signalHalo = document.getElementById('signalHalo');
  const hudAz = document.getElementById('hudAz');
  const hudSig = document.getElementById('hudSig');
  const feedback = document.getElementById('feedback');
  const beam = document.getElementById('beam');
  const beamDot = document.getElementById('beamDot');
  const scope = document.getElementById('scopeOverlay');
  const segs = [...document.querySelectorAll('.seg')];
  const flash = document.getElementById('successFlash');

  function norm(v) {
    v %= 360;
    if (v < 0) v += 360;
    return v;
  }

  function circularDiff(a,b) {
    let d = Math.abs(norm(a)-norm(b));
    return Math.min(d, 360-d);
  }

  function gauss(diff,width,amp){
    return amp * Math.exp(-0.5 * Math.pow(diff/width,2));
  }

  function rawSignal(a){
    const main = gauss(circularDiff(a,TARGET), 13, 10);
    let reflected = 0;
    for(const p of FALSE_PEAKS){
      reflected = Math.max(reflected, gauss(circularDiff(a,p.az),p.width,p.strength));
    }
    return Math.max(main,reflected);
  }

  function deterministicNoise(a){
    // Gentle, repeatable "radio" flutter. Exact true peak remains clearly strongest.
    const n1=Math.sin((a*0.73)+noisePhase)*0.28;
    const n2=Math.sin((a*1.91)+(noisePhase*0.37))*0.17;
    return n1+n2;
  }

  function signalPower(a){
    const base=rawSignal(a);
    let val=base + deterministicNoise(a);
    if(circularDiff(a,TARGET)<=1) val=Math.max(val,9.8);
    return Math.max(0,Math.min(10,val));
  }

  function signalLevel(a){
    return Math.max(0,Math.min(10,Math.round(signalPower(a))));
  }

  function heatColor(power){
    const p=Math.max(0,Math.min(10,power))/10;
    if(p<0.12) return `rgba(112,145,62,${0.10+p*0.5})`;
    if(p<0.55) return `rgba(205,166,34,${0.18+p*0.55})`;
    return `rgba(255,220,55,${0.34+p*0.62})`;
  }

  function recordMeasurement(angle,power){
    const key=Math.round(norm(angle));
    const prev=measured.get(key);
    if(prev==null || power>prev) measured.set(key,power);
  }

  function polarPoint(radius, angleDeg){
    const t=(angleDeg-90)*Math.PI/180;
    return {x:radius*Math.cos(t), y:radius*Math.sin(t)};
  }

  function arcPath(radius,startDeg,endDeg){
    const s=polarPoint(radius,startDeg);
    const e=polarPoint(radius,endDeg);
    const large=(endDeg-startDeg)>180?1:0;
    return `M ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${radius} ${radius} 0 ${large} 1 ${e.x.toFixed(2)} ${e.y.toFixed(2)}`;
  }

  function renderHeat(){
    const layer=document.getElementById('heatLayer');
    if(!layer) return;
    layer.innerHTML='';

    // Build 5° sectors from measured samples.
    const binSize=5;
    const bins=[];
    for(let start=0; start<360; start+=binSize){
      let values=[];
      for(const [angle,power] of measured.entries()){
        const a=((angle%360)+360)%360;
        if(a>=start && a<start+binSize) values.push(power);
      }
      if(values.length){
        const avg=values.reduce((a,b)=>a+b,0)/values.length;
        const max=Math.max(...values);
        bins.push({start,end:start+binSize,avg,max});
      }
    }

    // Draw subtle outer ring history.
    for(const b of bins){
      const p=Math.max(b.avg,b.max*0.86);
      if(p<0.7) continue;

      const arc=document.createElementNS('http://www.w3.org/2000/svg','path');
      arc.setAttribute('d',arcPath(101,b.start+0.6,b.end-0.6));
      arc.setAttribute('class','scanArc '+(p>=8.5?'peak':p>=6?'strong':p>=3?'mid':'weak'));
      arc.setAttribute('stroke-width', p>=8.5?'7.2':p>=6?'6.2':p>=3?'5.1':'4.2');
      arc.setAttribute('opacity', Math.min(1,0.18+p/11));
      layer.appendChild(arc);

      // Add a second inner arc for stronger sectors, making the scan read as a "band".
      if(p>=4){
        const inner=document.createElementNS('http://www.w3.org/2000/svg','path');
        inner.setAttribute('d',arcPath(93,b.start+0.9,b.end-0.9));
        inner.setAttribute('class','scanArc '+(p>=8.5?'peak':p>=6?'strong':'mid'));
        inner.setAttribute('stroke-width', p>=8.5?'3.8':p>=6?'3.2':'2.5');
        inner.setAttribute('opacity', Math.min(.9,0.10+p/13));
        layer.appendChild(inner);
      }
    }
  }

  function render() {
    const label = String(az).padStart(3,'0') + '°';
    azEl.textContent = label;
    hudAz.textContent = label;

    const power = signalPower(az);
    const sig = Math.max(0,Math.min(10,Math.round(power)));
    hudSig.textContent = power.toFixed(1) + '/10';
    recordMeasurement(az,power);
    renderHeat();

    segs.forEach((s,i) => {
      const lit = i >= (10 - sig);
      s.classList.toggle('on', lit);
      s.classList.toggle('hot', lit && sig >= 7);
      s.classList.toggle('peak', lit && power >= 9.7);
    });

    beam.setAttribute('transform', `rotate(${az} 0 0)`);
    beamDot.setAttribute('transform', `rotate(${az} 0 0)`);

    azEl.classList.remove('signal','hot','peak');
    if (power >= 3.5) azEl.classList.add('signal');
    if (power >= 7) azEl.classList.add('hot');
    if (power >= 9.7) azEl.classList.add('peak');

    // No direct source point in this mode: user must infer direction from measured field.
    signalDot.style.opacity='0';
    signalHalo.style.opacity='0';
    scope.classList.toggle('peak', power >= 9.7);

    if(scanning) feedback.textContent='SCAN: прочісування 0–359°';
    else if(power >= 9.7) feedback.textContent='Стабільний максимум. Можна LOCK.';
    else if(power >= 7) feedback.textContent='Сильний пік. Перевір, чи він головний.';
    else if(power >= 4) feedback.textContent='Сигнал є. Уточнюй.';
    else feedback.textContent='Шукай далі.';
  }

  function step(dir, amount=null) {
    if (!enabled || locked || scanning) return;
    const base = mode==='fine' ? 1 : 5;
    const delta = amount==null ? base : amount;
    az = norm(az + dir * delta);
    lastDir = dir;
    render();
  }

  function currentHoldStep() {
    const ms = performance.now() - holdStartedAt;
    const base = mode==='fine' ? 1 : 5;
    if (ms > 1800) return base*4;
    if (ms > 900) return base*2;
    return base;
  }

  function startHold(dir) {
    stopHold();
    holdStartedAt = performance.now();
    step(dir, mode==='fine'?1:5);
    holdTimer = setTimeout(() => {
      repeatTimer = setInterval(() => step(dir,currentHoldStep()), 90);
    }, 380);
  }

  function stopHold() {
    if (holdTimer) clearTimeout(holdTimer);
    if (repeatTimer) clearInterval(repeatTimer);
    holdTimer = repeatTimer = null;
  }

  function bindHold(el, dir) {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      el.setPointerCapture?.(e.pointerId);
      startHold(dir);
    });
    el.addEventListener('pointerup', stopHold);
    el.addEventListener('pointercancel', stopHold);
    el.addEventListener('pointerleave', e => {
      if (e.buttons === 0) stopHold();
    });
  }

  bindHold(document.getElementById('leftHit'), -1);
  bindHold(document.getElementById('rightHit'), +1);


  const scanBtn=document.getElementById('scanBtn');
  const modeBtn=document.getElementById('modeBtn');
  const clearHeatBtn=document.getElementById('clearHeatBtn');
  const scanState=document.getElementById('scanState');

  function setMode(next){
    mode=next;
    modeBtn.textContent=mode==='fine'?'FINE 1°':'COARSE 5°';
    modeBtn.classList.toggle('active',mode==='coarse');
    scanState.textContent=mode==='fine'?'ТОЧНЕ НАВЕДЕННЯ · 1°':'ГРУБИЙ ПОШУК · 5°';
  }
  modeBtn.addEventListener('click',()=>{ if(!scanning&&!locked) setMode(mode==='fine'?'coarse':'fine'); });
  clearHeatBtn.addEventListener('click',()=>{ if(!scanning){ measured.clear();renderHeat();scanState.textContent='ІСТОРІЮ ОЧИЩЕНО'; }});

  function stopScan(){
    if(scanTimer) clearInterval(scanTimer);
    scanTimer=null; scanning=false;
    scope.classList.remove('scanning');
    scanBtn.textContent='SCAN';
    scanBtn.classList.remove('active');
    modeBtn.disabled=false; clearHeatBtn.disabled=false;
    scanState.textContent='SCAN ЗАВЕРШЕНО · ЯСКРАВІ ДУГИ = СИЛЬНІ СЕКТОРИ';
    render();
  }

  function startScan(){
    if(scanning){stopScan();return}
    if(locked)return;
    scanning=true; enabled=false; locked=false;
    measured.clear(); renderHeat();
    az=0;
    scope.classList.add('scanning');
    scanBtn.textContent='STOP';
    scanBtn.classList.add('active');
    modeBtn.disabled=true; clearHeatBtn.disabled=true;
    scanState.textContent='АВТОСКАНУВАННЯ 0–359°';
    render();
    scanTimer=setInterval(()=>{
      az=norm(az+3);
      render();
      if(az>=357){
        clearInterval(scanTimer);scanTimer=null;
        scanning=false;enabled=true;
        scope.classList.remove('scanning');
        scanBtn.textContent='SCAN';scanBtn.classList.remove('active');
        modeBtn.disabled=false;clearHeatBtn.disabled=false;
        setMode('coarse');
        scanState.textContent='SCAN ЗАВЕРШЕНО · ОБЕРИ НАЙСИЛЬНІШУ ДУГУ';
      }
    },34);
  }
  scanBtn.addEventListener('click',startScan);

  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
      e.preventDefault(); startHold(-1);
    }
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
      e.preventDefault(); startHold(+1);
    }
    if (e.key === 'Enter') {
      e.preventDefault(); checkLock();
    }
    if (e.key.toLowerCase() === 's') {
      e.preventDefault(); startScan();
    }
    if (e.key.toLowerCase() === 'f' && !scanning && !locked) {
      e.preventDefault(); setMode(mode==='fine'?'coarse':'fine');
    }
  });
  document.addEventListener('keyup', e => {
    if (['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)) stopHold();
  });

  function toast(msg){
    const t=document.getElementById('taskToast'); t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),1000);
  }

  function setupAdvancedUI(){
      const title=document.getElementById('taskTitle'),text=document.getElementById('taskText'),
            progress=document.getElementById('taskProgress'),state=document.getElementById('taskState');
      const pb=document.getElementById('petroBox');if(pb)pb.style.display='none';
      rxSetTask(MISSION);rxSetErrors(0);
      if(IS_JORDAN){
        title.textContent='МІСІЯ ДЖОРДАНА';
        text.textContent='Тримай маяк. Джордан рухається — напрямок змінюється.';
        progress.textContent=`СЛІД ${jordanStep+1}/${JORDAN_STEPS.length}`;
        state.textContent='SCAN → COARSE → FINE → LOCK';
        return;
      }
      title.textContent=`ЗАВДАННЯ ${MISSION}/10`;
      if(MISSION===6){text.textContent='Точка джерела прихована. Знайди максимум тільки за шкалою.';progress.textContent='COARSE → FINE → LOCK';}
      else if(MISSION===7){text.textContent='Є хибний пік. Перевір, чи немає сильнішого.';progress.textContent='ПЕРЕВІР ПІКИ → FINE → LOCK';}
      else if(MISSION===8){text.textContent='Проскануй коло, знайди сильний сектор і уточни вручну.';progress.textContent='SCAN → COARSE → FINE → LOCK';}
      else{text.textContent='Контрольний пошук. Шум, відбиття, мінімум підказок.';progress.textContent='ЗНАЙДИ ДЖЕРЕЛО';}
      state.textContent='ТОЧКА ДЖЕРЕЛА ПРИХОВАНА';
    }

  function checkLock(){
      if(!enabled||locked||scanning)return;
      const d=circularDiff(az,TARGET),power=signalPower(az);
      if(d<=2&&power>=9.5){
        locked=true;enabled=false;
        document.getElementById('taskState').textContent='СПРАВЖНІЙ МАКСИМУМ ЗАФІКСОВАНО';
        toast('LOCK ✓ СПРАВЖНІЙ ПІК');
        flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');
        rxShowOno('12','03_approval',2100); // одна похвала за правильну дію

        if(IS_JORDAN){
          setTimeout(()=>{
            if(jordanStep<JORDAN_STEPS.length-1){
              jordanStep++;
              TARGET=JORDAN_STEPS[jordanStep].target;
              FALSE_PEAKS=JORDAN_STEPS[jordanStep].falsePeaks;
              az=norm(az+67);measured.clear();locked=false;enabled=true;scanning=false;setMode('coarse');
              document.getElementById('taskProgress').textContent=`СЛІД ${jordanStep+1}/${JORDAN_STEPS.length}`;
              document.getElementById('taskState').textContent='ДЖОРДАН ЗМІНИВ НАПРЯМОК';
              render();
            }else{
              document.getElementById('taskTitle').textContent='10/10 — ВИКОНАНО';
              document.getElementById('taskText').textContent='МІСІЯ ДЖОРДАНА ЗАВЕРШЕНА';
              document.getElementById('taskProgress').textContent='● ● ● ● ● ●';
              document.getElementById('taskState').textContent='РІВЕНЬ 3 ЗАВЕРШЕНО';
              setTimeout(()=>{try{parent.RX01_STAGE_DONE('complete')}catch(e){};try{parent.postMessage({type:'RX01_LEVEL3_COMPLETE'},'*')}catch(e){}},2300);
            }
          },2300);
        }else{
          setTimeout(()=>{try{parent.RX01_STAGE_DONE('advanced',MISSION)}catch(e){};try{parent.postMessage({type:'RX01_LEVEL3_ADV_DONE',mission:MISSION},'*')}catch(e){}},2300);
        }
      }else{
        wrongLocks++;rxSetErrors(wrongLocks);
        document.getElementById('taskState').textContent=power>=6.5?'СИЛЬНИЙ, АЛЕ НЕ ГОЛОВНИЙ ПІК':'LOCK: НЕ МАКСИМУМ';
        toast(power>=6.5?'ХИБНИЙ / НЕТОЧНИЙ ПІК':'НЕ МАКСИМУМ');
        rxShowOno('03','05_displeased',2100); // одна репліка на одну помилку
      }
    }
    document.getElementById('lockHit').addEventListener('click', checkLock);

  setupAdvancedUI();
  setMode('coarse');
  render();
})();
</script>
</body>
</html>
