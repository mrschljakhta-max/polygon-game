  const minValue=18;

  let lo=minValue,hi=maxValue,best=minValue;
  for(let i=0;i<12;i++){
    const mid=(lo+hi)/2;
    value.style.fontSize=mid+"px";
    unit.style.fontSize=Math.max(13,mid*0.43)+"px";
    if(value.scrollWidth+unit.scrollWidth+box.clientWidth*0.035<=available){
      best=mid;lo=mid;
    }else{
      hi=mid;
    }
  }
  value.style.fontSize=best+"px";
  unit.style.fontSize=Math.max(13,best*0.43)+"px";
}
function renderLCD(){
  const factor=UNIT_FACTOR[selectedUnit]||1;
  const value=input!=="" ? Number(input) : physicalHz/factor;
  $("#entry").textContent=compactNumber(value);
  $("#entryUnit").textContent=selectedUnit;
  requestAnimationFrame(fitLCDText);
}
function loadTask(){
 locked=false;wrongStreak=0;input="";
 const t=TASKS[taskIndex];
 physicalHz=t.from*UNIT_FACTOR[t.fromUnit];
 selectedUnit=t.fromUnit;
 $("#taskPlaque").textContent=`ЗАВДАННЯ ${String(taskIndex+1).padStart(2,"0")} / 10`;
 $("#errorPlaque").textContent=`ПОМИЛОК: ${errors}`;
 $("#taskBody").textContent=`${fmt(t.from)} ${t.fromUnit} → переведи у ${t.toUnit} та підтвердь LOCK`;
 renderLCD();
 instructor.src=EMO["02_command"];
 react("hint","02_command");
}
$$("[data-unit]").forEach(b=>b.onclick=()=>{
 if(locked)return;
 if(input!==""){
   const typed=Number(input.replace(",","."));
   if(Number.isFinite(typed)) physicalHz=typed*UNIT_FACTOR[selectedUnit];
   input="";
 }
 selectedUnit=b.dataset.unit;
 renderLCD();
 const t=TASKS[taskIndex];
 if(selectedUnit===t.toUnit) react("success","03_approval"); else react("think","04_think");
});
$$("[data-key]").forEach(b=>b.onclick=()=>{
 if(locked)return;
 const k=b.dataset.key;
 if(k==="back") input=input.slice(0,-1);
 else if(k==="." && input.includes(".")) return;
 else if(input.length<12) input+=k;
 renderLCD();
 if(input.length>=2) react("think","04_think");
});
$("#lock").onclick=()=>{
 if(locked)return;
 const t=TASKS[taskIndex];
 const shownValue=input!=="" ? Number(input.replace(",",".")) : physicalHz/UNIT_FACTOR[selectedUnit];
 const okUnit=selectedUnit===t.toUnit;
 const okValue=Math.abs(shownValue-Number(t.answer))<1e-8;
 if(okUnit && okValue){
   locked=true;wrongStreak=0;react(taskIndex===9?"victory":"success",taskIndex===9?"08_victory":"03_approval");
   setTimeout(()=>{if(taskIndex===9)finish();else{taskIndex++;loadTask();}},2300);
 } else {
   errors++;wrongStreak++;$("#errorPlaque").textContent=`ПОМИЛОК: ${errors}`;
   if(wrongStreak===1)react("mist","05_displeased"); else react("repeat","06_angry");
 }
};
window.addEventListener("resize",()=>requestAnimationFrame(fitLCDText));
window.addEventListener("orientationchange",()=>setTimeout(fitLCDText,120));
function finish(){
 $("#finalText").textContent=`ЗАВДАНЬ: 10 / 10 · ПОМИЛОК: ${errors}`;
 $("#gameOver").classList.remove("hidden");
}
</script>
</body></html>
