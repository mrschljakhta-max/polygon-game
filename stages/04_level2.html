const UNIT={Hz:1,kHz:1000,MHz:1000000,GHz:1000000000};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const instructor=$("#instructor"), phrase=$("#phrase"), entry=$("#entry"), entryUnit=$("#entryUnit"),
 taskBody=$("#taskBody"), taskPlaque=$("#taskPlaque span"), errorPlaque=$("#errorPlaque span"),
 proximity=$("#proximity"), proxText=$("#proxText"), tut=$("#tutorial"), tutBubble=$("#tutBubble"),
 tutInstructor=$("#tutInstructor"), tutNext=$("#tutNext"), tutHL=$("#tutorialHL");

];

];

function beginTutorial(steps,onDone){
 tutorialSteps=steps;tutIndex=0;tutorialDone=onDone;
 tut.classList.remove("hidden");showTutorial();
}
function showTutorial(){
 const s=tutorialSteps[tutIndex];
 tutInstructor.src=EMO[s.emo];tutBubble.innerHTML=s.text;

function react(id, emo="04_think", ms=2500){
 if(!PHRASES[id])return;
 instructor.src=EMO[emo]||EMO["01_neutral"];
 phrase.src=PHRASES[id];phrase.classList.remove("show");requestAnimationFrame(()=>phrase.classList.add("show"));

function fmtNumberString(s){return String(s).replace(".",",")}
function digitCount(s){return (String(s).match(/\d/g)||[]).length}
function parseBuffer(){const n=Number(String(buffer).replace(",","."));return Number.isFinite(n)?n:null}
function candidateHz(){const n=parseBuffer();return n===null?null:n*UNIT[selectedUnit]}
function tolerance(target){return Math.max(.5,Math.abs(target)*1e-10)}

 const n=hz/UNIT[u];
 if(Number.isInteger(n)) return String(n);

}
function fitLCD(){
 const box=$("#displayOverlay"),v=entry,u=entryUnit,avail=box.clientWidth*.94;
 let lo=17,hi=Math.max(28,Math.min(70,box.clientHeight*.54)),best=17;
 for(let i=0;i<12;i++){const mid=(lo+hi)/2;v.style.fontSize=mid+"px";u.style.fontSize=Math.max(12,mid*.42)+"px";if(v.scrollWidth+u.scrollWidth+box.clientWidth*.04<=avail){best=mid;lo=mid}else hi=mid}
 v.style.fontSize=best+"px";u.style.fontSize=Math.max(12,best*.42)+"px";

}
function setProximity(p,label){
 const raw=Math.max(0,Math.min(1,p));
 const n=raw<=0?0:Math.max(1,Math.min(12,Math.round(raw*12)));
 $$("#proxTrack .seg").forEach((s,i)=>s.classList.toggle("on",i<n));
 proxText.textContent=label;
}
function scheduleProbe(){
 clearTimeout(probeTimer);
 const t=TASKS[taskIndex];
 if(t.kind!=="shift"||!editedSinceTask||buffer===""||digitCount(buffer)<1)return;
 probeTimer=setTimeout(runProbe,950);
}
function runProbe(){
 const t=TASKS[taskIndex],c=candidateHz();if(c===null)return;
 const diff=Math.abs(c-t.targetHz);
 if(diff<=tolerance(t.targetHz)){
   setProximity(1,"ЦІЛЬ");
   react(17,"03_approval",2300);
   lastProbeDiff=diff;
   return;
 }
 if(probeStartDiff===null){
   probeStartDiff=Math.max(diff,1);
   lastProbeDiff=diff;
   setProximity(.5,"ТОЧКА СТАРТУ");

   else react(14,"07_hint",1800);
 }else if(lastProbeDiff!==null&&diff>lastProbeDiff+eps){
   label=p<=.18?"ДУЖЕ ХОЛОДНО":"ХОЛОДНІШЕ";
   if(p<=.18)react(19,"05_displeased",2100);
   else react(18,"05_displeased",1900);
 }else{
   label=p>=.72?"ГАРЯЧЕ":p>=.5?"ТОЧКА СТАРТУ":"ХОЛОДНО";
 }
 setProximity(p,label);
 lastProbeDiff=diff;
}
function flash(el){if(!el)return;el.classList.add("pressed");setTimeout(()=>el.classList.remove("pressed"),120)}
function editKey(k){
 if(locked)return;
 editedSinceTask=true;
 if(k==="back"){
   buffer=buffer.slice(0,-1);
   if(buffer==="")clearedOnce=true;
 }else if(k==="."){
   if(buffer.includes("."))return;
   if(buffer==="")buffer="0.";
   else buffer+=".";
 }else{
   if(digitCount(buffer)>=12)return;
   if(buffer==="0")buffer=k;
   else buffer+=k;
 }
 render();scheduleProbe();
}
function setUnit(u){
 if(locked)return;editedSinceTask=true;selectedUnit=u;render();scheduleProbe();
}
function loadTask(first=false){
 locked=false;wrongStreak=0;lastProbeDiff=null;probeStartDiff=null;editedSinceTask=false;clearTimeout(probeTimer);
 const t=TASKS[taskIndex];
 taskPlaque.textContent=`ЗАВДАННЯ ${String(taskIndex+1).padStart(2,"0")} / 10`;
 errorPlaque.textContent=`ПОМИЛОК: ${errors}`;
 taskBody.textContent=t.prompt;
 proximity.classList.toggle("off",t.kind!=="shift");
 setProximity(0,t.kind==="shift"?"ВВЕДИ ПЕРШУ СПРОБУ":"");
 if(first){
   buffer="0";selectedUnit="Hz";acceptedHz=0;clearedOnce=true;
 }else{
   clearedOnce=false;
 }
 taskStartBuffer=buffer;
 taskStartUnit=selectedUnit;
 render();
 instructor.src=EMO["02_command"];
 if(t.introPhrase)react(t.introPhrase,taskIndex>=8?"04_think":"02_command",2400);
 if(t.secondaryPhrase)setTimeout(()=>{if(taskIndex===3&&!locked)react(t.secondaryPhrase,"07_hint",2200)},2100);
}
function acceptTask(){
 const t=TASKS[taskIndex],usedAlt=selectedUnit!==t.promptUnit;
 locked=true;wrongStreak=0;acceptedHz=t.targetHz;
 if(taskIndex===9){
   react(29,"08_victory",3100);
   setTimeout(finish,2600);
   return;
 }
 if(taskIndex===6)react(21,"03_approval",2300);
 else if(usedAlt)react(4,"03_approval",2300);
 else if(taskIndex===0)react(3,"03_approval",2200);
 else react(28,"03_approval",1900);
 setTimeout(()=>{
   taskIndex++;
   if(taskIndex===3&&!shownShiftTutorial){
     shownShiftTutorial=true;
     beginTutorial(shiftTutorialSteps,()=>loadTask(false));
   }else if(taskIndex===8&&!shownDecimalTutorial){
     shownDecimalTutorial=true;
     beginTutorial(decimalTutorialSteps,()=>loadTask(false));
   }else loadTask(false);
 },2100);
}
function wrongLock(){
 const t=TASKS[taskIndex],c=candidateHz();errors++;wrongStreak++;errorPlaque.textContent=`ПОМИЛОК: ${errors}`;
 if(buffer===taskStartBuffer||c===null){react(9,"06_angry",2400);return}
 if(t.kind==="direct"){
   const n=parseBuffer();
   if(n!==null&&Math.abs(n-Number(t.promptValue))<1e-9&&selectedUnit!==t.promptUnit)react(8,"05_displeased",2300);
   else if(wrongStreak>=3)react(27,"06_angry",2600);
   else if(wrongStreak===2)react(26,"06_angry",2500);
   else react(7,"05_displeased",2200);
 }else{
   const diff=c===null?Infinity:Math.abs(c-t.targetHz),base=Math.max(Math.abs(t.deltaHz||1),1);
   if(diff<base*.08)react(16,"07_hint",2000);
   else if(wrongStreak>=3)react(27,"06_angry",2600);
   else if(wrongStreak===2)react(26,"06_angry",2500);
   else react(7,"05_displeased",2200);
 }
}
function doLock(){
 if(locked)return;
 if(buffer===""){
   buffer=taskStartBuffer;
   selectedUnit=taskStartUnit;
   editedSinceTask=false;
   render();
   if(TASKS[taskIndex].kind==="shift")setProximity(0,"ВВЕДИ ПЕРШУ СПРОБУ");
   react(13,"04_think",1800);
   return;
 }
 if(correctTarget(TASKS[taskIndex].targetHz))acceptTask();else wrongLock();
}
$$("[data-key]").forEach(b=>b.onclick=()=>{flash(b);editKey(b.dataset.key)});
$$("[data-unit]").forEach(b=>b.onclick=()=>{flash(b);setUnit(b.dataset.unit)});
$("#lock").onclick=()=>{flash($("#lock"));doLock()};

let backHoldTimer=null,backRepeat=null;
$("#kback").addEventListener("pointerdown",()=>{
 clearTimeout(backHoldTimer);backHoldTimer=setTimeout(()=>{backRepeat=setInterval(()=>{editKey("back")},90)},420)
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>$("#kback").addEventListener(ev,()=>{clearTimeout(backHoldTimer);clearInterval(backRepeat)}));

window.addEventListener("keydown",e=>{
 if(!tut.classList.contains("hidden"))return;
 if(/^[0-9]$/.test(e.key)){e.preventDefault();const b=$("#k"+e.key);flash(b);editKey(e.key);return}
 if(e.key==="."||e.key===","){e.preventDefault();flash($("#kdot"));editKey(".");return}
 if(e.key==="Backspace"){e.preventDefault();flash($("#kback"));editKey("back");return}
 if(e.key==="Enter"){e.preventDefault();flash($("#lock"));doLock();return}
});
window.addEventListener("resize",()=>requestAnimationFrame(fitLCD));
window.addEventListener("orientationchange",()=>setTimeout(fitLCD,120));

function finish(){
 $("#finalText").textContent=`ЗАВДАНЬ: 10 / 10 · ПОМИЛОК: ${errors}`;
 $("#gameOver").classList.remove("hidden");
 setTimeout(()=>react(30,"08_victory",3000),600);
}
$("#repeatBtn").onclick=()=>location.reload();
$("#nextLevelBtn").onclick=()=>parent.postMessage({type:"RX01_LEVEL2_DONE"},"*");

tutInstructor.src=EMO["02_command"];instructor.src=EMO["01_neutral"];render();beginTutorial(initialTutorialSteps,()=>loadTask(true));
</script>
</body>
</html>
