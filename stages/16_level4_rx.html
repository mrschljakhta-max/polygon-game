#mission{position:absolute;left:2.2%;bottom:2.3%;z-index:65;min-width:290px;max-width:370px;background:rgba(7,12,7,.9);border:1px solid #c7a63c;color:#e9dfb3;padding:12px 14px;font:800 12px/1.35 "Courier New";border-radius:5px}.missionLabel{color:#f0c85b;font-weight:1000;font-size:13px}.missionText{margin-top:4px;color:#f5efcc;font-weight:900}.missionSub{margin-top:6px;color:#9fcf59;font-size:11px}.journalRow{display:grid;grid-template-columns:52px 1fr 52px;gap:5px;margin-top:5px;border-top:1px solid #343722;padding-top:4px}.journalRow b{color:#fff0a0}.toast{position:absolute;left:50%;top:7%;transform:translateX(-50%);z-index:150;background:rgba(8,8,6,.95);border:2px solid #d2a62b;color:#ffe184;padding:10px 18px;border-radius:5px;font:900 clamp(11px,1.35vw,21px) Arial;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
#mapBtn{position:absolute;right:2.2%;bottom:2.4%;z-index:160;width:132px;height:132px;border:3px solid #d6b230;border-radius:22px;background:linear-gradient(145deg,#3b462c,#11170f);color:#f4e7a8;display:none;place-items:center;cursor:pointer;box-shadow:0 10px 24px #000,0 0 0 2px #10150d inset;opacity:0;transform:scale(.55) translateY(25px)}#mapBtn.show{display:grid;animation:mapIn .55s cubic-bezier(.2,1.4,.3,1) forwards}@keyframes mapIn{to{opacity:1;transform:scale(1) translateY(0)}}.mapFold{position:relative;width:75px;height:58px;transform:skewY(-5deg)}.mapFold i{position:absolute;top:0;width:29px;height:58px;border:2px solid #232611;background:#d8d2aa}.mapFold i:nth-child(1){left:0;transform:skewY(9deg)}.mapFold i:nth-child(2){left:24px;background:#bfc28f}.mapFold i:nth-child(3){left:48px;transform:skewY(-9deg)}.mapFold:after{content:"×";position:absolute;right:7px;top:2px;color:#6a1a10;font:1000 27px Arial}.mapLabel{margin-top:-17px;font:1000 17px Arial;letter-spacing:.06em}

<body><div id="stage"><img id="bg" src="../assets/asset_0014_fc9bbcc3f62d8a20.png" alt="RX-01"><div id="rxHud"><div class="topPlaque" id="levelPlate">РІВЕНЬ 4 · RX-01</div><div class="topPlaque" id="taskPlate">СИГНАЛ 01 / 03</div><div class="topPlaque" id="errorPlate">ПОМИЛОК: 0</div><img id="petro" src="../assets/asset_0018_47f319ec4ea0381c.png" alt="Петрович"></div><div class="speech"><b>Петрович:</b> <span id="petroText">Частоти у тебе є. Вводь значення, підтверджуй LOCK, шукай максимум сигналу і фіксуй пеленг. Працюй.</span></div>
<div id="scopeOverlay"><svg id="scopeSvg" viewBox="-120 -120 240 240"><line id="beam" x1="0" y1="0" x2="0" y2="-92"/><circle id="beamDot" cx="0" cy="-92" r="3.5"/><circle id="centerDot" cx="0" cy="0" r="2.2"/><circle id="signalDot" cx="0" cy="0" r="4"/></svg></div><div id="azimuthDisplay">000°</div><div id="signalMeter"><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i></div>
<div id="freqSetup"><div class="freqInner"><div class="freqCaption" id="freqCaption">ВВЕДИ ЗНАЧЕННЯ</div><div class="freqDisplay" id="freqDisplay">—</div><div class="freqInstruction">Клавіатура RX-01 · LOCK — підтвердити</div><div class="freqStatus" id="freqStatus"></div></div></div>
<button class="hit left" id="left"></button><button class="hit right" id="right"></button><button class="hit lock" id="lock"></button><button class="hit unit" data-u="Hz"></button><button class="hit unit" data-u="kHz"></button><button class="hit unit" data-u="MHz"></button><button class="hit unit" data-u="GHz"></button><button class="hit num" data-k="7"></button><button class="hit num" data-k="8"></button><button class="hit num" data-k="9"></button><button class="hit num" data-k="4"></button><button class="hit num" data-k="5"></button><button class="hit num" data-k="6"></button><button class="hit num" data-k="1"></button><button class="hit num" data-k="2"></button><button class="hit num" data-k="3"></button><button class="hit num" data-k="."></button><button class="hit num" data-k="0"></button><button class="hit num" data-k="back"></button>
<div id="mission"><div class="missionLabel">ЗАВДАННЯ</div><div class="missionText" id="missionText">Введи 433.700 MHz.</div><div class="missionSub" id="missionSub">LOCK — підтвердити введення</div><div id="journalPreview"></div></div><div class="toast" id="toast"></div><button id="mapBtn" aria-label="Карта"><div><div class="mapFold"><i></i><i></i><i></i></div><div class="mapLabel">КАРТА</div></div></button><div id="fade"></div></div>
<script>
const TASKS=[{freq:'433.700',unit:'MHz',target:45,start:210},{freq:'145.500',unit:'MHz',target:90,start:310},{freq:'868.100',unit:'MHz',target:315,start:140}],JOURNAL='rx01_level4_our_journal',FLOW='rx01_level4_flow';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let task=0,az=TASKS[0].start,buffer='',unit='',inputMode=true,errors=0,hold=null;
localStorage.setItem(JOURNAL,'[]');const display=$('#azimuthDisplay'),segs=$$('.seg'),beam=$('#beam'),beamDot=$('#beamDot'),dot=$('#signalDot'),freqDisplay=$('#freqDisplay'),freqStatus=$('#freqStatus'),petro=$('#petroText');
function norm(v){v%=360;return v<0?v+360:v}function diff(a,b){let d=Math.abs(norm(a)-norm(b));return Math.min(d,360-d)}function sig(){const d=diff(az,TASKS[task].target);if(d===0)return 10;if(d<=3)return 9;if(d<=6)return 8;if(d<=10)return 7;if(d<=18)return 6;if(d<=28)return 5;if(d<=40)return 4;if(d<=55)return 3;if(d<=75)return 2;if(d<=100)return 1;return 0}
function render(){display.textContent=String(az).padStart(3,'0')+'°';const s=sig();display.className=s===10?'peak':s>=2?'signal':'';segs.forEach((e,i)=>{const on=i>=10-s;e.classList.toggle('on',on);e.classList.toggle('peak',on&&s===10)});beam.setAttribute('transform',`rotate(${az} 0 0)`);beamDot.setAttribute('transform',`rotate(${az} 0 0)`);const th=TASKS[task].target*Math.PI/180,r=72;dot.setAttribute('cx',(r*Math.sin(th)).toFixed(2));dot.setAttribute('cy',(-r*Math.cos(th)).toFixed(2));dot.className=s===10?'peak':s>=6?'hot':s>=2?'visible':''}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),900)}function updateFreq(){freqDisplay.textContent=(buffer||'—')+(unit?' '+unit:'')}
function startTask(){const t=TASKS[task];az=t.start;buffer='';unit='';inputMode=true;freqStatus.textContent='';$('#freqCaption').textContent='ВВЕДИ ЗНАЧЕННЯ';$('#taskPlate').textContent='СИГНАЛ '+String(task+1).padStart(2,'0')+' / 03';$('#missionText').textContent=`Введи ${t.freq} ${t.unit}.`;$('#missionSub').textContent='LOCK — підтвердити введення';petro.textContent=task===0?'Частоти у тебе є. Вводь значення, підтверджуй LOCK, шукай максимум сигналу і фіксуй пеленг. Працюй.':task===1?'Перший є. Далі.':'Два. Залишився останній.';updateFreq();render()}
function acceptFreq(){const t=TASKS[task],ok=Math.abs(Number(buffer)-Number(t.freq))<.0001&&unit===t.unit;if(!ok){errors++;$('#errorPlate').textContent='ПОМИЛОК: '+errors;freqStatus.textContent='ПОМИЛКА';freqStatus.className='freqStatus bad';petro.textContent='Перевір частоту та одиниці.';return}freqStatus.textContent='ПРИЙНЯТО ✓';freqStatus.className='freqStatus good';inputMode=false;$('#freqCaption').textContent='ЧАСТОТУ ПРИЙНЯТО';$('#missionText').textContent=`Знайди сигнал ${t.freq} ${t.unit}.`;$('#missionSub').textContent='← / → або A / D · на піку натисни LOCK';petro.textContent='Шукай максимум сигналу.'}
function saveRecord(){const t=TASKS[task],now=new Date(),rec={time:now.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit',hour12:false}),timestamp:now.toISOString(),freq:t.freq,unit:t.unit,azimuth:az};let rows=[];try{rows=JSON.parse(localStorage.getItem(JOURNAL)||'[]')}catch{};rows.push(rec);localStorage.setItem(JOURNAL,JSON.stringify(rows));$('#journalPreview').innerHTML=rows.map(r=>`<div class="journalRow"><span>${r.time}</span><b>${r.freq}</b><span>${String(r.azimuth).padStart(3,'0')}°</span></div>`).join('')}
function lock(){if(inputMode){acceptFreq();return}const t=TASKS[task];if(diff(az,t.target)<=3){saveRecord();toast('ЗАФІКСОВАНО ✓');petro.textContent=task===0?'Перший є. Далі.':task===1?'Два. Залишився останній.':'Є. Три частоти підтверджені. Три власні пеленги отримані. Тепер зводимо наші дані з даними «БРАВО».';setTimeout(()=>{if(task<2){task++;startTask()}else{$('#taskPlate').textContent='3/3 · ВИКОНАНО';$('#missionText').textContent='Усі три пеленги зафіксовано.';$('#missionSub').textContent='Дані зібрані. Повертайся на карту.';localStorage.setItem(FLOW,'return');setTimeout(()=>$('#mapBtn').classList.add('show'),500)}},900)}else{errors++;$('#errorPlate').textContent='ПОМИЛОК: '+errors;petro.textContent=sig()>=8?'Поруч. Дотягни сигнал.':sig()>=4?'Є щось. Дивись на шкалу.':'Ні. Це не максимум.'}}
function step(dir){if(inputMode)return;az=norm(az+dir);render()}function begin(dir){clearInterval(hold);step(dir);hold=setInterval(()=>step(dir),90)}function stop(){clearInterval(hold);hold=null}
$('#left').onpointerdown=e=>{e.preventDefault();begin(-1)};$('#right').onpointerdown=e=>{e.preventDefault();begin(1)};window.onpointerup=stop;$('#lock').onclick=lock;$$('.unit').forEach(b=>b.onclick=()=>{if(inputMode){unit=b.dataset.u;updateFreq()}});$$('.num').forEach(b=>b.onclick=()=>{if(!inputMode)return;const k=b.dataset.k;if(k==='back')buffer=buffer.slice(0,-1);else if(k==='.'&&!buffer.includes('.'))buffer+='.';else if(/^\d$/.test(k)&&buffer.length<9)buffer+=k;updateFreq()});
document.addEventListener('keydown',e=>{const k=(e.key||'').toLowerCase();if(inputMode){if(/^\d$/.test(e.key)){buffer+=e.key;updateFreq()}else if(e.key==='.'&&!buffer.includes('.')){buffer+='.';updateFreq()}else if(e.key==='Backspace'){buffer=buffer.slice(0,-1);updateFreq()}else if(k==='m'){unit='MHz';updateFreq()}else if(e.key==='Enter'||k==='l')lock();return}if(e.key==='ArrowLeft'||k==='a')step(-1);else if(e.key==='ArrowRight'||k==='d')step(1);else if(e.key==='Enter'||k==='l')lock()});
$('#mapBtn').onclick=()=>{petro.textContent='Дані зібрані. Повертайся на карту.';$('#fade').classList.add('show');setTimeout(()=>parent.postMessage({type:'RX01_LEVEL4_RETURN_MAP'},'*'),600)};startTask();
</script>
