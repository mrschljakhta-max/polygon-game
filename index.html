<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020302">
<title>Полігон</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/icons/favicon-black.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="assets/icons/favicon-orange.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/icons/favicon-orange.png">
<link rel="preload" href="assets/menu/poligon-start-bg.webp" as="image" type="image/webp">
<link rel="preload" href="assets/menu/choose-level.webp" as="image" type="image/webp">
<style>
:root{
  --gold:#d6a413;
  --gold-bright:#ffd25a;
  --cream:#eee5cc;
  --ease:cubic-bezier(.20,.72,.20,1);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020302}
body{font-family:Impact,"Arial Narrow",Arial,sans-serif;color:var(--cream);user-select:none}
button{font:inherit}
.viewport{position:fixed;inset:0;display:grid;place-items:center;background:#020302}
.stage{position:relative;width:min(100vw,calc(100vh * 1672 / 941));height:min(100vh,calc(100vw * 941 / 1672));aspect-ratio:1672/941;overflow:hidden;background:#050503}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .7s ease,visibility .7s ease}
.screen.active{opacity:1;visibility:visible;pointer-events:auto}
.bg{position:absolute;inset:0;background-position:center;background-size:100% 100%;background-repeat:no-repeat}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 0 44%,rgba(0,0,0,.10) 65%,rgba(0,0,0,.40) 100%),linear-gradient(to bottom,rgba(0,0,0,.24),transparent 22%,transparent 78%,rgba(0,0,0,.34))}

/* Стартова заставка */
#startScreen .bg{background-image:url("assets/menu/poligon-start-bg.webp");opacity:0;filter:brightness(.22) contrast(1.08) saturate(.88);transform:scale(1.012)}
#startScreen.active .bg{animation:startBgReveal 2.8s var(--ease) .55s forwards}
@keyframes startBgReveal{to{opacity:1;filter:brightness(1) contrast(1) saturate(1);transform:scale(1)}}
.start-curtain{position:absolute;inset:0;z-index:20;pointer-events:none;background:#000}
#startScreen.active .start-curtain{animation:startCurtain 3s ease forwards}
@keyframes startCurtain{0%,22%{opacity:1}to{opacity:0;visibility:hidden}}
.choose-level{position:absolute;left:33.8%;top:62.8%;width:39.2%;padding:0;border:0;background:transparent;cursor:pointer;z-index:7;opacity:0;isolation:isolate;transform:translateY(10px) scale(.994);filter:brightness(.26) drop-shadow(0 12px 18px rgba(0,0,0,.68));transition:transform .28s var(--ease),filter .28s ease}
#startScreen.active .choose-level{animation:plateReveal 1.65s var(--ease) 3.2s forwards}
.choose-level img{position:relative;z-index:1;display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;transform-origin:center;will-change:transform,filter}
.choose-level::before{content:"";position:absolute;left:9%;right:9%;bottom:5%;height:48%;z-index:-1;opacity:0;background:radial-gradient(circle,rgba(255,185,0,.34),rgba(255,185,0,.06) 44%,transparent 70%);filter:blur(22px)}
.choose-level::after{content:"";position:absolute;inset:4% 2%;z-index:2;opacity:0;pointer-events:none;clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);background:linear-gradient(108deg,transparent 37%,rgba(255,238,174,0) 43%,rgba(255,238,174,.68) 50%,rgba(255,191,40,.16) 56%,transparent 63%);background-size:300% 100%;background-position:130% 0;mix-blend-mode:screen}
#startScreen.active .choose-level::before{animation:plateGlow 1.25s ease 3.5s forwards}
@keyframes plateReveal{to{opacity:1;transform:translateY(0) scale(1);filter:brightness(1) drop-shadow(0 13px 19px rgba(0,0,0,.68))}}
@keyframes plateGlow{0%{opacity:0}55%{opacity:.28}to{opacity:.14}}
.choose-level:disabled{cursor:default}
#startScreen.skip-intro .bg{animation:none;opacity:1;filter:brightness(1);transform:scale(1)}
#startScreen.skip-intro .start-curtain{display:none;animation:none}
#startScreen.skip-intro .choose-level{animation:none;opacity:1;transform:translateY(0) scale(1);filter:brightness(1) drop-shadow(0 13px 19px rgba(0,0,0,.68))}
#startScreen.skip-intro .choose-level::before{animation:none;opacity:.14}
#startScreen.active .choose-level.ready{animation:none;opacity:1;transform:translateY(0) scale(1);filter:brightness(1) drop-shadow(0 13px 19px rgba(0,0,0,.68))}
#startScreen.active .choose-level.ready img{animation:plateBreathe 3.2s ease-in-out infinite}
#startScreen.active .choose-level.ready::before{animation:plateGlowIdle 3.2s ease-in-out infinite}
#startScreen.active .choose-level.ready::after{animation:plateSweep 4.8s ease-in-out .35s infinite}
@keyframes plateBreathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.012);filter:brightness(1.055)}}
@keyframes plateGlowIdle{0%,100%{opacity:.10;transform:scale(.96)}50%{opacity:.27;transform:scale(1.06)}}
@keyframes plateSweep{0%{opacity:0;background-position:130% 0}4%{opacity:.18}12%{opacity:.58}23%{opacity:0;background-position:-130% 0}100%{opacity:0;background-position:-130% 0}}
#startScreen.active .choose-level.ready:hover{outline:none;transform:translateY(-3px) scale(1.012);filter:brightness(1.10) drop-shadow(0 16px 22px rgba(0,0,0,.72)) drop-shadow(0 0 14px rgba(255,190,20,.24))}
#startScreen.active .choose-level.ready:focus-visible{outline:2px solid rgba(255,210,90,.78);outline-offset:5px;transform:translateY(-3px) scale(1.012);filter:brightness(1.10) drop-shadow(0 16px 22px rgba(0,0,0,.72)) drop-shadow(0 0 14px rgba(255,190,20,.24))}
#startScreen.active .choose-level.ready:active{outline:none;transform:translateY(1px) scale(.97);filter:brightness(.94) drop-shadow(0 9px 13px rgba(0,0,0,.72));transition-duration:.08s}

/* Переходи */
.transition-mask{position:absolute;inset:0;z-index:100;background:#000;opacity:0;visibility:hidden;pointer-events:none}
.stage.to-levels .transition-mask,.stage.to-start .transition-mask{visibility:visible;pointer-events:auto;animation:toBlack 1.12s ease forwards}
@keyframes toBlack{0%{opacity:0}43%,66%{opacity:1}to{opacity:0;visibility:hidden}}
.stage.to-game .transition-mask{visibility:visible;pointer-events:auto;animation:enterGame .52s ease forwards}
@keyframes enterGame{to{opacity:1}}

/* Екран рівнів */
#levelsScreen .bg{background-image:url("assets/menu/poligon-levels-bg.webp");filter:brightness(.93) contrast(1.03)}
@keyframes quietAppear{to{opacity:1}}
.back-btn{position:absolute;top:5.8%;right:4.8%;z-index:15;width:13.5%;min-width:130px;padding:0;border:0;background:transparent;cursor:pointer;opacity:0;transition:transform .22s ease,filter .22s ease}
.back-btn img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
#levelsScreen.active .back-btn{animation:quietAppear .9s ease .42s forwards}
.back-btn:hover,.back-btn:focus-visible{outline:none;transform:scale(1.035);filter:brightness(1.12) drop-shadow(0 0 10px rgba(255,188,26,.20))}
.back-btn:active{transform:scale(.985);filter:brightness(.96)}
.cards{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88.2%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.35%;align-items:center;z-index:8}
.level-card{position:relative;width:100%;aspect-ratio:1086/1448;border:0;background:transparent;padding:0;margin:0;cursor:pointer;outline:none;isolation:isolate;opacity:0;transform:translateY(22px);filter:drop-shadow(0 1vmin 1.35vmin rgba(0,0,0,.76));transition:transform .18s ease,filter .18s ease}
#levelsScreen.active .level-card{animation:cardReveal .72s var(--ease) forwards}
#levelsScreen.active .level-card:nth-child(1){animation-delay:.18s}
#levelsScreen.active .level-card:nth-child(2){animation-delay:.27s}
#levelsScreen.active .level-card:nth-child(3){animation-delay:.36s}
#levelsScreen.active .level-card:nth-child(4){animation-delay:.45s}
#levelsScreen.active .level-card:nth-child(5){animation-delay:.54s}
@keyframes cardReveal{to{opacity:1;transform:translateY(0)}}
.card-art{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none;-webkit-user-drag:none;transition:filter .22s ease,transform .22s ease,opacity .22s ease}
.level-card.available:hover .card-art{transform:translateY(-8px)}
.level-card.available:hover .status-ribbon{transform:translateY(-8px) rotate(16.6deg)}
.level-card:focus-visible{filter:drop-shadow(0 0 .8vmin var(--gold-bright))}
.level-card.complete::before{content:"";position:absolute;inset:-1.8%;z-index:-1;border:1px solid rgba(255,193,27,.48);box-shadow:0 0 1vmin rgba(255,190,20,.22);clip-path:polygon(6% 0,94% 0,100% 4%,100% 96%,94% 100%,6% 100%,0 96%,0 4%)}
.status-ribbon{display:none;position:absolute;left:40.3%;top:2.9%;width:62.3%;aspect-ratio:1124/682;background:url("assets/menu/status-complete.webp") center/contain no-repeat;transform:rotate(16.6deg);transform-origin:center;filter:drop-shadow(0 24px 25px rgba(0,0,0,.55));z-index:14;pointer-events:none;transition:transform .18s ease}
.complete .status-ribbon{display:block}
.progress-panel{display:none;position:absolute;left:10%;right:10%;bottom:4.8%;z-index:15;padding:4.5% 5%;border:1px solid rgba(225,179,53,.62);background:rgba(5,8,5,.90);box-shadow:0 .45vmin .8vmin rgba(0,0,0,.72);color:#e4ce87;font:800 clamp(7px,.55vw,12px)/1 Arial,sans-serif;letter-spacing:.08em;text-align:left;pointer-events:none}
.active-progress .progress-panel{display:block}
.progress-copy{display:flex;justify-content:space-between;margin-bottom:5%}
.progress-track{height:clamp(3px,.34vw,7px);overflow:hidden;background:#29291d;border:1px solid rgba(198,157,45,.38)}
.progress-fill{display:block;width:0;height:100%;background:linear-gradient(90deg,#8c6710,#f0bc25);box-shadow:0 0 8px rgba(240,188,37,.30);transition:width .35s ease}
.locked{cursor:not-allowed}
.locked .card-art{filter:grayscale(.86) brightness(.43) sepia(.18);opacity:.86}
.lock-layer{display:none;position:absolute;inset:2%;z-index:10;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(4,6,4,.08),rgba(3,5,3,.58));border:1px solid rgba(119,102,47,.33)}
.locked .lock-layer{display:flex}
.css-lock{position:relative;width:24%;aspect-ratio:1}
.css-lock::before{content:"";position:absolute;left:22%;right:22%;top:5%;height:46%;border:.55vmin solid #8e855f;border-bottom:0;border-radius:50% 50% 0 0;filter:drop-shadow(0 .25vmin .3vmin #000)}
.css-lock::after{content:"";position:absolute;left:11%;right:11%;bottom:6%;height:52%;background:linear-gradient(180deg,#8a8160,#504b38);border:1px solid #a9a07b;box-shadow:0 .35vmin .6vmin rgba(0,0,0,.72)}
.locked:hover .css-lock{animation:lockNudge .34s ease-in-out 1}
@keyframes lockNudge{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.dev{cursor:not-allowed}
.dev .card-art{filter:grayscale(.95) brightness(.40) sepia(.18);opacity:.80}
.dev-layer{position:absolute;inset:2%;z-index:10;display:flex;align-items:center;justify-content:center;overflow:hidden;background:repeating-linear-gradient(-45deg,rgba(8,10,6,.30) 0 8%,rgba(120,92,16,.12) 8% 12%)}
.dev-stamp{width:114%;transform:rotate(-7deg);padding:6% 3%;color:#d0a329;background:rgba(8,9,6,.92);border-top:2px solid #a37b19;border-bottom:2px solid #a37b19;box-shadow:0 .45vmin .8vmin rgba(0,0,0,.75);font:900 clamp(7px,.62vw,13px)/1 Arial,sans-serif;letter-spacing:.09em;text-align:center}
.dev-stamp small{display:block;margin-top:4%;color:#827b62;font-size:.62em;letter-spacing:.05em}
.toast{position:absolute;left:50%;bottom:7.3%;transform:translate(-50%,18px);z-index:30;min-width:270px;max-width:72%;padding:.75em 1.25em;color:#e3cf8e;background:rgba(5,8,5,.95);border:1px solid #98761b;box-shadow:0 .55vmin 1.2vmin rgba(0,0,0,.65);font:700 clamp(10px,.72vw,14px)/1.25 Arial,sans-serif;letter-spacing:.035em;text-align:center;opacity:0;pointer-events:none;transition:.22s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* У портретній орієнтації картки стають читабельною сіткою з прокруткою. */
@media (max-aspect-ratio:1/1){
  .viewport{display:block}
  .stage{width:100vw;height:100svh;aspect-ratio:auto}
  .bg{background-size:cover}
  .choose-level{left:20%;top:66%;width:60%}
  .back-btn{top:2.5%;right:3%;width:28%;min-width:118px}
  .cards{top:11%;bottom:3%;left:4%;width:92%;height:auto;transform:none;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:14px 10px;overflow-y:auto;overscroll-behavior:contain;padding:8px 7px 24px;scrollbar-width:thin;scrollbar-color:#806415 transparent}
  .level-card:nth-child(5){grid-column:1/-1;width:48%;justify-self:center}
  .progress-panel{font-size:8px}
  .toast{bottom:3.5%;min-width:min(270px,86%);max-width:86%;font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .screen.active,#startScreen .bg,.choose-level,.back-btn,.level-card{opacity:1!important;visibility:visible!important}
  #startScreen .bg{filter:brightness(1)!important;transform:scale(1)!important}
  .choose-level{transform:translateY(0) scale(1)!important;filter:brightness(1) drop-shadow(0 13px 19px rgba(0,0,0,.68))!important}
  #startScreen.active .choose-level.ready:hover{outline:none;filter:brightness(1.12) drop-shadow(0 0 14px rgba(255,190,20,.24))!important}
  #startScreen.active .choose-level.ready:focus-visible{outline:2px solid rgba(255,210,90,.78);outline-offset:5px;filter:brightness(1.12) drop-shadow(0 0 14px rgba(255,190,20,.24))!important}
  #startScreen.active .choose-level.ready:active{filter:brightness(.94) drop-shadow(0 9px 13px rgba(0,0,0,.72))!important}
  .level-card{transform:none!important}
}
</style>
</head>
<body>
<div class="viewport">
  <main class="stage" id="stage" aria-label="Гра Полігон">
    <section class="screen active" id="startScreen" aria-label="Стартове меню" aria-hidden="false">
      <div class="bg"></div>
      <div class="vignette"></div>
      <div class="start-curtain"></div>
      <button class="choose-level" id="chooseLevel" type="button" aria-label="Обрати рівень" aria-disabled="true" disabled>
        <img src="assets/menu/choose-level.webp" alt="Обери рівень" draggable="false">
      </button>
    </section>

    <section class="screen" id="levelsScreen" aria-label="Вибір рівня" aria-hidden="true">
      <div class="bg"></div>
      <div class="vignette"></div>
      <button class="back-btn" id="backBtn" type="button" aria-label="Назад"><img src="assets/menu/back-button-exact.webp" alt="Назад" draggable="false"></button>
      <div class="cards" aria-label="Рівні гри">
        <button class="level-card" data-level="1" type="button">
          <img class="card-art" src="assets/menu/level-1.webp" alt="Рівень 1 — Підготовка" draggable="false">
          <span class="status-ribbon" aria-hidden="true"></span>
          <span class="progress-panel" aria-hidden="true"><span class="progress-copy"><span>ПРОГРЕС</span><span class="progress-value">0%</span></span><span class="progress-track"><i class="progress-fill"></i></span></span>
          <span class="lock-layer" aria-hidden="true"><span class="css-lock"></span></span>
        </button>
        <button class="level-card" data-level="2" type="button">
          <img class="card-art" src="assets/menu/level-2.webp" alt="Рівень 2 — Залік" draggable="false">
          <span class="status-ribbon" aria-hidden="true"></span>
          <span class="progress-panel" aria-hidden="true"><span class="progress-copy"><span>ПРОГРЕС</span><span class="progress-value">0%</span></span><span class="progress-track"><i class="progress-fill"></i></span></span>
          <span class="lock-layer" aria-hidden="true"><span class="css-lock"></span></span>
        </button>
        <button class="level-card" data-level="3" type="button">
          <img class="card-art" src="assets/menu/level-3.webp" alt="Рівень 3 — Пеленгатор" draggable="false">
          <span class="status-ribbon" aria-hidden="true"></span>
          <span class="progress-panel" aria-hidden="true"><span class="progress-copy"><span>ПРОГРЕС</span><span class="progress-value">0%</span></span><span class="progress-track"><i class="progress-fill"></i></span></span>
          <span class="lock-layer" aria-hidden="true"><span class="css-lock"></span></span>
        </button>
        <button class="level-card" data-level="4" type="button">
          <img class="card-art" src="assets/menu/level-4.webp" alt="Рівень 4 — Точка на карті" draggable="false">
          <span class="status-ribbon" aria-hidden="true"></span>
          <span class="progress-panel" aria-hidden="true"><span class="progress-copy"><span>ПРОГРЕС</span><span class="progress-value">0%</span></span><span class="progress-track"><i class="progress-fill"></i></span></span>
          <span class="lock-layer" aria-hidden="true"><span class="css-lock"></span></span>
        </button>
        <button class="level-card dev" data-level="5" type="button" aria-label="Рівень 5 — Фінальна гра. Ще в розробці" aria-disabled="true">
          <img class="card-art" src="assets/menu/level-5.webp" alt="Рівень 5 — Фінальна гра" draggable="false">
          <span class="dev-layer" aria-hidden="true"><span class="dev-stamp">ЩЕ В РОЗРОБЦІ<small>рівень недоступний</small></span></span>
        </button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
    <div class="transition-mask" aria-hidden="true"></div>
  </main>
</div>
<script>
const CAMPAIGN_KEY='rx01_campaign_progress';
const DEFAULT_PROGRESS={1:100,2:35,3:0,4:0};
const LEVEL_NAMES={1:'Підготовка',2:'Залік',3:'Пеленгатор',4:'Точка на карті'};
const stage=document.getElementById('stage');
const startScreen=document.getElementById('startScreen');
const levelsScreen=document.getElementById('levelsScreen');
const chooseLevel=document.getElementById('chooseLevel');
const backBtn=document.getElementById('backBtn');
const toast=document.getElementById('toast');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let startReady=false;
let changing=false;
let toastTimer;

function clamp(value){return Math.max(0,Math.min(100,Number(value)||0))}
function readProgress(){
  let saved={};
  try{saved=JSON.parse(localStorage.getItem(CAMPAIGN_KEY)||'{}')||{}}catch(error){saved={}}
  return Object.fromEntries([1,2,3,4].map(level=>[level,clamp(saved[level]??DEFAULT_PROGRESS[level])]))
}
function levelUnlocked(level,progress){
  if(level===1)return true;
  return progress[level-1]>=100;
}
function renderProgress(){
  const progress=readProgress();
  document.querySelectorAll('.level-card[data-level]').forEach(card=>{
    const level=Number(card.dataset.level);
    if(level===5)return;
    const value=progress[level];
    const unlocked=levelUnlocked(level,progress);
    card.classList.toggle('available',unlocked);
    card.classList.toggle('locked',!unlocked);
    card.classList.toggle('complete',unlocked&&value>=100);
    card.classList.toggle('active-progress',unlocked&&value>0&&value<100);
    card.setAttribute('aria-disabled',String(!unlocked));
    const state=!unlocked?'Вхід закрито':value>=100?'Пройдено':value>0?`Прогрес ${value} відсотків`:'Доступний';
    card.setAttribute('aria-label',`Рівень ${level} — ${LEVEL_NAMES[level]}. ${state}`);
    card.querySelector('.progress-value').textContent=`${value}%`;
    card.querySelector('.progress-fill').style.width=`${value}%`;
  });
}
function setScreens(showLevels){
  startScreen.classList.toggle('active',!showLevels);
  levelsScreen.classList.toggle('active',showLevels);
  startScreen.setAttribute('aria-hidden',String(showLevels));
  levelsScreen.setAttribute('aria-hidden',String(!showLevels));
}
function markStartReady(){
  if(startReady)return;
  startReady=true;
  chooseLevel.disabled=false;
  chooseLevel.setAttribute('aria-disabled','false');
  chooseLevel.classList.add('ready');
}
function showToast(text){
  toast.textContent=text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);
}
function openLevels(){
  if(!startReady||changing)return;
  if(reduceMotion){setScreens(true);history.replaceState(null,'','#levels');renderProgress();return}
  changing=true;
  stage.classList.add('to-levels');
  setTimeout(()=>{setScreens(true);history.replaceState(null,'','#levels');renderProgress()},480);
  setTimeout(()=>{stage.classList.remove('to-levels');changing=false},1140);
}
function openStart(){
  if(changing)return;
  startScreen.classList.add('skip-intro');
  if(reduceMotion){setScreens(false);history.replaceState(null,'',location.pathname+location.search);markStartReady();return}
  changing=true;
  stage.classList.add('to-start');
  setTimeout(()=>{setScreens(false);history.replaceState(null,'',location.pathname+location.search);markStartReady()},480);
  setTimeout(()=>{stage.classList.remove('to-start');changing=false},1140);
}
function enterLevel(level){
  if(changing)return;
  changing=true;
  history.replaceState(null,'','#levels');
  if(reduceMotion){location.href=`game.html?level=${level}`;return}
  stage.classList.add('to-game');
  setTimeout(()=>{location.href=`game.html?level=${level}`},470);
}
function showLevelsImmediately(){
  renderProgress();
  setScreens(true);
  startScreen.classList.add('skip-intro');
  markStartReady();
}

chooseLevel.addEventListener('animationend',event=>{if(event.animationName==='plateReveal')markStartReady()});
chooseLevel.addEventListener('click',openLevels);
backBtn.addEventListener('click',openStart);
document.querySelectorAll('.level-card').forEach(card=>card.addEventListener('click',()=>{
  if(changing)return;
  const level=Number(card.dataset.level);
  if(card.classList.contains('locked'))return showToast('Вхід закрито: спочатку заверши попередній рівень.');
  if(card.classList.contains('dev'))return showToast('П’ятий рівень ще в розробці.');
  enterLevel(level);
}));
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&levelsScreen.classList.contains('active'))openStart()});
window.addEventListener('storage',event=>{if(event.key===CAMPAIGN_KEY)renderProgress()});
window.addEventListener('pageshow',()=>{renderProgress();if(location.hash==='#levels')showLevelsImmediately()});

renderProgress();
if(location.hash==='#levels')showLevelsImmediately();
else if(reduceMotion)markStartReady();
else setTimeout(markStartReady,5200);
</script>
</body>
</html>
