name: Apply stable mobile fullscreen patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/patch_mobile_fullscreen.py
      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html game.html
          git rm -f .github/workflows/preserve-mobile-fullscreen.yml .github/workflows/apply-mobile-fullscreen-v2.yml .github/scripts/patch_mobile_fullscreen.py
          git commit -m "Keep mobile gameplay in fullscreen"
          git push
