name: Fix social preview image

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build valid JPEG preview from existing start artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://poligon-game.com/assets/social/poligon-whatsapp.jpg?v=1', 'https://poligon-game.com/assets/menu/poligon-start-bg.webp?v=2')
          s = s.replace('<meta property="og:image:type" content="image/jpeg">', '<meta property="og:image:type" content="image/webp">')
          s = s.replace('<meta property="og:image:width" content="600">', '<meta property="og:image:width" content="1536">')
          s = s.replace('<meta property="og:image:height" content="338">', '<meta property="og:image:height" content="1024">')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit social preview fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-social-preview.yml
          git commit -m "Fix WhatsApp preview image"
          git push
