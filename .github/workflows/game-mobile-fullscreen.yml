name: Keep mobile gameplay fullscreen

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text(encoding='utf-8')

          if 'rel="manifest"' not in s:
              marker='<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">'
              meta='\n'.join([
                  '<meta name="theme-color" content="#020302">',
                  '<link rel="manifest" href="manifest.webmanifest">',
                  '<meta name="mobile-web-app-capable" content="yes">',
                  '<meta name="apple-mobile-web-app-capable" content="yes">',
                  '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">',
                  '<meta name="apple-mobile-web-app-title" content="Полігон">'
              ])
              s=s.replace(marker,marker+'\n'+meta,1)

          if 'function requestGameplayFullscreen()' not in s:
              marker="const CAMPAIGN_KEY='rx01_campaign_progress'"
              helper='\n'.join([
                  'function requestGameplayFullscreen(){',
                  "  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;",
                  "  if(standalone){try{screen.orientation?.lock?.('landscape').catch(()=>{})}catch(e){}return;}",
                  '  if(document.fullscreenElement||document.webkitFullscreenElement)return;',
                  '  const root=document.documentElement;',
                  '  const request=root.requestFullscreen||root.webkitRequestFullscreen;',
                  '  if(!request)return;',
                  '  try{',
                  '    const result=request.call(root);',
                  "    if(result&&typeof result.then==='function')result.then(()=>{try{screen.orientation?.lock?.('landscape').catch(()=>{})}catch(e){}}).catch(()=>{});",
                  '  }catch(e){}',
                  '}',
                  'function armFrameFullscreen(){',
                  '  try{',
                  '    const doc=frame.contentDocument;',
                  '    if(!doc)return;',
                  "    doc.addEventListener('pointerdown',requestGameplayFullscreen,{once:true,capture:true});",
                  "    doc.addEventListener('touchstart',requestGameplayFullscreen,{once:true,capture:true,passive:true});",
                  '  }catch(e){}',
                  '}',
                  ''
              ])
              s=s.replace(marker,helper+marker,1)

          old="frame.addEventListener('load',()=>{if(idx===14)window.RX01_APPLY_LEVEL4_ONO?.(frame,'map');else if(idx===15){window.RX01_APPLY_LEVEL4_ONO?.(frame,'rx');window.RX01_APPLY_LEVEL4_RX_LAYOUT?.(frame)}});"
          new="frame.addEventListener('load',()=>{armFrameFullscreen();if(idx===14)window.RX01_APPLY_LEVEL4_ONO?.(frame,'map');else if(idx===15){window.RX01_APPLY_LEVEL4_ONO?.(frame,'rx');window.RX01_APPLY_LEVEL4_RX_LAYOUT?.(frame)}});"
          if old in s:
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit gameplay fullscreen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html
          git rm .github/workflows/game-mobile-fullscreen.yml
          git commit -m "Keep mobile gameplay fullscreen"
          git push
