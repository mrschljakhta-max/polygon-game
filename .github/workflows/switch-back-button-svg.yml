name: Switch back button asset
on:
  push:
    paths:
      - '.github/workflows/switch-back-button-svg.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Use embedded SVG button
        run: |
          sed -i 's|assets/menu/back-button-exact.webp|assets/menu/back-button.svg?v=4|g' index.html
          rm -f .github/workflows/switch-back-button-svg.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/switch-back-button-svg.yml
          git commit -m 'Fix back button rendering' || exit 0
          git push
