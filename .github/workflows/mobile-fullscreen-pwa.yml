name: Configure mobile fullscreen and PWA

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PWA icons and manifest
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path('assets/icons/favicon-orange.png')
          out = Path('assets/icons')
          im = Image.open(src).convert('RGBA')
          for size in (192, 512):
              icon = im.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(out / f'pwa-{size}.png', optimize=True)
          manifest = {
              "name": "Полігон — навчальна гра",
              "short_name": "Полігон",
              "description": "Навчальна гра Полігон",
              "start_url": "/",
              "scope": "/",
              "display": "fullscreen",
              "orientation": "landscape",
              "background_color": "#020302",
              "theme_color": "#020302",
              "icons": [
                  {"src": "/assets/icons/pwa-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable"},
                  {"src": "/assets/icons/pwa-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}
              ]
          }
          import json
          Path('manifest.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Add mobile fullscreen and PWA metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'rel="manifest"' not in s:
              marker = '<meta name="theme-color" content="#020302">'
              addition = '\n'.join([
                  '<link rel="manifest" href="manifest.webmanifest">',
                  '<meta name="mobile-web-app-capable" content="yes">',
                  '<meta name="apple-mobile-web-app-capable" content="yes">',
                  '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">',
                  '<meta name="apple-mobile-web-app-title" content="Полігон">',
              ])
              s = s.replace(marker, marker + '\n' + addition, 1)

          if 'function requestGameFullscreen()' not in s:
              marker = 'function openLevels(){'
              helper = '\n'.join([
                  'function requestGameFullscreen(){',
                  "  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;",
                  "  if(standalone){try{screen.orientation?.lock?.('landscape').catch(()=>{})}catch(error){}return;}",
                  '  if(document.fullscreenElement||document.webkitFullscreenElement)return;',
                  '  const root=document.documentElement;',
                  '  const request=root.requestFullscreen||root.webkitRequestFullscreen;',
                  '  if(!request)return;',
                  '  try{',
                  '    const result=request.call(root);',
                  "    if(result&&typeof result.then==='function'){",
                  "      result.then(()=>{try{screen.orientation?.lock?.('landscape').catch(()=>{})}catch(error){}}).catch(()=>{});",
                  '    }',
                  '  }catch(error){}',
                  '}',
                  '',
                  ''
              ])
              s = s.replace(marker, helper + marker, 1)

          old = "chooseLevel.addEventListener('click',openLevels);"
          new = "chooseLevel.addEventListener('click',()=>{requestGameFullscreen();openLevels()});"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit mobile experience
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest assets/icons/pwa-192.png assets/icons/pwa-512.png
          git rm .github/workflows/mobile-fullscreen-pwa.yml
          git commit -m "Add mobile fullscreen and PWA support"
          git push
