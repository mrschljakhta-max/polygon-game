name: Replace level 5 card

on:
  push:
    paths:
      - '.github/workflows/replace-level5-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old level 5 overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.dev .card-art{filter:grayscale(.95) brightness(.40) sepia(.18);opacity:.80}', '.dev .card-art{filter:none;opacity:1}')
          s = s.replace('.dev-layer{position:absolute;inset:2%;z-index:10;display:flex;align-items:center;justify-content:center;overflow:hidden;background:repeating-linear-gradient(-45deg,rgba(8,10,6,.30) 0 8%,rgba(120,92,16,.12) 8% 12%)}', '.dev-layer{display:none}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use chained level 5 card artwork" || true
          git rm .github/workflows/replace-level5-card.yml
          git commit -m "Remove temporary level 5 workflow"
          git push
