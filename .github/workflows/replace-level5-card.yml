name: Replace level 5 card

on:
  push:
    paths:
      - '.github/workflows/replace-level5-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build level 5 artwork
        run: |
          cat .level5-part-0 .level5-part-1 .level5-part-2 .level5-part-3 .level5-part-4 .level5-part-5 > /tmp/level5.b64
          base64 -d /tmp/level5.b64 > assets/menu/level-5.webp
          rm -f .level5-part-0 .level5-part-1 .level5-part-2 .level5-part-3 .level5-part-4 .level5-part-5
          rm -f assets/menu/level-5-new.tmp
          rm -f .github/workflows/replace-level5-card.yml
      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace level 5 card artwork"
          git push
