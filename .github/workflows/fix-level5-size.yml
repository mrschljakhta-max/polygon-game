name: Fix level 5 card size

on:
  push:
    paths:
      - '.github/workflows/fix-level5-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Match level 5 visual size
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.dev .card-art{filter:none;opacity:1}'
          new = '.dev .card-art{filter:none;opacity:1;transform:scale(1.056,1.025);transform-origin:center}'
          if old not in s:
              raise SystemExit('Target CSS rule not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          for name in [
              'assets/menu/level-5-size-note.txt',
              'assets/menu/level-5-matched.tmp.txt',
              'noop.txt',
              '.github/workflows/fix-level5-size.yml',
          ]:
              Path(name).unlink(missing_ok=True)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Match level 5 card size to other cards'
          git push origin main
