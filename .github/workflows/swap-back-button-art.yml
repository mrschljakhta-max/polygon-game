name: Swap back button art

on:
  push:
    paths:
      - '.github/workflows/swap-back-button-art.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace back button asset reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/menu/back-button.svg'
          new = 'assets/menu/back-button-exact.webp'
          if old not in s:
              raise SystemExit('Old back button reference not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change and remove helper workflow
        run: |
          rm .github/workflows/swap-back-button-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/swap-back-button-art.yml
          git commit -m "Use exact back button artwork"
          git push
