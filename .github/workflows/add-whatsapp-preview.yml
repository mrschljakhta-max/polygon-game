name: Configure WhatsApp preview

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Open Graph metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<title>Полігон</title>'
          meta = '\n'.join([
              '<meta name="description" content="Полігон — навчальна гра. Обери рівень і пройди випробування на навчальному полігоні.">',
              '<meta property="og:type" content="website">',
              '<meta property="og:locale" content="uk_UA">',
              '<meta property="og:site_name" content="Полігон">',
              '<meta property="og:title" content="Полігон — навчальна гра">',
              '<meta property="og:description" content="Обери рівень. Пройди випробування. Перевір себе на навчальному полігоні.">',
              '<meta property="og:url" content="https://poligon-game.com/">',
              '<meta property="og:image" content="https://poligon-game.com/assets/social/poligon-whatsapp.jpg?v=1">',
              '<meta property="og:image:secure_url" content="https://poligon-game.com/assets/social/poligon-whatsapp.jpg?v=1">',
              '<meta property="og:image:type" content="image/jpeg">',
              '<meta property="og:image:width" content="600">',
              '<meta property="og:image:height" content="338">',
              '<meta property="og:image:alt" content="Полігон — обери рівень">',
              '<meta name="twitter:card" content="summary_large_image">',
              '<meta name="twitter:title" content="Полігон — навчальна гра">',
              '<meta name="twitter:description" content="Обери рівень. Пройди випробування. Перевір себе на навчальному полігоні.">',
              '<meta name="twitter:image" content="https://poligon-game.com/assets/social/poligon-whatsapp.jpg?v=1">',
          ])
          if 'property="og:title"' not in s:
              s = s.replace(marker, marker + '\n' + meta, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit preview metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-whatsapp-preview.yml
          git commit -m "Add WhatsApp link preview metadata"
          git push
