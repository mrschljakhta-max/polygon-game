name: Sector 3 smoke diagnostic

on:
  push:
    branches:
      - diagnostic/sector3-smoke-20260911

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright library
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1

      - name: Verify prologue continue flow
        run: |
          cat > sector3-flow.mjs <<'EOF'
          import { chromium } from 'playwright';
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--disable-gpu']});
          const page=await browser.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('http://127.0.0.1:8000/hotkeys/sector3-intro.html?diag=flow',{waitUntil:'load',timeout:15000});
          await page.waitForFunction(()=>document.documentElement.dataset.vidlikRuntime==='ready',{timeout:10000});
          const before=await page.evaluate(()=>({
            readyState:document.readyState,
            runtime:document.documentElement.dataset.vidlikRuntime,
            router:window.VIDLIK_STORY_ROUTER?.current||null,
            prologue:!!document.getElementById('vidlikPrologueTitle'),
            button:!!document.getElementById('vidlikPrologueContinue')
          }));
          console.log('BEFORE',JSON.stringify(before));
          await page.locator('#vidlikPrologueContinue').click({timeout:5000});
          await delay(7000);
          const after=await page.evaluate(()=>({
            readyState:document.readyState,
            runtime:document.documentElement.dataset.vidlikRuntime,
            router:window.VIDLIK_STORY_ROUTER?.current||null,
            prologue:!!document.getElementById('vidlikPrologueTitle'),
            introApi:!!window.VIDLIK_SECTOR3_INTRO,
            bodyClass:document.body.className,
            incomingVisible:document.querySelector('.incoming.visible')!==null,
            videoVisible:document.querySelector('.video.visible')!==null,
            help:document.getElementById('help')?.innerText||''
          }));
          console.log('AFTER',JSON.stringify(after));
          console.log('ERRORS',JSON.stringify(errors));
          if(before.runtime!=='ready'||!before.prologue||!before.button)throw new Error('Precondition failed');
          if(after.prologue)throw new Error('Prologue did not close');
          if(after.router!=='prologue-call')throw new Error('Story Router did not enter prologue-call');
          if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
          await browser.close();
          EOF
          python3 -m http.server 8000 >/tmp/sector3-http.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          node sector3-flow.mjs
          STATUS=$?
          kill $SERVER_PID || true
          exit $STATUS
