name: Preserve mobile fullscreen

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile fullscreen navigation
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          echo 'dmVudD0+e2lmKGV2ZW50LmtleT09PUNBTVBBSUdOX0tFWSlyZW5kZXJQcm9ncmVzcygpfSk7XG4iCmxpc3RlbmVyX2FkZCA9ICIiIndpbmRvdy5hZGRFdmVudExpc3RlbmVyKCdtZXNzYWdlJyxl' | base64 -d >> /tmp/patch.py
          echo '  ' | base64 -d >> /tmp/patch.py
          echo '' | base64 -d >> /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html game.html
          git rm .github/workflows/preserve-mobile-fullscreen.yml
          git commit -m "Keep mobile game inside fullscreen shell"
          git push
