name: Fix level 5 card bottom

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-level5-bottom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extend level 5 card to common bottom line
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.dev .card-art{filter:none;opacity:1;transform:scale(1.056,1.025);transform-origin:center}'
          new = '.dev .card-art{filter:none;opacity:1;transform:scale(1.056,1.070);transform-origin:50% 2%}'
          if old not in s:
              raise SystemExit('Expected level 5 sizing rule not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-level5-bottom.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-level5-bottom.yml
          git commit -m 'Align level 5 card bottom with other cards'
          git push
