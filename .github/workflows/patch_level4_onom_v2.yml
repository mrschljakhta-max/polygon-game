name: Patch Level 4 onomatopoeia v2
# trigger: 2026-08-26-onom-v2

on:
  push:
    paths:
      - '.github/workflows/patch_level4_onom_v2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate new Petrovych onomatopoeia
        run: python3 .github/scripts/patch_level4_onom_v2.py
      - name: Commit patched level 4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stages/15_level4_map.html stages/16_level4_rx.html game.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Integrate new Petrovych onomatopoeias into Level 4"
          git push
