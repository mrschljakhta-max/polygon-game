name: Fix back button asset
on:
  push:
    paths:
      - '.github/workflows/fix-back-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore reliable back button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          data='''[... ELLIPSIZATION ...]'''
          Path('assets/menu/back-button-exact.webp').write_bytes(base64.b64decode(data))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/menu/back-button-exact.webp
          git commit -m 'Fix back button image asset'
          git rm .github/workflows/fix-back-button.yml
          git commit -m 'Remove temporary back button workflow'
          git push
