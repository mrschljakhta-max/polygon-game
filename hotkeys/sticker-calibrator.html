<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020808">
<title>VIDLIK — Калібратор стікерів</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010606;font-family:"Segoe UI",Arial,sans-serif;color:#eafffb}.stage{position:fixed;inset:0;background:#010606 center/cover no-repeat;user-select:none}.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.03),rgba(0,0,0,.07))}.sticky{position:absolute;width:5.45vw;aspect-ratio:1/1.04;background:linear-gradient(145deg,#e8ce78,#c9aa52);box-shadow:0 8px 15px rgba(0,0,0,.28),inset 0 0 0 1px rgba(93,66,20,.25);filter:saturate(.86) brightness(.91);cursor:grab;touch-action:none;overflow:hidden}.sticky:active{cursor:grabbing}.sticky.selected{outline:2px solid #71fff1;outline-offset:3px;box-shadow:0 0 26px rgba(82,226,213,.34),0 8px 15px rgba(0,0,0,.28)}.sticky::after{content:"";position:absolute;right:0;bottom:0;border-style:solid;border-width:0 0 .7vw .7vw;border-color:transparent transparent rgba(101,77,30,.22) transparent}.one{left:79.75%;top:26.3%;transform:rotate(-1.4deg)}.two{left:82%;top:39.8%;transform:rotate(.9deg);display:flex;align-items:center;justify-content:center;padding:.5% .45%;color:#382914;font-family:"Segoe Print","Comic Sans MS",cursive;font-size:clamp(8px,.73vw,14px);font-weight:600;line-height:1.12;text-align:center}.one svg{width:100%;height:100%;display:block;padding:14%}.one path,.one circle,.one ellipse{fill:none;stroke:#463416;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.78}
.panel{position:fixed;z-index:5;left:18px;top:18px;width:min(390px,calc(100vw - 36px));padding:15px;border:1px solid rgba(82,226,213,.3);border-radius:12px;background:rgba(2,16,15,.93);box-shadow:0 15px 45px #0009;backdrop-filter:blur(12px)}.panel h1{font-size:17px;margin:0 0 6px}.panel p{margin:0 0 12px;color:#86aaa6;font-size:12px;line-height:1.4}.row{display:grid;grid-template-columns:90px 1fr 58px;gap:10px;align-items:center;margin:8px 0;font-size:12px}.row input{width:100%}.value{font-family:Consolas,monospace;color:#83fff2;text-align:right}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions button{border:1px solid #2f625d;border-radius:7px;background:#071b19;color:#bcece7;padding:8px 10px;cursor:pointer}.actions button.primary{border-color:#64e8dc;color:#061513;background:#4ddbd0}.json{position:fixed;z-index:5;left:18px;bottom:18px;width:min(560px,calc(100vw - 36px));padding:12px 14px;border:1px solid rgba(82,226,213,.24);border-radius:10px;background:rgba(2,12,11,.92);box-shadow:0 15px 45px #0008}.json pre{margin:0;max-height:180px;overflow:auto;color:#aefaf3;font:11px/1.45 Consolas,monospace;white-space:pre-wrap}.hint{position:fixed;right:18px;bottom:18px;color:#72908d;font:11px/1.45 Consolas,monospace;text-align:right;background:rgba(2,12,11,.72);padding:9px 11px;border-radius:8px}.cross{position:absolute;z-index:4;width:9px;height:9px;border:1px solid #8ffff1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none}.sticky.selected .cross{display:block}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="veil"></div>
 <div class="sticky one selected" id="one"><svg viewBox="0 0 100 100"><path d="M49 14 L25 72 Q49 82 73 72 Z"/><ellipse cx="49" cy="72" rx="24" ry="9"/><circle cx="67" cy="64" r="17"/><path d="M49 14 L49 72" opacity=".42"/></svg></div>
 <div class="sticky two" id="two">здати<br>на каву<br>до першого<br>числа</div>
</div>
<section class="panel"><h1>Калібратор стікерів</h1><p>Перетягни стікери на потрібне місце системного блока. Потім скопіюй JSON і надішли його мені.</p><div class="row"><span>Ширина</span><input id="width" type="range" min="2.5" max="10" step="0.05"><span class="value" id="widthVal"></span></div><div class="row"><span>Поворот</span><input id="rot" type="range" min="-12" max="12" step="0.1"><span class="value" id="rotVal"></span></div><div class="actions"><button id="sel1">Стікер 1</button><button id="sel2">Стікер 2</button><button id="reset">Скинути</button><button class="primary" id="copy">Копіювати JSON</button></div></section>
<section class="json"><pre id="json"></pre></section><div class="hint">Drag — перемістити<br>← ↑ ↓ → — 0.1%<br>Shift + стрілка — 0.5%</div>
<script>
(()=>{
 const stage=document.getElementById('stage');fetch('game.html?v=calibrator-bg1',{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/<img[^>]+class=["']bg["'][^>]+src=["'](data:image\/(?:webp|png);base64,[^"']+)["']/i)||t.match(/src=["'](data:image\/(?:webp|png);base64,[^"']+)["'][^>]+class=["']bg["']/i);if(m)stage.style.backgroundImage=`url("${m[1]}")`}).catch(()=>{});
 const els={one:document.getElementById('one'),two:document.getElementById('two')};
 const state={one:{left:79.75,top:26.3,width:5.45,rotation:-1.4},two:{left:82,top:39.8,width:5.45,rotation:.9}};const defaults=JSON.parse(JSON.stringify(state));let selected='one',drag=null;
 const width=document.getElementById('width'),rot=document.getElementById('rot'),widthVal=document.getElementById('widthVal'),rotVal=document.getElementById('rotVal'),json=document.getElementById('json');
 function apply(k){const s=state[k],e=els[k];e.style.left=s.left+'%';e.style.top=s.top+'%';e.style.width=s.width+'vw';e.style.transform=`rotate(${s.rotation}deg)`}
 function data(){return {basis:'viewport-percent',viewportHint:'Apply to .stage that fills 100vw × 100vh',stickyOne:{leftPct:+state.one.left.toFixed(3),topPct:+state.one.top.toFixed(3),widthVw:+state.one.width.toFixed(3),rotationDeg:+state.one.rotation.toFixed(2)},stickyTwo:{leftPct:+state.two.left.toFixed(3),topPct:+state.two.top.toFixed(3),widthVw:+state.two.width.toFixed(3),rotationDeg:+state.two.rotation.toFixed(2)}}}
 function sync(){Object.keys(els).forEach(k=>els[k].classList.toggle('selected',k===selected));width.value=state[selected].width;rot.value=state[selected].rotation;widthVal.textContent=state[selected].width.toFixed(2)+'vw';rotVal.textContent=state[selected].rotation.toFixed(1)+'°';json.textContent=JSON.stringify(data(),null,2)}
 function select(k){selected=k;sync()}
 Object.entries(els).forEach(([k,e])=>{e.addEventListener('pointerdown',ev=>{select(k);e.setPointerCapture(ev.pointerId);const r=stage.getBoundingClientRect();drag={id:ev.pointerId,dx:ev.clientX-r.left-r.width*state[k].left/100,dy:ev.clientY-r.top-r.height*state[k].top/100}});e.addEventListener('pointermove',ev=>{if(!drag||drag.id!==ev.pointerId)return;const r=stage.getBoundingClientRect();state[k].left=((ev.clientX-r.left-drag.dx)/r.width)*100;state[k].top=((ev.clientY-r.top-drag.dy)/r.height)*100;apply(k);sync()});e.addEventListener('pointerup',()=>drag=null);e.addEventListener('pointercancel',()=>drag=null)});
 width.addEventListener('input',()=>{state[selected].width=+width.value;apply(selected);sync()});rot.addEventListener('input',()=>{state[selected].rotation=+rot.value;apply(selected);sync()});document.getElementById('sel1').onclick=()=>select('one');document.getElementById('sel2').onclick=()=>select('two');document.getElementById('reset').onclick=()=>{state.one={...defaults.one};state.two={...defaults.two};apply('one');apply('two');sync()};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(data(),null,2));document.getElementById('copy').textContent='Скопійовано ✓';setTimeout(()=>document.getElementById('copy').textContent='Копіювати JSON',1200)}catch(e){}};
 window.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const d=e.shiftKey?.5:.1;if(e.key==='ArrowLeft')state[selected].left-=d;if(e.key==='ArrowRight')state[selected].left+=d;if(e.key==='ArrowUp')state[selected].top-=d;if(e.key==='ArrowDown')state[selected].top+=d;apply(selected);sync()});apply('one');apply('two');sync();
})();
</script>
</body>
</html>
