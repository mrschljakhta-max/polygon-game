<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020808">
<title>VIDLIK — Урок 00 · Інструктаж</title>
<style>
:root{--cyan:#52e2d5;--cyan2:#8ffff1;--text:#effffc;--muted:#789b97;--bad:#ff7272}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010606;color:var(--text);font-family:"Segoe UI",Inter,Arial,sans-serif}button{font:inherit}
.shell{position:fixed;inset:0;display:grid;place-items:center;background:#010606}.stage{position:relative;width:min(100vw,177.778vh);height:min(100vh,56.25vw);aspect-ratio:16/9;overflow:hidden;isolation:isolate;background:#020908}.bg{position:absolute;inset:0;z-index:0;background:#020908 center/cover no-repeat}.veil{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 48%,transparent 45%,rgba(0,0,0,.24) 100%)}
.task{position:absolute;z-index:3;left:2.25%;top:2.5%;width:27%;padding:.4% 0 .6% 1.45%;border-left:2px solid #49dace}.task small{display:block;color:#70b8b1;font-size:clamp(7px,.55vw,11px);letter-spacing:.12em;font-weight:800}.task label{display:block;margin-top:4.2vh;color:#608984;font-size:clamp(7px,.5vw,10px);letter-spacing:.14em;font-weight:800}.task h2{margin:.55em 0 0;font-size:clamp(16px,1.65vw,31px);line-height:1.08;letter-spacing:.01em}
.monitor{position:absolute;z-index:3;left:28.27%;top:18.3%;width:38.23%;height:32.6%;border-radius:4px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#17443f,#0a2421 55%,#04100f);box-shadow:inset 0 0 18px #0008}.osbar{height:12%;padding:0 3%;display:flex;align-items:center;justify-content:space-between;background:#061110dc;color:#638e89;font-size:clamp(7px,.5vw,10px)}.files{height:88%;display:flex;align-items:center;justify-content:center;gap:7%}.file{width:24%;height:43%;display:grid;place-items:center;align-content:center;gap:8%;border:1px solid transparent;border-radius:7px;color:#a8cfca;font-size:clamp(7px,.5vw,10px);transition:.25s}.file em{font-style:normal;font-size:2.5em}.file.active{border-color:#55e1d4;background:#12686166}.success{position:absolute;right:5%;top:18%;padding:.55em .8em;border:1px solid #4ee5d6;border-radius:7px;background:#0a2a27;color:#cbfff9;font-size:clamp(7px,.55vw,11px);opacity:0;transform:translateY(-4px);transition:.25s}.success.show{opacity:1;transform:none}
.reader{position:absolute;z-index:3;left:29%;bottom:4%;width:42%;height:12%;border:1px solid rgba(75,211,200,.25);border-radius:14px;background:rgba(3,16,15,.82);display:grid;place-items:center;align-content:center;gap:11%;box-shadow:0 18px 40px #0007}.reader label{color:#87aaa6;font-size:clamp(8px,.7vw,13px)}.keys{display:flex;gap:clamp(14px,1.2vw,22px)}.key{position:relative;min-width:clamp(32px,2.5vw,46px);padding:.45em .75em;text-align:center;border:1px solid #4c7873;border-radius:5px;background:linear-gradient(#17302e,#091716);box-shadow:0 3px #020706,inset 0 1px #d6fff021;font-size:clamp(8px,.65vw,12px)}.key+.key:before{content:'+';position:absolute;left:-14px;color:#617f7b}.reader.correct{border-color:#5bffdc;box-shadow:0 0 30px #12e7cf55}.reader.wrong{border-color:var(--bad);box-shadow:0 0 26px #ff38382d}
.hint,.exit{position:absolute;z-index:3;bottom:4%;height:8%;border:0;background:transparent;color:#87aaa6;font-size:clamp(8px,.66vw,12px);letter-spacing:.06em}.hint{left:2%;width:18%;text-align:left}.exit{right:2%;width:12%;text-align:right}
.focus{position:absolute;z-index:4;border:1px solid rgba(121,255,243,.9);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.48),0 0 28px rgba(82,226,213,.24);pointer-events:none;opacity:0;transition:.34s ease}.focus.show{opacity:1}.focus.taskf{left:1.7%;top:1.5%;width:29%;height:20%}.focus.monitorf{left:27.6%;top:17.4%;width:39.6%;height:34.4%}.focus.readerf{left:28.3%;bottom:3.1%;width:43.4%;height:13.8%}.focus.hintf{left:1.2%;bottom:2.8%;width:19.5%;height:9.8%}.focus.exitf{right:1.2%;bottom:2.8%;width:13.5%;height:9.8%}
.guide{position:absolute;z-index:8;left:50%;bottom:18.3%;transform:translateX(-50%);width:min(48%,760px);padding:1.25% 1.5%;border:1px solid rgba(83,220,207,.34);border-radius:13px;background:linear-gradient(145deg,rgba(3,22,20,.95),rgba(2,11,11,.93));box-shadow:0 20px 55px #000a}.guide-head{display:flex;align-items:center;justify-content:space-between;gap:20px}.guide .kicker{color:#73d9cf;font:800 clamp(7px,.55vw,11px)/1.2 Consolas,monospace;letter-spacing:.13em}.guide h1{margin:.45em 0 .35em;font-size:clamp(17px,1.45vw,28px)}.guide p{margin:0;color:#9cbbb7;font-size:clamp(9px,.76vw,14px);line-height:1.45}.steps{display:flex;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:#244842}.dot.on{background:#77fff1;box-shadow:0 0 9px #52e2d5}.guide-actions{display:flex;align-items:center;justify-content:space-between;margin-top:1.1em}.next,.back{border:0;background:transparent;color:#cffff9;cursor:pointer;font:700 clamp(9px,.72vw,13px)/1 Consolas,monospace;letter-spacing:.08em;padding:.7em}.next{color:#7efff1}.back{color:#6f918d}.next:disabled{opacity:.25;cursor:default}.close{position:absolute;z-index:9;right:2%;top:2%;border:0;background:transparent;color:#668d88;cursor:pointer;font:600 clamp(8px,.62vw,12px)/1 Consolas,monospace;letter-spacing:.08em}
.pause-demo{position:absolute;z-index:7;inset:0;display:grid;place-items:center;background:#0009;backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:.25s}.pause-demo.show{opacity:1}.pause-card{padding:2.2% 3.2%;border:1px solid #2c625d;border-radius:16px;background:#041613;color:#dffffb;text-align:center;box-shadow:0 20px 50px #000b}.pause-card b{display:block;color:#75fff0;font-size:2em;margin-bottom:.4em}.pause-card span{color:#86a7a3;font-size:.8em}
@media(max-width:800px){.guide{width:70%;bottom:18%}.task{width:34%}.monitor{left:20%;width:60%}.reader{left:22%;width:56%}.focus.monitorf{left:19.3%;width:61.4%}.focus.readerf{left:21.3%;width:57.4%}}
</style>
</head>
<body>
<main class="shell"><section class="stage" id="stage">
 <div class="bg" id="bg"></div><div class="veil"></div>
 <section class="task"><small id="lessonLabel">УРОК 00 · ІНСТРУКТАЖ</small><label>ЗАВДАННЯ</label><h2 id="taskTitle">ПОЗНАЙОМТЕСЬ З ІНТЕРФЕЙСОМ</h2></section>
 <div class="monitor"><div class="osbar"><span>VIDLIK OS</span><span>УКР · 08:00</span></div><div class="files"><div class="file" id="f1"><em>📁</em><span>Документи</span></div><div class="file active" id="f2"><em>📄</em><span>Звіт.docx</span></div><div class="file" id="f3"><em>📄</em><span>Нотатки.txt</span></div></div><div class="success" id="success">✓ Усі об’єкти виділено</div></div>
 <section class="reader" id="reader"><label id="readerLabel">Очікується комбінація клавіш</label><div class="keys" id="keys"><span class="key">—</span><span class="key">—</span></div></section>
 <button class="hint">⬡ ПІДКАЗКА · F1</button><button class="exit">ВИЙТИ · ESC</button>
 <div class="focus" id="focus"></div>
 <div class="pause-demo" id="pauseDemo"><div class="pause-card"><b>Ⅱ</b><strong>ПАУЗА</strong><br><span>Esc повертає до тренування</span></div></div>
 <button class="close" id="close">ВИЙТИ ДО СЕКТОРІВ</button>
 <section class="guide" id="guide"><div class="guide-head"><span class="kicker">VIDLIK · УРОК 00</span><div class="steps" id="steps"></div></div><h1 id="guideTitle"></h1><p id="guideText"></p><div class="guide-actions"><button class="back" id="back">← НАЗАД</button><button class="next" id="next">ДАЛІ →</button></div></section>
 </section></main>
<script>
(()=>{
 const bg=document.getElementById('bg');fetch('game.html?v=tutorial-bg1',{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/<img[^>]+class=["']bg["'][^>]+src=["'](data:image\/(?:webp|png);base64,[^"']+)["']/i)||t.match(/src=["'](data:image\/(?:webp|png);base64,[^"']+)["'][^>]+class=["']bg["']/i);if(m)bg.style.backgroundImage=`url("${m[1]}")`}).catch(()=>{});
 const data=[
  ['Ласкаво просимо до полігону','Урок 00 не вчить конкретної комбінації. Він показує, де знаходиться завдання, що відбувається на моніторі та як полігон реагує на твої клавіші.',''],
  ['Завдання','У верхньому лівому куті завжди написано, що саме потрібно зробити. Не шукай назву комбінації — виконай дію так, як зробив би її на справжньому ПК.','taskf'],
  ['Монітор','У центрі відтворюється робоча ситуація. Після правильної комбінації ти одразу побачиш результат дії саме тут.','monitorf'],
  ['Зчитувач клавіш','Нижній блок показує, що полігон отримує з клавіатури. Правильна комбінація підсвітиться, помилкова — дасть короткий червоний сигнал.','readerf'],
  ['Підказка','Якщо забув комбінацію — натисни F1. Підказка покаже потрібні клавіші. У контрольних місіях підказка може бути вимкнена.','hintf'],
  ['Пауза та вихід','Esc призупиняє вправу або повертає до рівнів. Час на паузі не має відволікати від навчання.','exitf'],
  ['Спробуй сам','Зараз виконай першу реальну дію: ВИДІЛІТЬ УСІ ОБ’ЄКТИ. Натисни Ctrl + A. Кнопка «Далі» стане доступною тільки після правильної комбінації.','readerf'],
  ['Готово','Ти щойно пройшов нульовий урок. Тепер можна переходити до секторів і працювати без зайвих пояснень.','']
 ];
 let step=0,complete=false,pressed=new Set();
 const title=document.getElementById('guideTitle'),text=document.getElementById('guideText'),focus=document.getElementById('focus'),next=document.getElementById('next'),back=document.getElementById('back'),dots=document.getElementById('steps'),taskTitle=document.getElementById('taskTitle'),reader=document.getElementById('reader'),readerLabel=document.getElementById('readerLabel'),keys=document.getElementById('keys'),pauseDemo=document.getElementById('pauseDemo');
 dots.innerHTML=data.map((_,i)=>`<i class="dot" data-dot="${i}"></i>`).join('');
 function show(){const d=data[step];title.textContent=d[0];text.textContent=d[1];focus.className='focus'+(d[2]?' '+d[2]+' show':'');document.querySelectorAll('.dot').forEach((x,i)=>x.classList.toggle('on',i===step));back.style.visibility=step===0?'hidden':'visible';next.textContent=step===data.length-1?'ДО СЕКТОРІВ →':'ДАЛІ →';next.disabled=step===6&&!complete;taskTitle.textContent=step===6?'ВИДІЛІТЬ УСІ ОБ’ЄКТИ':'ПОЗНАЙОМТЕСЬ З ІНТЕРФЕЙСОМ';if(step!==6&&!complete){reader.classList.remove('correct','wrong');readerLabel.textContent='Очікується комбінація клавіш';keys.innerHTML='<span class="key">—</span><span class="key">—</span>'}if(step===5){pauseDemo.classList.add('show');setTimeout(()=>pauseDemo.classList.remove('show'),900)}else pauseDemo.classList.remove('show')}
 function finish(){localStorage.setItem('vidlik-hotkeys-tutorial-complete-v1','1');location.href='desktop-sectors.html?v=12'}
 next.addEventListener('click',()=>{if(step===data.length-1){finish();return}if(step===6&&!complete)return;step++;show()});back.addEventListener('click',()=>{if(step>0){step--;show()}});document.getElementById('close').addEventListener('click',()=>location.href='desktop-sectors.html?v=12');
 function renderKeys(){const a=[];if(pressed.has('ControlLeft')||pressed.has('ControlRight'))a.push('Ctrl');if(pressed.has('KeyA'))a.push('A');keys.innerHTML=(a.length?a:['—','—']).map(k=>`<span class="key">${k}</span>`).join('')}
 window.addEventListener('keydown',e=>{if(step!==6)return;if(e.code==='KeyA'&&e.ctrlKey){e.preventDefault();pressed.add('ControlLeft');pressed.add('KeyA');renderKeys();complete=true;reader.classList.remove('wrong');reader.classList.add('correct');readerLabel.textContent='Прийнято';['f1','f2','f3'].forEach(id=>document.getElementById(id).classList.add('active'));document.getElementById('success').classList.add('show');next.disabled=false;return}if(e.code.startsWith('Control')){e.preventDefault();pressed.add(e.code);renderKeys();return}if(!['ShiftLeft','ShiftRight','AltLeft','AltRight'].includes(e.code)){e.preventDefault();reader.classList.add('wrong');readerLabel.textContent='Спробуйте Ctrl + A';setTimeout(()=>reader.classList.remove('wrong'),500)}},true);window.addEventListener('keyup',e=>{pressed.delete(e.code);if(step===6&&!complete)renderKeys()},true);
 show();
})();
</script>
</body>
</html>
