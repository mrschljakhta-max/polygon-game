<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020808">
<title>VIDLIK — Сектор 01</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010606}#gameFrame{display:block;width:100%;height:100%;border:0;background:#010606;opacity:0;transition:opacity .28s ease}.ready #gameFrame{opacity:1}.boot{position:fixed;inset:0;display:grid;place-items:center;background:#010606;color:#73d9cf;font:600 13px/1.4 Consolas,monospace;letter-spacing:.12em;z-index:4;transition:opacity .25s ease}.ready .boot{opacity:0;pointer-events:none}</style>
</head>
<body>
<div class="boot">СЕКТОР 01 · ЗАВАНТАЖЕННЯ</div>
<iframe id="gameFrame" tabindex="0" src="game.html?v=sector1-direct-4" title="Сектор 01 — базові комбінації" allow="fullscreen; keyboard-map"></iframe>
<script src="runtime-compat.js"></script>
<script src="enhanced-visuals.js"></script>
<script src="task-guidance.js"></script>
<script src="pause-enhancement.js?v=5"></script>
<script>
(()=>{
  const frame=document.getElementById('gameFrame');
  const params=new URLSearchParams(location.search);
  const rawLevel=parseInt(params.get('level')||'0',10);
  const requestedLevel=Number.isFinite(rawLevel)&&rawLevel>=1&&rawLevel<=10?rawLevel:0;
  let launched=false;
  let backBound=false;
  let attempts=0;
  let pollTimer=0;

  function focusGame(){
    try{frame.focus({preventScroll:true})}catch(e){try{frame.focus()}catch(_){} }
    try{frame.contentWindow&&frame.contentWindow.focus()}catch(e){}
  }

  function reveal(){
    document.body.classList.add('ready');
    requestAnimationFrame(focusGame);
    setTimeout(focusGame,80);
    setTimeout(focusGame,260);
  }

  function bindBackNavigation(d){
    if(backBound||!d)return;
    backBound=true;
    d.addEventListener('click',e=>{
      const back=e.target.closest&&e.target.closest('#back');
      if(back){
        e.preventDefault();
        e.stopImmediatePropagation();
        location.href='module-briefing.html?sector=1';
      }
    },true);
  }

  function openRequestedLesson(){
    if(launched)return true;
    let d;
    try{d=frame.contentDocument}catch(e){reveal();return true}
    if(!d||d.readyState==='loading')return false;

    bindBackNavigation(d);

    let levelButton=requestedLevel?d.querySelector(`[data-level="${requestedLevel-1}"]`):null;
    if(!levelButton){
      const sectorButton=d.getElementById('sector');
      if(sectorButton){
        sectorButton.click();
        levelButton=requestedLevel?d.querySelector(`[data-level="${requestedLevel-1}"]`):null;
      }
    }

    if(requestedLevel){
      if(levelButton&&!levelButton.disabled&&levelButton.getAttribute('aria-disabled')!=='true'){
        launched=true;
        levelButton.click();
        setTimeout(()=>{reveal();focusGame()},120);
        setTimeout(focusGame,420);
        return true;
      }
      return false;
    }

    launched=true;
    reveal();
    return true;
  }

  function startPolling(){
    clearInterval(pollTimer);
    attempts=0;
    pollTimer=setInterval(()=>{
      attempts++;
      if(openRequestedLesson()||attempts>=50){
        clearInterval(pollTimer);
        if(!document.body.classList.contains('ready'))reveal();
      }
    },100);
  }

  function bridgeKeyboardEvent(e,type){
    if(!launched||document.activeElement===frame)return;
    let d,w;
    try{d=frame.contentDocument;w=frame.contentWindow}catch(err){return}
    if(!d||!w)return;
    const inLesson=!!(d.querySelector('.taskbox')&&d.querySelector('.reader'));
    const paused=!!d.querySelector('.pause');
    if(!inLesson&&!paused)return;
    try{
      const forwarded=new w.KeyboardEvent(type,{
        key:e.key,
        code:e.code,
        location:e.location,
        ctrlKey:e.ctrlKey,
        shiftKey:e.shiftKey,
        altKey:e.altKey,
        metaKey:e.metaKey,
        repeat:e.repeat,
        bubbles:true,
        cancelable:true,
        composed:true
      });
      d.documentElement.dispatchEvent(forwarded);
      e.preventDefault();
      e.stopPropagation();
      focusGame();
    }catch(err){}
  }

  window.addEventListener('keydown',e=>bridgeKeyboardEvent(e,'keydown'),true);
  window.addEventListener('keyup',e=>bridgeKeyboardEvent(e,'keyup'),true);
  window.addEventListener('focus',()=>{if(launched)setTimeout(focusGame,0)});
  frame.addEventListener('pointerdown',()=>setTimeout(focusGame,0),true);

  frame.addEventListener('load',()=>{
    setTimeout(()=>{
      if(!openRequestedLesson())startPolling();
    },120);
  });

  if(frame.contentDocument&&frame.contentDocument.readyState!=='loading'){
    setTimeout(()=>{
      if(!openRequestedLesson())startPolling();
    },120);
  }

  setTimeout(()=>{
    if(!document.body.classList.contains('ready'))reveal();
  },5500);
})();
</script>
</body>
</html>
