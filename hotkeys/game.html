<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020808">
<title>VIDLIK — Клавіатурний полігон</title>
<style>
:root{--cyan:#28dfcf;--cyan2:#13aaa0;--bg:#010606;--panel:rgba(5,21,20,.88);--line:rgba(67,211,198,.28);--text:#effffc;--muted:#789b97;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010606;color:var(--text);font-family:"Segoe UI",Inter,Arial,sans-serif}button{font:inherit}.shell{position:fixed;inset:0;display:grid;place-items:center;background:#010606}.stage{position:relative;width:min(100vw,177.778vh);height:min(100vh,56.25vw);aspect-ratio:16/9;overflow:hidden;isolation:isolate;background:#020908;box-shadow:0 0 80px #00b3a622}
.bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;opacity:1;filter:none;pointer-events:none;user-select:none}.vignette{position:absolute;z-index:1;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 68%,rgba(0,0,0,.36) 100%),linear-gradient(to bottom,rgba(0,16,15,.015),rgba(0,12,11,.06))}#game{position:absolute;z-index:4;inset:0}
.panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(5,23,22,.86),rgba(2,10,10,.72));box-shadow:0 20px 50px #0008,inset 0 1px #c8fff511;backdrop-filter:blur(16px)}.kicker{color:#6ad9cf;font-size:clamp(8px,.63vw,12px);letter-spacing:.12em;font-weight:800}.primary,.secondary{border-radius:10px;padding:1em 1.3em;font-weight:800;cursor:pointer}.primary{border:1px solid #7affef;background:linear-gradient(#24d5c4,#0d978d);color:#001512}.secondary{border:1px solid #315c57;background:#081b18;color:#a9c9c5}
.menu{position:absolute;left:7%;top:9%;width:86%;height:82%;border-radius:22px;padding:4%;background:linear-gradient(90deg,rgba(1,12,11,.48),rgba(1,10,9,.17) 52%,rgba(1,8,8,.05));box-shadow:0 20px 60px #0005,inset 0 1px rgba(200,255,245,.09);backdrop-filter:none}.menu h1,.menu h2{margin:.45em 0;font-size:clamp(28px,3vw,58px);letter-spacing:-.03em}.menu p{color:#a3c2be;max-width:52em;font-size:clamp(10px,.9vw,17px);text-shadow:0 2px 12px #000}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:3%}.main-menu .topline h2{max-width:12ch;font-size:clamp(22px,2.15vw,40px);line-height:1.05;text-shadow:0 3px 18px #000}.summary{display:flex;align-items:center;gap:18px;color:#82a9a4;font-size:clamp(8px,.68vw,13px);text-shadow:0 2px 10px #000}.summary b{color:white;font-size:1.35em}.back{border:1px solid #315d58;background:#071714cc;color:#91b9b4;border-radius:8px;padding:.65em 1em;cursor:pointer}.main-menu .hero{display:grid;grid-template-columns:1.35fr .8fr;align-items:center;height:60%;gap:5%}.hero h1{font-size:clamp(38px,5vw,82px);line-height:.95;text-shadow:0 4px 28px #000}.hero-actions{display:grid;gap:12px;padding:6%;border:1px solid rgba(75,213,200,.2);border-radius:15px;background:rgba(2,13,12,.55);box-shadow:0 18px 45px #0006;backdrop-filter:blur(10px)}.progress{height:7px;background:#0d2723;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#08776e,#28dfcf,#a6fff6);width:var(--p);box-shadow:0 0 13px #28dfcf}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:1.6%;height:68%;margin-top:3%}.level{position:relative;text-align:left;padding:11% 9%;border:1px solid #1f4541;background:linear-gradient(145deg,rgba(7,27,25,.9),rgba(3,16,15,.88));color:#d7efeb;border-radius:14px;cursor:pointer;transition:.18s;backdrop-filter:blur(9px)}.level:hover:not(:disabled){transform:translateY(-2px);border-color:#54cbbf}.level:disabled{opacity:.48;cursor:not-allowed}.level:disabled .kicker,.level:disabled small{color:#78928e}.level.open{border-color:#32a89e}.level.done{border-color:#50dfcf;background:linear-gradient(145deg,#0a2b27,#041613)}.level .num{display:block;font-size:clamp(26px,2.5vw,46px);font-weight:800;margin:.55em 0 .35em}.level small{color:#7b9a96;line-height:1.3}.level .check{position:absolute;right:9%;top:8%;color:#7dffee;font-size:1.4em}
.taskbox{position:absolute;left:2%;top:2%;width:29%;min-height:12%;padding:1.2% 1.5%;border-radius:14px}.taskbox h3{margin:.45em 0 0;font-size:clamp(11px,1.05vw,20px);font-weight:650;line-height:1.2}.taskbox p{margin:.45em 0 0;color:#789b97;font-size:clamp(8px,.65vw,12px)}
.progresshud{position:absolute;left:35.5%;top:1.65%;width:31%;height:9.1%;padding:.72% 1.7%;display:grid;align-content:center;gap:8%;border-radius:14px;background:linear-gradient(180deg,rgba(5,23,22,.68),rgba(2,10,10,.42));border:1px solid rgba(67,211,198,.19);box-shadow:0 15px 40px #0005,0 0 24px rgba(40,223,207,.035);backdrop-filter:blur(10px)}.progress-head,.progress-meta{display:flex;align-items:center;justify-content:space-between}.progress-head span{font-size:clamp(6px,.5vw,10px);letter-spacing:.12em;font-weight:800;color:#6fb3ad}.progress-head strong{font-size:clamp(10px,.95vw,18px);color:#a5fff5}.progress-track{position:relative;height:clamp(6px,.52vw,10px);overflow:hidden;border:1px solid rgba(81,199,189,.28);border-radius:99px;background:#03100f;box-shadow:inset 0 2px 7px #000}.progress-track i{position:absolute;inset:0 auto 0 0;width:var(--p);border-radius:inherit;background:linear-gradient(90deg,#08776e,#21d8c7 68%,#8ffff1);box-shadow:0 0 16px #1cd6c5;transition:width .45s ease}.progress-track i:after{content:"";position:absolute;right:0;top:50%;width:8px;aspect-ratio:1;border-radius:50%;background:#d7fffb;box-shadow:0 0 12px #6dfff0;transform:translateY(-50%)}.progress-meta{font-size:clamp(5px,.43vw,8px);color:#567c78}
.hud{position:absolute;right:2%;top:2%;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:22%}.hud div{padding:7% 4%;text-align:center;border-radius:10px}.hud span{display:block;color:#668984;font-size:clamp(7px,.55vw,10px)}.hud b{font-size:clamp(11px,1vw,18px)}
.monitor{position:absolute;left:28.27%;top:18.3%;width:38.23%;height:32.6%;border:0;border-radius:4px;background:transparent;box-shadow:inset 0 0 18px #0008,0 0 22px #22d6c822;overflow:hidden}.desktop{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 40%,#17443f,#0a2421 55%,#04100f);font-size:clamp(8px,.63vw,12px)}.bar{height:12%;padding:0 3%;display:flex;align-items:center;justify-content:space-between;background:#061110dc;color:#638e89;border-bottom:1px solid #2fbeb015}.body{position:absolute;inset:12% 0 0;display:grid;place-items:center}.window{width:82%;height:78%;background:#e5ebe8;color:#24312f;border-radius:5px;overflow:hidden;box-shadow:0 10px 30px #0006}.wtitle{height:15%;padding:0 4%;display:flex;align-items:center;justify-content:space-between;background:#14302d;color:#b6d4d0}.toolbar{height:15%;padding:0 4%;display:flex;align-items:center;gap:4%;background:#f4f6f5;border-bottom:1px solid #b7c5c2}.tool{font-weight:700;padding:.25em .5em;border-radius:3px}.tool.on{background:#0fa99c;color:#fff}.paper{margin:4% auto;width:82%;height:55%;background:white;padding:5%;box-shadow:0 2px 8px #0002}.sel{background:#15a699;color:white;padding:1px 3px}.filegrid{display:flex;gap:5%;align-items:center;justify-content:center;width:100%;height:100%}.file{width:24%;height:42%;display:grid;place-items:center;align-content:center;gap:7%;border:1px solid transparent;border-radius:7px;color:#a8cfca}.file em{font-style:normal;font-size:2.5em}.file.active{border-color:#55e1d4;background:#12686166}.file.cut{opacity:.42;border-style:dashed}.badge{position:absolute;right:5%;top:7%;padding:.55em .8em;border:1px solid #4ee5d6;border-radius:7px;background:#0a2a27;color:#cbfff9}.searchbox{position:absolute;right:5%;top:18%;padding:.7em 1em;background:white;border:2px solid #14a99c;color:#475a57;border-radius:4px}.printview{display:grid;place-items:center;height:100%;color:#285b55;font-size:1.4em}.success{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;background:#043e39e8;color:white}.success b{font-size:3em;color:#8affed}
.reader{position:absolute;left:29%;bottom:4%;width:42%;height:12%;border-radius:14px;display:grid;place-items:center;align-content:center;gap:12%;padding:1%}.reader .label{color:#87aaa6;font-size:clamp(8px,.7vw,13px)}.keys{display:flex;gap:clamp(14px,1.2vw,22px);align-items:center}.key{position:relative;min-width:clamp(32px,2.5vw,46px);padding:.45em .75em;text-align:center;border:1px solid #4c7873;border-radius:5px;background:linear-gradient(#17302e,#091716);box-shadow:0 3px #020706,inset 0 1px #d6fff021}.key+.key:before{content:"+";position:absolute;left:-14px;color:#617f7b}.reader.wrong{border-color:#ff6b6b;box-shadow:0 0 30px #ff383844}.reader.correct{border-color:#5bffdc;box-shadow:0 0 30px #12e7cf55}.hint,.exit{position:absolute;bottom:4%;height:8%;border-radius:10px;color:#87aaa6;cursor:pointer}.hint{left:2%;width:18%}.exit{right:2%;width:12%}.note{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);padding:.6em .9em;border:1px solid #7d6b38;border-radius:6px;background:#17150fe8;color:#d8ca91;font-size:clamp(7px,.58vw,11px)}
.result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52%;padding:4%;border-radius:20px;text-align:center}.seal{margin:auto;width:70px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1px solid #52e4d6;background:#0b3b36;color:#8effef;font-size:2em}.result h1{font-size:clamp(28px,3vw,56px);margin:.3em}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4% 0}.result-grid div{padding:14% 5%;border:1px solid #285c57;border-radius:8px;background:#091a18}.result-grid span{display:block;color:#6d8f8b;font-size:.75em}.actions{display:flex;justify-content:center;gap:10px}.pause{position:absolute;inset:0;display:grid;place-items:center;background:#000b;backdrop-filter:blur(10px)}
@media(max-width:800px){.level-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr)}.menu{height:92%;top:4%;overflow:auto}.monitor{left:20%;width:60%;top:19%;height:34%}.hud{width:30%}.taskbox{width:34%}.progresshud{left:35%;width:30%}.reader{left:22%;width:56%}}
</style>

function mainMenu(){const done=profile.completed.length,p=Math.round(done/10*100),next=Math.min(done,9);return `<section class="menu panel main-menu"><div class="topline"><div><span class="kicker">VIDLIK · ЦИФРОВА ГРАМОТНІСТЬ</span><h2>Клавіатурний полігон</h2></div><div class="summary"><span>СЕКТОР 01</span><b>${done}/10</b></div></div><div class="hero"><div><span class="kicker">БАЗОВІ КОМБІНАЦІЇ</span><h1>Керуйте<br>швидше.</h1><p>10 рівнів практики: від перших комбінацій до контрольної місії.</p></div><div class="hero-actions"><button class="primary" id="continue">▶ ${done?'ПРОДОВЖИТИ':'РОЗПОЧАТИ'}</button><span>Рівень ${String(next+1).padStart(2,'0')} · ${esc(LEVELS[next].name)}</span><div class="progress"><i style="--p:${p}%"></i></div><small>${done} пройдено · ${10-done} залишилось</small><button class="secondary" id="sector">Карта сектору</button></div></div></section>`}
function sectorMenu(){const done=profile.completed.length;const tiles=LEVELS.map((l,i)=>{const open=unlocked(i),completed=profile.completed.includes(i+1);return `<button class="level ${open?'open':''} ${completed?'done':''}" ${open?'':'disabled'} data-level="${i}"><span class="kicker">РІВЕНЬ</span><span class="num">${String(l.n).padStart(2,'0')}</span><small>${esc(l.name)}</small>${completed?'<span class="check">✓</span>':''}</button>`}).join('');return `<section class="menu panel"><div class="topline"><div><span class="kicker">СЕКТОР 01 · РІВНІ 01–10</span><h2>Базові комбінації</h2></div><div class="summary"><span>Пройдено</span><b>${done}/10</b><button class="back" id="back">← Меню</button></div></div><div class="level-grid">${tiles}</div></section>`}
function visual(scene){const fileScenes=['select','copy','paste','cut','move'].includes(scene),selectDone=scene==='select'&&feedback==='correct';let inner='';if(fileScenes){inner=`<div class="filegrid"><div class="file ${selectDone?'active':''}"><em>📁</em><span>Документи</span></div><div class="file active ${scene==='cut'?'cut':''}"><em>📄</em><span>Звіт.docx</span></div><div class="file ${selectDone?'active':''}"><em>📄</em><span>Нотатки.txt</span></div></div>${selectDone?'<div class="badge">✓ Усі об’єкти виділено</div>':''}`}else{const on=scene==='bold'?'B':scene==='italic'?'I':scene==='underline'?'U':'';inner=`<div class="window"><div class="wtitle"><span>Навчальний документ</span><span>— □ ×</span></div><div class="toolbar"><span class="tool ${on==='B'?'on':''}">B</span><span class="tool ${on==='I'?'on':''}">I</span><span class="tool ${on==='U'?'on':''}">U</span></div>${scene==='print'?'<div class="printview">▤ Підготовка до друку</div>':`<div class="paper"><b class="${['selectText','copyText','cutText','pasteText'].includes(scene)?'sel':''}">Цифрова грамотність</b><p>Гарячі клавіші пришвидшують типові робочі дії.</p></div>`}${scene==='find'?'<div class="searchbox">⌕ Пошук у документі</div>':''}${scene==='save'||scene==='saveAs'?'<div class="badge">● Є незбережені зміни</div>':''}</div>`}return `<div class="desktop"><div class="bar"><span>VIDLIK OS</span><span>УКР · 08:00</span></div><div class="body">${inner}</div>${feedback==='correct'&&scene!=='select'?'<div class="success"><b>✓</b><span>Дію виконано</span></div>':''}</div>`}
function currentTask(){const raw=LEVELS[levelIndex].tasks[taskIndex];return {title:raw[0],text:raw[1],main:raw[2],labels:raw[3],scene:raw[4],shift:!!raw[5]}}
function playing(){const l=LEVELS[levelIndex],t=currentTask(),done=taskIndex+(feedback==='correct'?1:0),pct=Math.round(done/l.tasks.length*100),live=[...pressed].map(c=>c.startsWith('Control')?'Ctrl':c.startsWith('Shift')?'Shift':c.startsWith('Key')?c.slice(3):c);const keys=feedback==='correct'?t.labels:live.length?live:(hints&&!l.noHint?t.labels:['—','—']);return `<section class="taskbox panel"><span class="kicker">РІВЕНЬ ${String(l.n).padStart(2,'0')} · ${esc(l.name)}</span><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p></section><section class="progresshud"><div class="progress-head"><span>ПРОГРЕС ТРЕНУВАННЯ</span><strong>${pct}%</strong></div><div class="progress-track"><i style="--p:${pct}%"></i></div><div class="progress-meta"><span>${done} виконано</span><span>${l.tasks.length-done} залишилось</span></div></section><section class="hud"><div class="panel"><span>Час</span><b id="time">${fmt(seconds)}</b></div><div class="panel"><span>Помилки</span><b>${errors}</b></div></section><div class="monitor">${visual(t.scene)}</div><section class="reader panel ${feedback}"><span class="label">${feedback==='wrong'?'Спробуйте іншу комбінацію':feedback==='correct'?'Прийнято':'Очікується комбінація клавіш'}</span><div class="keys">${keys.map(k=>`<span class="key">${esc(k)}</span>`).join('')}</div></section>${l.noHint?'':`<button class="hint panel" id="hint">? Підказка</button>`}<button class="exit panel" id="exit">Вийти · Esc</button>${!lockOK?'<div class="note">Браузер не підтримує повне блокування системних клавіш.</div>':''}`}
function score(){return Math.max(0,1000-errors*25-hints*10+Math.max(0,120-seconds))}function complete(){const l=LEVELS[levelIndex],s=score();if(!profile.completed.includes(l.n))profile.completed.push(l.n);profile.completed.sort((a,b)=>a-b);profile.xp=(profile.xp||0)+s;profile.best[l.n]=Math.max(profile.best[l.n]||0,s);save();phase='complete';stopTimer();navigator.keyboard?.unlock?.();render()}function result(){const l=LEVELS[levelIndex];return `<section class="result panel"><div class="seal">✓</div><span class="kicker">РІВЕНЬ ${String(l.n).padStart(2,'0')} ЗАВЕРШЕНО</span><h1>${score()} XP</h1><p>${esc(l.name)} — виконано.</p><div class="result-grid"><div><span>Вправ</span><b>${l.tasks.length}</b></div><div><span>Час</span><b>${fmt(seconds)}</b></div><div><span>Помилки</span><b>${errors}</b></div><div><span>Підказки</span><b>${hints}</b></div></div><div class="actions"><button class="primary" id="next">${l.n<10?'Наступний рівень →':'До сектору'}</button><button class="secondary" id="repeat">↻ Повторити</button></div></section>`}
function render(){if(phase==='menu')game.innerHTML=mainMenu();else if(phase==='sector')game.innerHTML=sectorMenu();else if(phase==='complete')game.innerHTML=result();else{game.innerHTML=playing();if(paused)game.insertAdjacentHTML('beforeend','<div class="pause"><section class="result panel"><div class="seal">Ⅱ</div><h2>Призупинено</h2><button class="primary" id="resume">▶ Продовжити</button></section></div>')}bind()}function bind(){document.getElementById('continue')?.addEventListener('click',()=>startLevel(Math.min(profile.completed.length,9)));document.getElementById('sector')?.addEventListener('click',()=>{phase='sector';render()});document.getElementById('back')?.addEventListener('click',()=>{phase='menu';render()});document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>startLevel(+b.dataset.level)));document.getElementById('hint')?.addEventListener('click',()=>{hints++;render()});document.getElementById('exit')?.addEventListener('click',leave);document.getElementById('resume')?.addEventListener('click',enter);document.getElementById('repeat')?.addEventListener('click',()=>startLevel(levelIndex));document.getElementById('next')?.addEventListener('click',()=>{if(levelIndex<9)startLevel(levelIndex+1);else{phase='sector';render()}})}async function enter(){try{if(!document.fullscreenElement)await shell.requestFullscreen({navigationUI:'hide'})}catch(e){}try{if(navigator.keyboard?.lock)await navigator.keyboard.lock()}catch(e){lockOK=false}paused=false;phase='playing';runTimer();render()}function startLevel(i){if(!unlocked(i))return;clearTimeout(nextTimer);levelIndex=i;taskIndex=errors=hints=seconds=0;feedback='idle';pressed.clear();locked=false;enter()}async function leave(){clearTimeout(nextTimer);stopTimer();navigator.keyboard?.unlock?.();paused=false;phase='sector';if(document.fullscreenElement)try{await document.exitFullscreen()}catch(e){}render()}function runTimer(){stopTimer();timer=setInterval(()=>{if(phase==='playing'&&!paused){seconds++;const el=document.getElementById('time');if(el)el.textContent=fmt(seconds)}},1000)}function stopTimer(){clearInterval(timer)}document.addEventListener('fullscreenchange',()=>{if(phase==='playing'&&!document.fullscreenElement){paused=true;stopTimer();render()}});window.addEventListener('keydown',e=>{if(phase!=='playing'||paused)return;if(e.code==='Escape'){e.preventDefault();leave();return}if(e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||e.code.startsWith('Control')||e.code.startsWith('Shift'))e.preventDefault();if(e.repeat||locked)return;pressed.add(e.code);if(e.code.startsWith('Control')||e.code.startsWith('Shift')){render();return}const t=currentTask();const ok=e.ctrlKey&&e.code===t.main&&!e.altKey&&(t.shift?e.shiftKey:!e.shiftKey);if(ok){locked=true;feedback='correct';render();clearTimeout(nextTimer);nextTimer=setTimeout(()=>{locked=false;pressed.clear();feedback='idle';if(taskIndex>=LEVELS[levelIndex].tasks.length-1)complete();else{taskIndex++;render()}},2000)}else{errors++;feedback='wrong';render();setTimeout(()=>{if(feedback==='wrong'&&!locked){feedback='idle';render()}},600)}},true);window.addEventListener('keyup',e=>{pressed.delete(e.code);if(phase==='playing'&&!paused&&!locked)render()},true);render();
</script>
<script>
/* Sector 01 keeps its established renderer while sharing capture/release behavior with every sector. */
enter=async function(){const capture=await window.VidlikKeyboard.capture(shell);lockOK=capture.keyboardLock;paused=false;phase='playing';runTimer();render()};
leave=async function(){clearTimeout(nextTimer);stopTimer();paused=false;phase='sector';await window.VidlikKeyboard.release(true);render()};
</script>
</body></html>
