<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05090c">
<title>HOTKI — Сектор 3 · Стартовий дзвінок Полі</title>
<link rel="stylesheet" href="sector3-intro.css?v=20260906-2">
<link rel="stylesheet" href="sector3-incoming-effects.css?v=20260906-2">
<link rel="stylesheet" href="sector3-caption-tuning.css?v=20260906-1">
<link rel="stylesheet" href="sector3-admin.css?v=20260906-2">
</head>
<body>
<div class="app">
  <main class="scene" id="scene" tabindex="0" aria-label="Стартовий дзвінок Полі">
    <div class="camera" id="camera">
      <img class="desk" src="assets/sector3-prologue/desk.webp" alt="Робочий стіл HOTKI">

      <section class="monitor-screen" aria-label="Монітор">
        <img class="monitor-wallpaper" src="assets/sector3-prologue/monitor-wallpaper.webp" alt="">
        <div class="desktop-icons" id="desktopIcons">
          <button class="desktop-icon" type="button" data-app="pc"><img src="assets/sector3-prologue/icon-pc.webp" alt=""><span>Цей ПК</span></button>
          <button class="desktop-icon" type="button" data-app="folder"><img src="assets/sector3-prologue/icon-folder.webp" alt=""><span>Документи</span></button>
          <button class="desktop-icon" type="button" data-app="excel"><img src="assets/sector3-prologue/icon-excel.webp" alt=""><span>Microsoft<br>Excel</span></button>
          <button class="desktop-icon" type="button" data-app="trash"><img src="assets/sector3-prologue/icon-trash.webp" alt=""><span>Кошик</span></button>
        </div>
        <div class="taskbar"><span class="start-mark">⊞</span><span>VIDLIK OS</span><span class="taskbar-spacer"></span><span id="desktopClock">--:--</span><span>UKR</span></div>
      </section>

      <section class="tablet-screen" id="tabletScreen" aria-label="Екран планшета">
        <div class="tablet-layer idle visible" id="idleLayer">
          <img src="assets/sector3-prologue/tablet-lock.webp" alt="Екран блокування VIDLIK">
          <div class="lock-overlay"><strong id="lockTime">--:--</strong><span id="lockDate">—</span></div>
        </div>
        <div class="tablet-layer incoming" id="incomingLayer">
          <img src="assets/sector3-prologue/incoming-call.webp" alt="Вхідний дзвінок від Полі">
          <button class="accept" id="acceptBtn" type="button" aria-label="Прийняти дзвінок"></button>
        </div>
        <div class="tablet-layer video" id="videoLayer">
          <img class="polya-frame" id="polyaFrame" src="assets/sector3-prologue/polya-01.webp" alt="Поля під час таємного відеодзвінка">
          <div class="video-shade"></div>
          <div class="call-top"><span><i></i> захищений канал</span><span id="sceneCount">01 / 06</span></div>
          <div class="caption"><b>ПОЛЯ</b><p id="subtitle"></p></div>
          <div class="call-progress" id="callProgress"></div>
          <div class="glitch"></div>
        </div>

        <div class="tablet-layer admin-layer" id="adminLayer" aria-label="Чат із системним адміністратором VIDLIK">
          <div class="admin-shell">
            <header class="admin-header">
              <div class="admin-header-avatar" aria-hidden="true"></div>
              <div class="admin-header-copy">
                <div class="admin-header-name">СИСТЕМНИЙ АДМІНІСТРАТОР</div>
                <div class="admin-online"><i></i><span>Онлайн</span></div>
              </div>
            </header>

            <div class="admin-chat" id="adminChat" aria-live="polite"></div>

            <div class="admin-composer" aria-hidden="true">
              <span class="admin-attach">⌕</span>
              <span class="admin-placeholder">Напишіть повідомлення...</span>
              <span class="admin-send">➤</span>
            </div>
            <div class="admin-footer" id="adminFooter">ENTER · ПРОДОВЖИТИ</div>
          </div>
        </div>
      </section>
    </div>

    <div class="shade"></div>
    <div class="keys" id="help"><span><kbd>ENTER</kbd> прийняти / далі</span><span><kbd>ESC</kbd> пауза</span><span><kbd>R</kbd> спочатку</span></div>
    <div class="pause" id="pause"><div><h2>ПАУЗА</h2><p>Enter / Space — продовжити · R — почати спочатку</p></div></div>
  </main>
</div>
<script src="sector3-intro.js?v=20260906-4"></script>
</body>
</html>
