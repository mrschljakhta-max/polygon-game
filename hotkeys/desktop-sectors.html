<style>
/* Keep staggered folder entrance while the selected state adds a separate living outline. */
.mb-folder.mb-selected{animation:mbFolderDrop .70s cubic-bezier(.18,.85,.23,1) both!important;animation-delay:calc(.48s + var(--i) * .115s)!important}
.mb-folder.mb-selected::after{content:"";position:absolute;z-index:6;inset:1.5%;pointer-events:none;border:1px solid rgba(97,255,239,.72);clip-path:inherit;box-shadow:inset 0 0 20px rgba(83,226,213,.13);animation:mbSelectedOutline 3.6s ease-in-out infinite}
@keyframes mbSelectedOutline{0%,100%{opacity:.32}50%{opacity:.92;box-shadow:inset 0 0 29px rgba(83,226,213,.24)}}
.mb-status.active{animation:mbStatusWake .48s ease both,mbActivePulse 3.6s ease-in-out 1s infinite!important}
@keyframes mbActivePulse{0%,100%{box-shadow:0 0 10px rgba(55,223,207,.08)}50%{box-shadow:0 0 22px rgba(55,223,207,.28)}}
.mb-folder::before{transform:rotate(-.65deg) translate(4px,-3px)!important}
</style>
</head>
