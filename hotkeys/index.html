<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020808">
  <title>VIDLIK — Клавіатурний полігон</title>
  <meta name="description" content="Практичний тренажер комбінацій клавіш у повноекранному режимі.">
  <style>
    :root{--cyan:#28dfcf;--cyan2:#13aaa0;--ink:#020808;--panel:rgba(5,21,20,.94);--line:rgba(67,211,198,.25);--text:#effffc;--muted:#799b98}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#010606;color:var(--text)}
    body{font-family:"Segoe UI",Inter,Arial,sans-serif}.shell{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#0c2927,#04100f 43%,#010404 76%)}.shell:fullscreen{display:grid;place-items:center;background:#010606}
    .stage{position:relative;width:min(100vw,150svh);height:min(100svh,66.667vw);aspect-ratio:3/2;overflow:hidden;isolation:isolate;background:#020908;box-shadow:0 0 80px #00b3a622}
    .shell:fullscreen .stage{width:min(100vw,150vh);height:min(100vh,66.667vw)}
    .bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,transparent 45%,#0009 100%),linear-gradient(#00100f22,#00100f44)}
    button{font:inherit}.glass{position:absolute;z-index:8;border:1px solid var(--line);background:linear-gradient(135deg,rgba(7,26,25,.96),rgba(5,15,15,.93));box-shadow:0 8px 30px #0009,inset 0 1px #b5fff711;backdrop-filter:blur(12px)}
    .task{left:1.7%;top:2.2%;width:29.6%;height:12.7%;padding:1.5% 1.8%;border-radius:7px}.task .micro,.eyebrow{color:#55c9bf;font-weight:700;letter-spacing:.09em;font-size:clamp(7px,.64vw,12px)}
    .task h1{margin:.42em 0 .15em;font-size:clamp(11px,1.02vw,19px);font-weight:550;line-height:1.15}.task p{margin:0;color:#6f9290;font-size:clamp(7px,.62vw,12px)}
    .levels{left:34.4%;top:4.3%;width:35.7%;height:8.3%;border-radius:999px;display:flex;align-items:center;justify-content:space-evenly;padding:0 1%}.levels i{width:7.4%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-style:normal;color:#587573;background:#122625;font-size:clamp(7px,.7vw,13px)}.levels i.done{color:#7caaa6;background:#183432}.levels i.active{color:#fff;background:#13a99d;border:1px solid #84fff5;box-shadow:0 0 14px #16d8ca}
    .stats{position:absolute;z-index:8;right:1.6%;top:2.3%;width:24.7%;height:11.6%;display:grid;grid-template-columns:repeat(3,1fr);gap:3%}.stats div{border:1px solid #43b9ae20;background:#071615ee;display:grid;place-items:center;align-content:center;gap:8%;border-radius:7px}.stats span{color:#6b8987;font-size:clamp(7px,.57vw,11px)}.stats b{font-size:clamp(10px,1.05vw,19px);font-weight:500}
    .monitor{position:absolute;z-index:6;left:24.2%;top:18.3%;width:45.4%;height:32.6%;border-radius:4px;overflow:hidden;background:#021010;box-shadow:inset 0 0 28px #000,0 0 22px #14cfc929}.desktop{position:relative;width:100%;height:100%;overflow:hidden;color:#bffbf4;background:radial-gradient(circle at 52% 40%,#123d3b,#08201f 45%,#020b0b);font-size:clamp(7px,.54vw,10px)}
    .topbar{height:11%;display:flex;align-items:center;justify-content:space-between;padding:0 3%;color:#648b88;background:#020908b8;border-bottom:1px solid #43d9ca12}.icons{position:relative;height:89%;padding:4% 3%;display:flex;flex-direction:column;gap:2%}.icon{width:25%;min-width:54px;display:flex;align-items:center;gap:8%;padding:2%;border:1px solid transparent;border-radius:4px;color:#a9cfcc}.icon em{font-style:normal;font-size:1.8em}.icon.sel{background:#15746f66;border-color:#43ddd0a0;box-shadow:0 0 12px #15c8ba2e}.icon.cut{opacity:.42;border-style:dashed}
    .target{position:absolute;inset:25% 28%;display:grid;place-items:center;align-content:center;gap:6%;border:1px dashed #39d8ca;background:#0b3936e8;border-radius:8px;color:#d7fffb;animation:pulse 1s ease-in-out infinite alternate}.target strong{font-size:3em}.badge{position:absolute;right:5%;top:10%;padding:4% 5%;border:1px solid #4ce2d5;border-radius:6px;background:#0a2826ed}
    .doc{position:absolute;inset:4%;background:#cfd6d3;color:#1c2625;border-radius:4px;overflow:hidden;box-shadow:0 12px 30px #0007}.win{height:14%;display:flex;justify-content:space-between;align-items:center;padding:0 3%;background:#122b29;color:#a9cfcc}.toolbar{height:14%;background:#e8edeb;display:flex;align-items:center;gap:2%;padding:0 3%;border-bottom:1px solid #aab8b5}.toolbar b{min-width:8%;height:62%;display:grid;place-items:center;border-radius:2px}.toolbar b.on{background:#0aa99c;color:#fff}.paper{margin:4% auto;width:82%;height:60%;background:#fff;padding:5%;box-shadow:0 2px 7px #0003;font-size:clamp(7px,.48vw,9px)}.paper p{line-height:1.45;color:#53605e}.selection{color:#fff;background:#159a90;padding:1px 3px;font-weight:400}.search{position:absolute;z-index:2;right:3%;top:16%;width:43%;height:17%;display:flex;align-items:center;gap:5%;padding:0 4%;background:#fff;border:2px solid #13a99d;border-radius:3px;color:#687875}.print{height:72%;display:grid;place-items:center;align-content:center;gap:8%;color:#214d49}.print strong{font-size:3em}.unsaved{position:absolute;right:3%;bottom:2%;color:#9b463f}.success{position:absolute;inset:0;z-index:5;display:grid;place-items:center;align-content:center;gap:8%;color:#fff;font-weight:700;background:#033d38e8;animation:success .25s ease-out}.success strong{width:18%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:2.6em;background:#17b6a8;box-shadow:0 0 25px #43fff0}
    .reader{left:31.5%;bottom:2.5%;width:37%;height:10.2%;border-radius:9px;display:grid;grid-template-rows:43% 57%;place-items:center;padding:.7% 2%;transition:.2s}.reader>span{color:#9bb6b3;font-size:clamp(7px,.67vw,13px)}.combo{display:flex;align-items:center;gap:clamp(12px,1.2vw,23px)}.key{position:relative;min-width:clamp(27px,2.2vw,42px);padding:.42em .7em;text-align:center;border-radius:4px;background:linear-gradient(#17302e,#0a1817);color:#d7f5f2;border:1px solid #4e7773;box-shadow:0 2px #020706,inset 0 1px #d6fff021;font-size:clamp(8px,.64vw,12px)}.key+.key:before{content:"+";position:absolute;left:-13px;color:#607f7c}.reader.wrong{border-color:#ff6868aa;box-shadow:0 0 25px #ff303044}.reader.wrong>span{color:#ff9797}.reader.correct{border-color:#5bffdcbb;box-shadow:0 0 28px #12e7cf55}.reader.correct>span{color:#8dffed}
    .hint,.exit{bottom:3%;height:7.6%;border-radius:6px;color:#6f9490;cursor:pointer;transition:.2s}.hint:hover,.exit:hover{color:#d7fffb;border-color:#35bdb1}.hint{left:1.8%;width:26.2%;display:flex;align-items:center;gap:4%;padding:0 2%;text-align:left}.hint .q{font-size:1.4em;color:#34c8bb}.hint span{display:grid;font-size:clamp(7px,.55vw,10px)}.hint b{color:#8db0ad}.exit{right:1.7%;width:13%;display:flex;align-items:center;justify-content:center;gap:12%}.exit kbd{padding:.42em .65em;border:1px solid #31514e;border-radius:4px;background:#0e1b1a;color:#8eb0ad;font-size:.8em}
    .card{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(58%,660px);padding:5% 6%;text-align:center;border:1px solid #61eadd42;border-radius:20px;background:linear-gradient(145deg,#081d1cf7,#020a0af7);box-shadow:0 30px 100px #000,inset 0 1px #b5fff71a,0 0 45px #0cc7b82b;backdrop-filter:blur(18px);animation:card .5s cubic-bezier(.2,.8,.2,1)}.seal{margin:0 auto 4%;width:clamp(42px,5.2vw,76px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;color:#8fffee;background:#0a3a35;border:1px solid #3ad8ca;box-shadow:0 0 28px #11d4c055;font-size:2em}.card h1{margin:.25em 0 .3em;font-size:clamp(24px,3.1vw,56px);line-height:1;letter-spacing:-.03em}.card .copy{margin:0 auto 4%;max-width:44rem;color:#9bb5b2;font-size:clamp(11px,1vw,18px);line-height:1.45}.rules{display:flex;justify-content:center;gap:4%;margin-bottom:5%;color:#89aaa7;font-size:clamp(8px,.72vw,13px)}
    .primary,.secondary{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:.85em 1.5em;border-radius:8px;cursor:pointer;font-weight:700;border:1px solid #5df4e5;transition:.18s;font-size:clamp(10px,.88vw,16px)}.primary{background:linear-gradient(#26d7c7,#0b9d91);color:#001512;box-shadow:0 8px 28px #12d5c344}.secondary{background:#0b1c1b;color:#a8c8c5;border-color:#365c58}.primary:hover,.secondary:hover{transform:translateY(-2px);box-shadow:0 10px 30px #16e1ce55}.card small{display:block;margin-top:3%;color:#5c7775;font-size:clamp(7px,.6vw,11px)}
    .pause{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#000b;backdrop-filter:blur(10px)}.pause .card{position:relative;left:auto;top:auto;transform:none;width:min(44%,490px);padding:4%;animation:none}.result{width:min(52%,600px);padding-block:4%}.result h1{color:#86fff0;text-shadow:0 0 25px #16d7c5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2%;margin:4% 0}.grid div{padding:12% 5%;display:grid;gap:5px;border:1px solid #2a5f5a;border-radius:8px;background:#0a1b1a}.grid span{color:#6f8d8a;font-size:clamp(7px,.56vw,11px)}.grid b{font-size:clamp(10px,1vw,18px)}.actions{display:flex;justify-content:center;gap:3%}.note{position:absolute;z-index:12;bottom:12%;left:50%;transform:translateX(-50%);padding:.7em 1em;border:1px solid #7b6c39;border-radius:6px;background:#17150fe8;color:#d4c990;font-size:clamp(7px,.6vw,11px)}
    @keyframes card{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}}@keyframes success{from{opacity:0;transform:scale(.92)}}@keyframes pulse{to{box-shadow:0 0 24px #29e5d260}}
    @media(max-aspect-ratio:4/5){.stage{width:100vw;height:auto}.card{width:86%;padding:7%}.rules{display:grid;gap:5px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    /* HUD V2 — optical glass, machined edges and restrained cyan energy */
    .glass{overflow:hidden;border:1px solid rgba(91,255,238,.22);background:linear-gradient(145deg,rgba(5,23,22,.91),rgba(2,10,10,.76));box-shadow:0 20px 45px rgba(0,0,0,.42),inset 0 1px rgba(210,255,249,.07),inset 0 -1px rgba(0,0,0,.7);backdrop-filter:blur(22px) saturate(1.15)}
    .glass:before{content:"";position:absolute;z-index:0;left:9%;top:-1px;width:38%;height:1px;background:linear-gradient(90deg,transparent,#6ffff0,transparent);box-shadow:0 0 12px #20e3d2}.glass>*{position:relative;z-index:1}
    .task{left:1.45%;top:1.6%;width:30%;height:12%;padding:1.35% 2.15%;border-radius:15px 15px 15px 4px;clip-path:polygon(0 0,96% 0,100% 17%,100% 100%,4% 100%,0 83%)}
    .task:after{content:"";position:absolute;left:0;top:21%;width:3px;height:58%;background:linear-gradient(transparent,#39f4e2,transparent);box-shadow:0 0 16px #21dac9}.task .micro{display:flex;align-items:center;gap:.65em;color:#71eadd;text-shadow:0 0 14px rgba(48,235,217,.3)}
    .task .micro:before{content:"";width:.55em;aspect-ratio:1;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#4ff5e5;box-shadow:0 0 10px #26dbc9}.task h1{font-weight:620;letter-spacing:.005em;text-shadow:0 2px 18px #000;margin-top:.58em}.task p{color:#7eaaa6;letter-spacing:.025em}
    .levels{left:34%;top:3.55%;width:36.8%;height:9.3%;border-radius:18px;padding:0 2.2%;background:linear-gradient(180deg,rgba(4,23,22,.83),rgba(2,10,10,.58));border-color:rgba(77,221,208,.16);box-shadow:0 16px 42px #0007,inset 0 0 22px rgba(29,195,181,.035)}
    .levels:after{content:"";position:absolute;z-index:0;left:6.5%;right:6.5%;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(67,205,192,.25) 12%,rgba(67,205,192,.25) 88%,transparent)}
    .levels i{position:relative;z-index:1;width:8.3%;border-radius:0;clip-path:polygon(25% 6%,75% 6%,96% 50%,75% 94%,25% 94%,4% 50%);background:linear-gradient(145deg,#142c2a,#071211);border:0;color:#658582;box-shadow:none;font-weight:600;transition:.25s ease}.levels i.done{color:#79a5a1;background:linear-gradient(145deg,#173b37,#0a1c1a)}
    .levels i.active{color:#f5fffd;background:linear-gradient(145deg,#61ffef,#0ba99d 58%,#075d57);border:0;filter:drop-shadow(0 0 8px #22e7d6);text-shadow:0 1px 2px #004841;transform:scale(1.13)}
    .stats{right:1.35%;top:1.7%;width:24.5%;height:11.8%;gap:0;padding:0 1%;border:1px solid rgba(78,223,210,.19);border-radius:15px 4px 15px 15px;background:linear-gradient(145deg,rgba(5,23,22,.91),rgba(2,10,10,.72));box-shadow:0 20px 45px #0007,inset 0 1px rgba(210,255,249,.06);clip-path:polygon(7% 0,100% 0,100% 82%,93% 100%,0 100%,0 18%)}
    .stats:before{content:"SYSTEM / LIVE";position:absolute;left:7%;top:9%;color:rgba(87,211,199,.5);font-size:clamp(5px,.42vw,8px);font-weight:700;letter-spacing:.14em}.stats div{margin-top:15%;height:68%;border:0;border-left:1px solid rgba(80,208,196,.14);border-radius:0;background:transparent;gap:4%;box-shadow:none}.stats div:first-child{border-left:0}.stats span{letter-spacing:.05em;color:#6f9692}.stats b{color:#f3fffd;text-shadow:0 0 16px rgba(61,239,222,.18);font-weight:550}
    .reader{left:31%;bottom:1.45%;width:38%;height:11.8%;border-radius:17px 17px 5px 5px;clip-path:polygon(5% 0,95% 0,100% 23%,100% 100%,0 100%,0 23%);background:linear-gradient(180deg,rgba(7,27,26,.96),rgba(2,10,10,.93));border-color:rgba(83,236,221,.28);box-shadow:0 22px 46px #000a,inset 0 1px rgba(191,255,249,.09),0 0 32px rgba(20,208,191,.07)}
    .reader:after{content:"";position:absolute;left:9%;right:9%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#21ddcc 30%,#74fff0 50%,#21ddcc 70%,transparent);box-shadow:0 0 14px #21d8c8;opacity:.58}.reader>span{font-weight:550;letter-spacing:.035em;color:#9cc0bc}.combo{gap:clamp(14px,1.4vw,27px)}
    .key{min-width:clamp(34px,2.8vw,54px);padding:.5em .85em;border-radius:7px;background:linear-gradient(155deg,#243f3c 0,#0d1d1c 55%,#07100f 100%);border:1px solid rgba(119,215,206,.38);color:#eafffc;box-shadow:0 5px 0 #020706,0 8px 18px #0009,inset 0 1px rgba(216,255,251,.16);font-weight:650;letter-spacing:.025em}
    .reader.correct{border-color:rgba(87,255,232,.75);box-shadow:0 24px 54px #000b,0 0 38px rgba(22,235,207,.25),inset 0 0 28px rgba(37,213,193,.08)}.reader.correct:after{opacity:1;animation:energy 1s ease-in-out infinite alternate}.reader.correct .key{border-color:#73ffef;box-shadow:0 5px 0 #03211e,0 0 22px rgba(53,247,225,.32),inset 0 1px #dbfffb55}.reader.wrong{animation:hudShake .28s ease;border-color:rgba(255,102,109,.68)}
    .hint,.exit{bottom:2.1%;height:8.2%;border-radius:12px;background:linear-gradient(145deg,rgba(7,24,23,.88),rgba(3,11,11,.76));border-color:rgba(68,196,185,.18);box-shadow:0 15px 34px #0008,inset 0 1px #e0fffb0b}.hint{left:1.45%;width:26.6%;clip-path:polygon(0 0,94% 0,100% 28%,100% 100%,6% 100%,0 72%);padding-left:2.2%}
    .hint .q{width:clamp(22px,2vw,38px);aspect-ratio:1;display:grid;place-items:center;border:1px solid rgba(75,226,211,.32);border-radius:50%;background:#0b2927;color:#61eee0;box-shadow:inset 0 0 12px #17c7b722}.hint span{gap:.16em}.hint b{color:#a8c8c5;letter-spacing:.04em}.hint:hover{transform:translateY(-2px);box-shadow:0 18px 38px #0009,0 0 20px rgba(35,214,196,.12)}
    .exit{right:1.45%;width:14%;clip-path:polygon(12% 0,100% 0,100% 72%,88% 100%,0 100%,0 28%);gap:15%}.exit kbd{border-color:rgba(91,210,199,.28);background:linear-gradient(#19302e,#081312);box-shadow:0 3px 0 #020606;color:#b5d2cf}.exit:hover{transform:translateY(-2px);box-shadow:0 18px 38px #0009,0 0 20px rgba(35,214,196,.12)}
    @keyframes energy{to{filter:brightness(1.5);transform:scaleX(.82)}}@keyframes hudShake{25%{transform:translateX(-5px)}55%{transform:translateX(4px)}80%{transform:translateX(-2px)}}

    /* HUD V3 — ambient depth and live-system motion */
    .task,.levels,.reader,.hint,.exit,.stats{background-image:linear-gradient(115deg,rgba(105,255,240,.035),transparent 32%,rgba(0,0,0,.12)),repeating-linear-gradient(90deg,transparent 0,transparent 31px,rgba(74,208,196,.018) 32px),repeating-linear-gradient(0deg,transparent 0,transparent 31px,rgba(74,208,196,.014) 32px)}
    .task:before{width:42%;animation:edgeFlow 4.8s ease-in-out infinite}.task:after{animation:railBreath 2.6s ease-in-out infinite}
    .levels i.active{animation:nodePulse 1.7s ease-in-out infinite}.levels i.done:after{content:"";position:absolute;width:24%;aspect-ratio:1;border-radius:50%;background:#58dfd2;box-shadow:0 0 7px #32cbbb;bottom:9%}
    .stats:after{content:"";position:absolute;right:7%;top:10%;width:5px;aspect-ratio:1;border-radius:50%;background:#63f8e9;box-shadow:0 0 10px #28e0ce;animation:liveDot 1.4s steps(1) infinite}
    .reader:not(.correct):after{animation:idleEnergy 3.4s ease-in-out infinite}.reader.correct .key{animation:keyConfirm .55s cubic-bezier(.2,.85,.25,1) both}
    .reader.correct>span{color:#9ffff2;text-shadow:0 0 14px rgba(83,255,234,.42);letter-spacing:.055em}.reader.wrong>span{text-shadow:0 0 12px rgba(255,83,90,.26)}
    .hint:hover .q{background:#10514b;border-color:#71fff0;box-shadow:0 0 18px rgba(54,242,222,.3),inset 0 0 12px rgba(23,199,183,.18)}
    @keyframes edgeFlow{0%,100%{transform:translateX(-18%);opacity:.48}50%{transform:translateX(135%);opacity:1}}
    @keyframes railBreath{0%,100%{opacity:.38;filter:brightness(.8)}50%{opacity:1;filter:brightness(1.35)}}
    @keyframes nodePulse{0%,100%{transform:scale(1.08);filter:drop-shadow(0 0 7px #22e7d6)}50%{transform:scale(1.2);filter:drop-shadow(0 0 15px #4ffff0)}}
    @keyframes liveDot{0%,72%{opacity:1}73%,100%{opacity:.18}}
    @keyframes idleEnergy{0%,100%{opacity:.3;transform:scaleX(.65)}50%{opacity:.75;transform:scaleX(1)}}
    @keyframes keyConfirm{0%{transform:translateY(4px);filter:brightness(.75)}55%{transform:translateY(-2px);filter:brightness(1.4)}100%{transform:translateY(0);filter:brightness(1)}}

    /* Continuous training progress */
    .progresshud{left:34%;top:3.05%;width:36.8%;height:8.9%;padding:.9% 2.15%;border-radius:18px;display:grid;grid-template-rows:auto auto auto;align-content:center;gap:7%;background-image:linear-gradient(115deg,rgba(105,255,240,.045),transparent 36%,rgba(0,0,0,.14)),repeating-linear-gradient(90deg,transparent 0,transparent 31px,rgba(74,208,196,.018) 32px);box-shadow:0 18px 44px #0008,inset 0 0 24px rgba(31,213,196,.035)}
    .progresshud:after{content:"";position:absolute;z-index:0;left:4%;right:4%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,#38e5d5,transparent);box-shadow:0 0 12px #1dd2c2;animation:progressRail 3s ease-in-out infinite}
    .progress-head,.progress-meta{display:flex;align-items:center;justify-content:space-between}.progress-head span{color:#73aaa5;font-size:clamp(6px,.48vw,9px);font-weight:700;letter-spacing:.12em}.progress-head strong{color:#8ffff1;font-size:clamp(9px,.86vw,16px);font-weight:650;text-shadow:0 0 16px rgba(71,255,236,.35)}
    .progress-track{position:relative;height:clamp(5px,.48vw,9px);overflow:hidden;border:1px solid rgba(81,199,189,.22);border-radius:99px;background:#03100f;box-shadow:inset 0 2px 7px #000}.progress-track i{position:absolute;inset:0 auto 0 0;width:var(--progress);border-radius:inherit;background:linear-gradient(90deg,#08776e,#21d8c7 68%,#8ffff1);box-shadow:0 0 16px #1cd6c5;transition:width .55s cubic-bezier(.2,.8,.2,1)}.progress-track i:after{content:"";position:absolute;right:0;top:50%;width:8px;aspect-ratio:1;border-radius:50%;background:#d7fffb;box-shadow:0 0 12px #6dfff0;transform:translate(0,-50%)}
    .progress-meta{color:#547b77;font-size:clamp(5px,.42vw,8px);letter-spacing:.04em}
    .folder-open{position:absolute;inset:4%;display:grid;grid-template-rows:16% 1fr;border:1px solid rgba(76,220,207,.28);border-radius:5px;background:#061817;overflow:hidden}.folder-head{display:flex;align-items:center;gap:3%;padding:0 4%;color:#a6d2cd;background:#092522;border-bottom:1px solid rgba(74,202,190,.2)}.folder-head strong{color:#e7fffc}.folder-empty{display:grid;place-items:center;align-content:center;gap:7%;color:#5f8884}.folder-empty em{font-size:3em;font-style:normal;filter:drop-shadow(0 0 12px rgba(45,220,202,.22))}
    @keyframes progressRail{0%,100%{opacity:.3;transform:scaleX(.7)}50%{opacity:1;transform:scaleX(1)}}
  </style>
</head>

    let phase='intro',index=0,errors=0,hints=0,seconds=0,pressed=new Set(),shownCombo=[],feedback='idle',hint=false,paused=false,comboLocked=false,folderOpen=false,navIndex=1,lockOK=true,timer=null,nextTimer=null;
    const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    const label=c=>c.startsWith('Key')?c.slice(3):c.startsWith('Control')?'Ctrl':({ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Enter:'Enter'}[c]||c);
    const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function desktop(t){
      const files=['select','copy','paste','cut','undo','redo'].includes(t.scene);
      let body='';
      if(files){
        if(t.scene==='paste'&&folderOpen)body='<div class="folder-open"><div class="folder-head"><span>←</span><strong>Документи</strong></div><div class="folder-empty"><em>📂</em><span>Папку відкрито · вставте файл</span></div></div>';
        else body=`<div class="icons"><div class="icon ${(t.scene==='select'||t.scene==='paste'&&navIndex===0)?'sel':''}"><em>📁</em><span>Документи</span></div><div class="icon ${(t.scene!=='paste'||navIndex===1)?'sel':''} ${t.scene==='cut'?'cut':''}"><em>📄</em><span>Звіт.txt</span></div><div class="icon ${(t.scene==='select'||t.scene==='paste'&&navIndex===2)?'sel':''}"><em>📄</em><span>Навчання.docx</span></div>${t.scene==='undo'?'<div class="badge">↶ Файл видалено</div>':''}${t.scene==='redo'?'<div class="badge">↻ Дію можна повторити</div>':''}</div>`;
      }else{
        body=`<div class="doc"><div class="win"><span>Навчальний звіт</span><span>— □ ×</span></div><div class="toolbar"><b class="${t.scene==='bold'?'on':''}">B</b><b>I</b><b>U</b><span>│ Абзац</span></div>${t.scene==='find'?'<div class="search">⌕ Введіть слово для пошуку…</div>':''}${t.scene==='print'?'<div class="print"><strong>▤</strong><span>Підготовка до друку</span></div>':`<div class="paper"><b class="${t.scene==='bold'?'selection':''}">Цифрова грамотність</b><p>Комбінації клавіш допомагають виконувати типові дії швидше та впевненіше.</p><p>Використовуйте клавіатуру для роботи з документами.</p></div>`}${t.scene==='save'?'<div class="unsaved">● Зміни не збережено</div>':''}</div>`;
      }
      return `<div class="desktop"><div class="topbar"><span>VIDLIK OS</span><span>19:24 · УКР</span></div>${body}${feedback==='correct'?`<div class="success"><strong>✓</strong><span>${esc(t.result)}</span></div>`:''}</div>`;
    }
    function playing(){
      const t=TASKS[index],progress=Math.round(index/TASKS.length*100),choosing=t.scene==='paste'&&!folderOpen,expected=choosing?['↑ / ↓','Enter']:t.labels,live=[...pressed].sort(c=>c.startsWith('Control')?-1:1).map(label),keys=shownCombo.length?shownCombo:live.length?live:hint?expected:['—','—'];
      const taskText=choosing?'Стрілками оберіть папку «Документи» та відкрийте її клавішею Enter.':t.scene==='paste'?'Папку відкрито. Вставте скопійований файл.':t.text;
      const readerText=feedback==='correct'?esc(t.result):feedback==='wrong'?'Спробуйте іншу дію':choosing?'Оберіть папку стрілками й натисніть Enter':'Очікується комбінація клавіш…';
      return `<section class="glass task"><span class="micro">ЗАВДАННЯ ${String(index+1).padStart(2,'0')} / ${TASKS.length}</span><h1>${esc(taskText)}</h1><p>${esc(choosing?'Навігація клавіатурою':t.title)}</p></section>
      <section class="glass progresshud"><div class="progress-head"><span>ПРОГРЕС ТРЕНУВАННЯ</span><strong>${progress}%</strong></div><div class="progress-track"><i style="--progress:${progress}%"></i></div><div class="progress-meta"><span>${index} виконано</span><span>${TASKS.length-index} залишилось</span></div></section>
      <section class="stats"><div><span>Час</span><b id="timeValue">${fmt(seconds)}</b></div><div><span>Помилки</span><b>${errors}</b></div><div><span>Прогрес</span><b>${Math.round(index/TASKS.length*100)}%</b></div></section>
      <div class="monitor">${desktop(t)}</div>
      <div class="glass reader ${feedback}"><span>${readerText}</span><div class="combo">${keys.map(k=>`<span class="key">${esc(k)}</span>`).join('')}</div></div>
      <button class="glass hint" id="hint"><span class="q">?</span><span><b>Підказка</b>${hint?expected.join(' → '):choosing?'Показати керування':'Показати комбінацію'}</span></button>
      <button class="glass exit" id="exit"><span>Вийти</span><kbd>Esc</kbd></button>
      ${!lockOK?'<div class="note">Браузер не підтримує повне блокування системних клавіш, але основні комбінації працюють.</div>':''}`;
    }
    function render(){
      if(phase==='intro')game.innerHTML=`<section class="card"><div class="seal">⌨</div><p class="eyebrow">VIDLIK · ЦИФРОВА ГРАМОТНІСТЬ</p><h1>Клавіатурний полігон</h1><p class="copy">Виконайте 10 практичних завдань, натискаючи комбінації на фізичній клавіатурі. Розкладка мови не має значення.</p><div class="rules"><span>✓ Справжні натискання</span><span>✓ Повноекранний режим</span><span>✓ Результат і помилки</span></div><button class="primary" id="start">▶ Розпочати вправу</button><small>Для виходу натисніть Esc або кнопку «Вийти».</small></section>`;
      else if(phase==='complete'){const score=Math.max(0,1000-errors*20-hints*10+Math.max(0,120-seconds));game.innerHTML=`<section class="card result"><div class="seal">✓</div><p class="eyebrow">ТРЕНУВАННЯ ЗАВЕРШЕНО</p><h1>${score} XP</h1><p class="copy">Ви виконали всі 10 завдань.</p><div class="grid"><div><span>Правильно</span><b>10 / 10</b></div><div><span>Час</span><b>${fmt(seconds)}</b></div><div><span>Помилки</span><b>${errors}</b></div><div><span>Підказки</span><b>${hints}</b></div></div><div class="actions"><button class="primary" id="repeat">↻ Повторити</button><button class="secondary" id="leave">↪ Вийти</button></div></section>`;}
      else{game.innerHTML=playing();if(paused)game.insertAdjacentHTML('beforeend','<div class="pause"><section class="card"><div class="seal">Ⅱ</div><h2>Вправу призупинено</h2><p class="copy">Таймер зупинено. Поверніться у повноекранний режим, щоб продовжити.</p><button class="primary" id="resume">▶ Продовжити</button></section></div>')}
      bind();
    }
    function bind(){
      document.getElementById('start')?.addEventListener('click',start);
      document.getElementById('resume')?.addEventListener('click',enter);
      document.getElementById('repeat')?.addEventListener('click',()=>{index=errors=hints=seconds=0;shownCombo=[];feedback='idle';hint=false;comboLocked=false;folderOpen=false;navIndex=1;start()});
      document.getElementById('leave')?.addEventListener('click',leave);
      document.getElementById('exit')?.addEventListener('click',leave);
      document.getElementById('hint')?.addEventListener('click',()=>{if(!hint)hints++;hint=true;render()});
    }
    async function enter(){
      try{if(!document.fullscreenElement)await shell.requestFullscreen({navigationUI:'hide'})}catch(e){}
      if(navigator.keyboard?.lock){try{await navigator.keyboard.lock()}catch(e){lockOK=false}}else lockOK=false;
      paused=false;phase='playing';runTimer();render();
    }
    function start(){phase='playing';paused=false;comboLocked=false;folderOpen=false;navIndex=1;enter()}
    async function leave(){navigator.keyboard?.unlock?.();if(document.fullscreenElement)try{await document.exitFullscreen()}catch(e){};paused=true;stopTimer();render()}
    function runTimer(){stopTimer();timer=setInterval(()=>{if(phase==='playing'&&!paused){seconds++;const el=document.getElementById('timeValue');if(el)el.textContent=fmt(seconds)}},1000)}function stopTimer(){clearInterval(timer)}
    document.addEventListener('fullscreenchange',()=>{if(phase==='playing'&&!document.fullscreenElement){paused=true;stopTimer();render()}});
    window.addEventListener('keydown',e=>{
      if(phase!=='playing'||paused)return;
      if(e.code==='Escape'){e.preventDefault();leave();return}
      if(e.ctrlKey||e.metaKey||e.altKey||e.code.startsWith('Control')||e.code.startsWith('Arrow')||e.code==='Enter')e.preventDefault();
      if(e.repeat||comboLocked)return;
      pressed.add(e.code);
      if(e.code.startsWith('Control')||e.code.startsWith('Shift')||e.code.startsWith('Alt')){render();return}
      const t=TASKS[index];
      if(t.scene==='paste'&&!folderOpen&&(e.code.startsWith('Arrow')||e.code==='Enter')){
        if(e.code==='Enter'){
          if(navIndex===0){folderOpen=true;pressed.clear();feedback='idle';hint=false;render()}
          else{errors++;feedback='wrong';render();setTimeout(()=>{if(feedback==='wrong'&&!comboLocked){feedback='idle';render()}},620)}
        }else{const direction=(e.code==='ArrowUp'||e.code==='ArrowLeft')?-1:1;navIndex=(navIndex+direction+3)%3;feedback='idle';render()}
        return
      }
      if(e.ctrlKey&&e.code===t.main&&!e.shiftKey&&!e.altKey&&(t.scene!=='paste'||folderOpen)){
        comboLocked=true;shownCombo=[...t.labels];feedback='correct';render();clearTimeout(nextTimer);
        nextTimer=setTimeout(()=>{shownCombo=[];comboLocked=false;if(index===TASKS.length-1){phase='complete';navigator.keyboard?.unlock?.();stopTimer()}else{index++;feedback='idle';hint=false;if(TASKS[index].scene==='paste'){folderOpen=false;navIndex=1}}render()},2000)
      }else{errors++;feedback='wrong';render();setTimeout(()=>{if(feedback==='wrong'&&!comboLocked){feedback='idle';render()}},620)}
    },true);
    window.addEventListener('keyup',e=>{pressed.delete(e.code);if(phase==='playing'&&!paused&&!comboLocked)render()},true);
    render();
  </script>
</body>
</html>
