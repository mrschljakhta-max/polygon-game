<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020808">
<title>VIDLIK — Клавіатурний полігон</title>
<style>
:root{--cyan:#28dfcf;--cyan2:#13aaa0;--bg:#010606;--panel:rgba(5,21,20,.94);--line:rgba(67,211,198,.25);--text:#effffc;--muted:#769b97;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",Inter,Arial,sans-serif}button{font:inherit}
.shell{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#0c2927,#04100f 43%,#010404 76%)}
.stage{position:relative;width:min(100vw,177.778vh);height:min(100vh,56.25vw);aspect-ratio:16/9;overflow:hidden;background:#020908;box-shadow:0 0 80px #00b3a622}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.34;filter:saturate(.7) brightness(.55);pointer-events:none}.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,#000a 100%),linear-gradient(#00100f22,#00100f66);pointer-events:none}
#game{position:absolute;inset:0;z-index:4}.panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(5,23,22,.94),rgba(2,10,10,.88));box-shadow:0 20px 50px #0008,inset 0 1px #c8fff511;backdrop-filter:blur(18px)}
.menu{position:absolute;left:7%;top:9%;width:86%;height:82%;border-radius:22px;padding:4%}.kicker{color:#6ad9cf;font-size:clamp(8px,.63vw,12px);letter-spacing:.12em;font-weight:800}.menu h1,.menu h2{margin:.45em 0;font-size:clamp(28px,3vw,58px);letter-spacing:-.03em}.menu p{color:#8faeaa;max-width:52em;font-size:clamp(10px,.9vw,17px)}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:3%}.summary{display:flex;align-items:center;gap:18px;color:#6f918d;font-size:clamp(8px,.68vw,13px)}.summary b{color:white;font-size:1.35em}.back{border:1px solid #315d58;background:#071714;color:#91b9b4;border-radius:8px;padding:.65em 1em;cursor:pointer}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:1.6%;height:68%;margin-top:3%}.level{position:relative;text-align:left;padding:11% 9%;border:1px solid #1f4541;background:linear-gradient(145deg,#071b19e8,#03100ff0);color:#d7efeb;border-radius:14px;cursor:pointer;transition:.18s}.level:hover:not(:disabled){transform:translateY(-2px);border-color:#54cbbf}.level:disabled{opacity:.28;cursor:not-allowed}.level.open{border-color:#32a89e}.level.done{border-color:#50dfcf;background:linear-gradient(145deg,#0a2b27,#041613)}.level .num{display:block;font-size:clamp(26px,2.5vw,46px);font-weight:800;margin:.55em 0 .35em}.level small{color:#64847f;line-height:1.3}.level .check{position:absolute;right:9%;top:8%;color:#7dffee;font-size:1.4em}
.main-menu .hero{display:grid;grid-template-columns:1.35fr .8fr;align-items:center;height:60%;gap:5%}.hero h1{font-size:clamp(38px,5vw,82px);line-height:.95}.hero-actions{display:grid;gap:12px}.primary,.secondary{border-radius:10px;padding:1em 1.3em;font-weight:800;cursor:pointer}.primary{border:1px solid #7affef;background:linear-gradient(#24d5c4,#0d978d);color:#001512}.secondary{border:1px solid #315c57;background:#081b18;color:#a9c9c5}.progress{height:7px;background:#0d2723;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#27d8c7;width:var(--p)}
.taskbox{position:absolute;left:2%;top:2%;width:29%;min-height:12%;padding:1.2% 1.5%;border-radius:14px}.taskbox h3{margin:.45em 0 0;font-size:clamp(11px,1.05vw,20px);font-weight:600;line-height:1.2}.taskbox p{margin:.45em 0 0;color:#72938f;font-size:clamp(8px,.65vw,12px)}
.hud{position:absolute;right:2%;top:2%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:28%}.hud div{padding:7% 4%;text-align:center;border-radius:10px}.hud span{display:block;color:#668984;font-size:clamp(7px,.55vw,10px)}.hud b{font-size:clamp(11px,1vw,18px)}
.monitor{position:absolute;left:28%;top:17%;width:44%;height:45%;border:16px solid #172220;border-radius:12px;background:#07100f;box-shadow:0 20px 60px #000b,0 0 28px #22d6c844;overflow:hidden}.desktop{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 40%,#17443f,#0a2421 55%,#04100f);font-size:clamp(8px,.63vw,12px)}.bar{height:12%;padding:0 3%;display:flex;align-items:center;justify-content:space-between;background:#061110dc;color:#638e89;border-bottom:1px solid #2fbeb015}.body{position:absolute;inset:12% 0 0;display:grid;place-items:center}.window{width:82%;height:78%;background:#e5ebe8;color:#24312f;border-radius:5px;overflow:hidden;box-shadow:0 10px 30px #0006}.wtitle{height:15%;padding:0 4%;display:flex;align-items:center;justify-content:space-between;background:#14302d;color:#b6d4d0}.toolbar{height:15%;padding:0 4%;display:flex;align-items:center;gap:4%;background:#f4f6f5;border-bottom:1px solid #b7c5c2}.tool{font-weight:700;padding:.25em .5em;border-radius:3px}.tool.on{background:#0fa99c;color:#fff}.paper{margin:4% auto;width:82%;height:55%;background:white;padding:5%;box-shadow:0 2px 8px #0002}.sel{background:#15a699;color:white;padding:1px 3px}.filegrid{display:flex;gap:5%;align-items:center;justify-content:center;width:100%;height:100%}.file{width:24%;height:42%;display:grid;place-items:center;align-content:center;gap:7%;border:1px solid transparent;border-radius:7px;color:#a8cfca}.file em{font-style:normal;font-size:2.5em}.file.active{border-color:#55e1d4;background:#12686166}.file.cut{opacity:.42;border-style:dashed}.badge{position:absolute;right:5%;top:7%;padding:.55em .8em;border:1px solid #4ee5d6;border-radius:7px;background:#0a2a27;color:#cbfff9}.searchbox{position:absolute;right:5%;top:18%;padding:.7em 1em;background:white;border:2px solid #14a99c;color:#475a57;border-radius:4px}.printview{display:grid;place-items:center;height:100%;color:#285b55;font-size:1.4em}.success{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;background:#043e39e8;color:white}.success b{font-size:3em;color:#8affed}
.reader{position:absolute;left:29%;bottom:4%;width:42%;height:12%;border-radius:14px;display:grid;place-items:center;align-content:center;gap:12%;padding:1%}.reader .label{color:#87aaa6;font-size:clamp(8px,.7vw,13px)}.keys{display:flex;gap:clamp(14px,1.2vw,22px);align-items:center}.key{position:relative;min-width:clamp(32px,2.5vw,46px);padding:.45em .75em;text-align:center;border:1px solid #4c7873;border-radius:5px;background:linear-gradient(#17302e,#091716);box-shadow:0 3px #020706,inset 0 1px #d6fff021}.key+.key:before{content:"+";position:absolute;left:-14px;color:#617f7b}.reader.wrong{border-color:#ff6b6b;box-shadow:0 0 30px #ff383844}.reader.correct{border-color:#5bffdc;box-shadow:0 0 30px #12e7cf55}
.hint,.exit{position:absolute;bottom:4%;height:8%;border-radius:10px;color:#87aaa6;cursor:pointer}.hint{left:2%;width:18%}.exit{right:2%;width:12%}.note{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);padding:.6em .9em;border:1px solid #7d6b38;border-radius:6px;background:#17150fe8;color:#d8ca91;font-size:clamp(7px,.58vw,11px)}
.result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52%;padding:4%;border-radius:20px;text-align:center}.seal{margin:auto;width:70px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1px solid #52e4d6;background:#0b3b36;color:#8effef;font-size:2em}.result h1{font-size:clamp(28px,3vw,56px);margin:.3em}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4% 0}.result-grid div{padding:14% 5%;border:1px solid #285c57;border-radius:8px;background:#091a18}.result-grid span{display:block;color:#6d8f8b;font-size:.75em}.actions{display:flex;justify-content:center;gap:10px}.pause{position:absolute;inset:0;display:grid;place-items:center;background:#000b;backdrop-filter:blur(10px)}
@media(max-width:800px){.level-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr)}.menu{height:92%;top:4%;overflow:auto}.monitor{left:20%;width:60%}.hud{width:34%}.taskbox{width:38%}.reader{left:22%;width:56%}}
</style>
</head>
<body>
<main class="shell" id="shell"><section class="stage"><img class="bg" src="workstation-16x9.png" alt="Робоча станція"><div class="vignette"></div><div id="game"></div></section></main>
<script>
const LEVELS=[
{n:1,name:'Основні комбінації',desc:'Базовий набір гарячих клавіш',tasks:[
 ['Виділення всього','Виділіть усі об’єкти.','KeyA',['Ctrl','A'],'select'],['Копіювання','Скопіюйте виділений об’єкт.','KeyC',['Ctrl','C'],'copy'],['Вставлення','Вставте скопійований об’єкт.','KeyV',['Ctrl','V'],'paste'],['Вирізання','Виріжте об’єкт для переміщення.','KeyX',['Ctrl','X'],'cut'],['Скасування','Скасуйте останню дію.','KeyZ',['Ctrl','Z'],'undo'],['Повторення','Повторіть скасовану дію.','KeyY',['Ctrl','Y'],'redo'],['Збереження','Збережіть документ.','KeyS',['Ctrl','S'],'save'],['Пошук','Відкрийте пошук.','KeyF',['Ctrl','F'],'find'],['Друк','Відкрийте друк.','KeyP',['Ctrl','P'],'print'],['Напівжирний','Застосуйте напівжирний стиль.','KeyB',['Ctrl','B'],'bold']]},
{n:2,name:'Копіювання і вставлення',desc:'Ctrl+C та Ctrl+V у робочих сценаріях',tasks:[
 ['Копія документа','Скопіюйте виділений файл.','KeyC',['Ctrl','C'],'copy'],['Вставлення копії','Вставте копію у поточну папку.','KeyV',['Ctrl','V'],'paste'],['Копія фрагмента','Скопіюйте виділений текст.','KeyC',['Ctrl','C'],'copyText'],['Вставлення тексту','Вставте скопійований фрагмент.','KeyV',['Ctrl','V'],'pasteText'],['Дублювання','Створіть ще одну копію виділеного об’єкта.','KeyC',['Ctrl','C'],'copy']]},
{n:3,name:'Вирізання та переміщення',desc:'Ctrl+X і Ctrl+V для перенесення',tasks:[
 ['Підготовка до перенесення','Виріжте вибраний файл.','KeyX',['Ctrl','X'],'cut'],['Переміщення','Вставте вирізаний файл у нове місце.','KeyV',['Ctrl','V'],'move'],['Фрагмент тексту','Виріжте виділений абзац.','KeyX',['Ctrl','X'],'cutText'],['Нове місце','Вставте абзац у нову позицію.','KeyV',['Ctrl','V'],'pasteText']]},
{n:4,name:'Скасування і повторення',desc:'Ctrl+Z та Ctrl+Y',tasks:[
 ['Виправте помилку','Скасуйте останню дію.','KeyZ',['Ctrl','Z'],'undo'],['Поверніть дію','Повторіть щойно скасовану дію.','KeyY',['Ctrl','Y'],'redo'],['Ще одна помилка','Скасуйте неправильне форматування.','KeyZ',['Ctrl','Z'],'undo'],['Повернення','Повторіть правильну дію.','KeyY',['Ctrl','Y'],'redo']]},
{n:5,name:'Виділення всього',desc:'Ctrl+A у файлах і документах',tasks:[
 ['Усі файли','Виділіть усі об’єкти в папці.','KeyA',['Ctrl','A'],'select'],['Увесь текст','Виділіть весь текст документа.','KeyA',['Ctrl','A'],'selectText'],['Повторення','Ще раз виділіть весь вміст.','KeyA',['Ctrl','A'],'selectText']]},
{n:6,name:'Збереження документа',desc:'Ctrl+S і Ctrl+Shift+S',tasks:[
 ['Швидке збереження','Збережіть поточні зміни.','KeyS',['Ctrl','S'],'save'],['Зберегти як','Відкрийте «Зберегти як».','KeyS',['Ctrl','Shift','S'],'saveAs',true],['Після редагування','Збережіть нові зміни.','KeyS',['Ctrl','S'],'save']]},
{n:7,name:'Пошук інформації',desc:'Ctrl+F у документах',tasks:[
 ['Пошук слова','Відкрийте поле пошуку в документі.','KeyF',['Ctrl','F'],'find'],['Новий пошук','Відкрийте пошук ще раз.','KeyF',['Ctrl','F'],'find'],['Пошук у тексті','Запустіть пошук потрібної фрази.','KeyF',['Ctrl','F'],'find']]},
{n:8,name:'Друк документа',desc:'Ctrl+P та підготовка до друку',tasks:[
 ['Вікно друку','Відкрийте діалог друку.','KeyP',['Ctrl','P'],'print'],['Повторна підготовка','Відкрийте друк іншого документа.','KeyP',['Ctrl','P'],'print'],['Контроль','Ще раз викличте вікно друку.','KeyP',['Ctrl','P'],'print']]},
{n:9,name:'Форматування',desc:'Ctrl+B, Ctrl+I, Ctrl+U',tasks:[
 ['Напівжирний','Зробіть виділений текст напівжирним.','KeyB',['Ctrl','B'],'bold'],['Курсив','Застосуйте курсив до виділеного тексту.','KeyI',['Ctrl','I'],'italic'],['Підкреслення','Підкресліть виділений текст.','KeyU',['Ctrl','U'],'underline'],['Зняти напівжирний','Перемкніть напівжирний стиль.','KeyB',['Ctrl','B'],'bold']]},
{n:10,name:'Контрольна місія',desc:'Змішаний сценарій без підказок',noHint:true,tasks:[
 ['Підготуйте документ','Виділіть увесь текст.','KeyA',['Ctrl','A'],'selectText'],['Скопіюйте','Скопіюйте виділений фрагмент.','KeyC',['Ctrl','C'],'copyText'],['Вставте','Вставте копію.','KeyV',['Ctrl','V'],'pasteText'],['Виправте','Скасуйте останню дію.','KeyZ',['Ctrl','Z'],'undo'],['Поверніть','Повторіть дію.','KeyY',['Ctrl','Y'],'redo'],['Форматування','Зробіть заголовок напівжирним.','KeyB',['Ctrl','B'],'bold'],['Збережіть','Збережіть документ.','KeyS',['Ctrl','S'],'save'],['Знайдіть','Відкрийте пошук у документі.','KeyF',['Ctrl','F'],'find'],['До друку','Відкрийте вікно друку.','KeyP',['Ctrl','P'],'print']]}
];
const PROFILE_KEY='vidlik-hotkeys-profile-v2';
let profile={completed:[],xp:0,best:{}};try{profile={...profile,...JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')};if(!Array.isArray(profile.completed))profile.completed=[]}catch(e){}
const game=document.getElementById('game'),shell=document.getElementById('shell');let phase='menu',levelIndex=0,taskIndex=0,errors=0,hints=0,seconds=0,feedback='idle',pressed=new Set(),paused=false,locked=false,timer=null,nextTimer=null,lockOK=true;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const save=()=>{try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profile))}catch(e){}};
function unlocked(i){return i===0||profile.completed.includes(i)}
function mainMenu(){const done=profile.completed.length,p=Math.round(done/10*100),next=Math.min(done,9);return `<section class="menu panel main-menu"><div class="topline"><div><span class="kicker">VIDLIK · ЦИФРОВА ГРАМОТНІСТЬ</span><h2>Клавіатурний полігон</h2></div><div class="summary"><span>СЕКТОР 01</span><b>${done}/10</b></div></div><div class="hero"><div><span class="kicker">БАЗОВІ КОМБІНАЦІЇ</span><h1>Керуйте<br>швидше.</h1><p>10 рівнів практики: від перших комбінацій до контрольної місії.</p></div><div class="hero-actions"><button class="primary" id="continue">▶ ${done?'ПРОДОВЖИТИ':'РОЗПОЧАТИ'}</button><span>Рівень ${String(next+1).padStart(2,'0')} · ${esc(LEVELS[next].name)}</span><div class="progress"><i style="--p:${p}%"></i></div><small>${done} пройдено · ${10-done} залишилось</small><button class="secondary" id="sector">Карта сектору</button></div></div></section>`}
function sectorMenu(){const done=profile.completed.length;const tiles=LEVELS.map((l,i)=>{const open=unlocked(i),completed=profile.completed.includes(i+1);return `<button class="level ${open?'open':''} ${completed?'done':''}" ${open?'':'disabled'} data-level="${i}"><span class="kicker">РІВЕНЬ</span><span class="num">${String(l.n).padStart(2,'0')}</span><small>${esc(l.name)}</small>${completed?'<span class="check">✓</span>':''}</button>`}).join('');return `<section class="menu panel"><div class="topline"><div><span class="kicker">СЕКТОР 01 · РІВНІ 01–10</span><h2>Базові комбінації</h2></div><div class="summary"><span>Пройдено</span><b>${done}/10</b><button class="back" id="back">← Меню</button></div></div><div class="level-grid">${tiles}</div></section>`}
function visual(scene){const fileScenes=['select','copy','paste','cut','move'].includes(scene);let inner='';if(fileScenes){inner=`<div class="filegrid"><div class="file ${scene==='select'?'active':''}"><em>📁</em><span>Документи</span></div><div class="file active ${scene==='cut'?'cut':''}"><em>📄</em><span>Звіт.docx</span></div><div class="file"><em>📄</em><span>Нотатки.txt</span></div></div>${scene==='select'?'<div class="badge">✓ Усі об’єкти виділено</div>':''}`}
else{const on=scene==='bold'?'B':scene==='italic'?'I':scene==='underline'?'U':'';inner=`<div class="window"><div class="wtitle"><span>Навчальний документ</span><span>— □ ×</span></div><div class="toolbar"><span class="tool ${on==='B'?'on':''}">B</span><span class="tool ${on==='I'?'on':''}">I</span><span class="tool ${on==='U'?'on':''}">U</span></div>${scene==='print'?'<div class="printview">▤ Підготовка до друку</div>':`<div class="paper"><b class="${['selectText','copyText','cutText','pasteText'].includes(scene)?'sel':''}">Цифрова грамотність</b><p>Гарячі клавіші пришвидшують типові робочі дії.</p></div>`}${scene==='find'?'<div class="searchbox">⌕ Пошук у документі</div>':''}${scene==='save'||scene==='saveAs'?'<div class="badge">● Є незбережені зміни</div>':''}</div>`}
return `<div class="desktop"><div class="bar"><span>VIDLIK OS</span><span>УКР · 08:00</span></div><div class="body">${inner}</div>${feedback==='correct'?'<div class="success"><b>✓</b><span>Дію виконано</span></div>':''}</div>`}
function currentTask(){const raw=LEVELS[levelIndex].tasks[taskIndex];return {title:raw[0],text:raw[1],main:raw[2],labels:raw[3],scene:raw[4],shift:!!raw[5]}}
function playing(){const l=LEVELS[levelIndex],t=currentTask(),progress=Math.round(taskIndex/l.tasks.length*100),live=[...pressed].map(c=>c.startsWith('Control')?'Ctrl':c.startsWith('Shift')?'Shift':c.startsWith('Key')?c.slice(3):c);const keys=feedback==='correct'?t.labels:live.length?live:(hints&&!l.noHint?t.labels:['—','—']);return `<section class="taskbox panel"><span class="kicker">РІВЕНЬ ${String(l.n).padStart(2,'0')} · ${esc(l.name)}</span><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p></section><section class="hud"><div class="panel"><span>Час</span><b id="time">${fmt(seconds)}</b></div><div class="panel"><span>Помилки</span><b>${errors}</b></div><div class="panel"><span>Прогрес</span><b>${taskIndex}/${l.tasks.length}</b></div></section><div class="monitor">${visual(t.scene)}</div><section class="reader panel ${feedback}"><span class="label">${feedback==='wrong'?'Спробуйте іншу комбінацію':feedback==='correct'?'Прийнято':'Очікується комбінація клавіш'}</span><div class="keys">${keys.map(k=>`<span class="key">${esc(k)}</span>`).join('')}</div></section>${l.noHint?'':`<button class="hint panel" id="hint">? Підказка</button>`}<button class="exit panel" id="exit">Вийти · Esc</button>${!lockOK?'<div class="note">Браузер не підтримує повне блокування системних клавіш.</div>':''}`}
function score(){return Math.max(0,1000-errors*25-hints*10+Math.max(0,120-seconds))}
function complete(){const l=LEVELS[levelIndex],s=score();if(!profile.completed.includes(l.n))profile.completed.push(l.n);profile.completed.sort((a,b)=>a-b);profile.xp=(profile.xp||0)+s;profile.best[l.n]=Math.max(profile.best[l.n]||0,s);save();phase='complete';stopTimer();navigator.keyboard?.unlock?.();render()}
function result(){const l=LEVELS[levelIndex];return `<section class="result panel"><div class="seal">✓</div><span class="kicker">РІВЕНЬ ${String(l.n).padStart(2,'0')} ЗАВЕРШЕНО</span><h1>${score()} XP</h1><p>${esc(l.name)} — виконано.</p><div class="result-grid"><div><span>Вправ</span><b>${l.tasks.length}</b></div><div><span>Час</span><b>${fmt(seconds)}</b></div><div><span>Помилки</span><b>${errors}</b></div><div><span>Підказки</span><b>${hints}</b></div></div><div class="actions"><button class="primary" id="next">${l.n<10?'Наступний рівень →':'До сектору'}</button><button class="secondary" id="repeat">↻ Повторити</button></div></section>`}
function render(){if(phase==='menu')game.innerHTML=mainMenu();else if(phase==='sector')game.innerHTML=sectorMenu();else if(phase==='complete')game.innerHTML=result();else{game.innerHTML=playing();if(paused)game.insertAdjacentHTML('beforeend','<div class="pause"><section class="result panel"><div class="seal">Ⅱ</div><h2>Призупинено</h2><button class="primary" id="resume">▶ Продовжити</button></section></div>')}bind()}
function bind(){document.getElementById('continue')?.addEventListener('click',()=>startLevel(Math.min(profile.completed.length,9)));document.getElementById('sector')?.addEventListener('click',()=>{phase='sector';render()});document.getElementById('back')?.addEventListener('click',()=>{phase='menu';render()});document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>startLevel(+b.dataset.level)));document.getElementById('hint')?.addEventListener('click',()=>{if(!hints)hints=1;else hints++;render()});document.getElementById('exit')?.addEventListener('click',leave);document.getElementById('resume')?.addEventListener('click',enter);document.getElementById('repeat')?.addEventListener('click',()=>startLevel(levelIndex));document.getElementById('next')?.addEventListener('click',()=>{if(levelIndex<9)startLevel(levelIndex+1);else{phase='sector';render()}})}
async function enter(){try{if(!document.fullscreenElement)await shell.requestFullscreen({navigationUI:'hide'})}catch(e){}try{if(navigator.keyboard?.lock)await navigator.keyboard.lock()}catch(e){lockOK=false}paused=false;phase='playing';runTimer();render()}
function startLevel(i){if(!unlocked(i))return;clearTimeout(nextTimer);levelIndex=i;taskIndex=errors=hints=seconds=0;feedback='idle';pressed.clear();locked=false;enter()}
async function leave(){clearTimeout(nextTimer);stopTimer();navigator.keyboard?.unlock?.();paused=false;phase='sector';if(document.fullscreenElement)try{await document.exitFullscreen()}catch(e){}render()}
function runTimer(){stopTimer();timer=setInterval(()=>{if(phase==='playing'&&!paused){seconds++;const el=document.getElementById('time');if(el)el.textContent=fmt(seconds)}},1000)}function stopTimer(){clearInterval(timer)}
document.addEventListener('fullscreenchange',()=>{if(phase==='playing'&&!document.fullscreenElement){paused=true;stopTimer();render()}});
window.addEventListener('keydown',e=>{if(phase!=='playing'||paused)return;if(e.code==='Escape'){e.preventDefault();leave();return}if(e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||e.code.startsWith('Control')||e.code.startsWith('Shift'))e.preventDefault();if(e.repeat||locked)return;pressed.add(e.code);if(e.code.startsWith('Control')||e.code.startsWith('Shift')){render();return}const t=currentTask();const ok=e.ctrlKey&&e.code===t.main&&!e.altKey&&(t.shift?e.shiftKey:!e.shiftKey);if(ok){locked=true;feedback='correct';render();clearTimeout(nextTimer);nextTimer=setTimeout(()=>{locked=false;pressed.clear();feedback='idle';if(taskIndex>=LEVELS[levelIndex].tasks.length-1)complete();else{taskIndex++;render()}},1000)}else{errors++;feedback='wrong';render();setTimeout(()=>{if(feedback==='wrong'&&!locked){feedback='idle';render()}},600)}},true);
window.addEventListener('keyup',e=>{pressed.delete(e.code);if(phase==='playing'&&!paused&&!locked)render()},true);
render();
</script>
</body>
