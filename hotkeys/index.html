<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020808">
<title>VIDLIK — Клавіатурний полігон</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010606}#gameFrame{display:block;width:100%;height:100%;border:0;background:#010606}
</style>
</head>
<body>
<iframe id="gameFrame" src="game.html" title="VIDLIK — Клавіатурний полігон" allow="fullscreen; keyboard-map" allowfullscreen></iframe>
<script>
const frame=document.getElementById('gameFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc||doc.getElementById('vidlik-workstation-geometry'))return;
    const style=doc.createElement('style');
    style.id='vidlik-workstation-geometry';
    style.textContent=`
      /*
        Геометрія виміряна у VIDLIK Screen Contour Sandbox.
        Еталонний кадр: 1920×1080.
        Внутрішня область фізичного монітора:
        TL 549,191 · TR 1269,189 · BR 1267,549 · BL 552,547
      */
      .stage{
        width:min(100vw,calc(100vh * 1920 / 1080))!important;
        height:min(100vh,calc(100vw * 1080 / 1920))!important;
        aspect-ratio:16/9!important;
        background:#020908!important;
      }
      .bg{
        width:100%!important;
        height:100%!important;
        object-fit:contain!important;
        object-position:center center!important;
        opacity:1!important;
        filter:none!important;
      }
      .vignette{
        background:radial-gradient(ellipse at 50% 49%,transparent 76%,rgba(0,0,0,.19) 100%),linear-gradient(to bottom,rgba(0,16,15,.008),rgba(0,12,11,.028))!important;
      }

      .taskbox{left:1.9%!important;top:2.1%!important;width:28.4%!important}
      .progresshud{left:35.4%!important;top:2.05%!important;width:29.2%!important;height:8.8%!important}
      .hud{right:1.9%!important;top:2.1%!important;width:22%!important}

      /* Точний bbox з JSON користувача */
      .monitor{
        left:28.5938%!important;
        top:17.5%!important;
        width:37.5%!important;
        height:33.3333%!important;
        border:0!important;
        border-radius:0!important;
        overflow:hidden!important;
        background:transparent!important;
        box-shadow:none!important;
        /* Точний 4-точковий контур відносно bbox */
        clip-path:polygon(
          0% 0.5556%,
          100% 0%,
          99.7222% 100%,
          0.4167% 99.4444%
        )!important;
      }
      .monitor>.desktop{
        width:100%!important;
        height:100%!important;
      }

      .reader{left:28.8%!important;bottom:2.4%!important;width:42.4%!important;height:10.7%!important}
      .hint{left:1.9%!important;bottom:2.6%!important;width:19.8%!important;height:7.7%!important}
      .exit{right:1.9%!important;bottom:2.6%!important;width:15%!important;height:7.7%!important}
      .note{bottom:14.8%!important}

      @media(max-width:800px){
        .monitor{
          left:28.5938%!important;
          top:17.5%!important;
          width:37.5%!important;
          height:33.3333%!important;
        }
        .taskbox{left:1.9%!important;top:2.1%!important;width:28.4%!important}
        .progresshud{left:35.4%!important;top:2.05%!important;width:29.2%!important}
        .hud{right:1.9%!important;top:2.1%!important;width:22%!important}
        .reader{left:28.8%!important;width:42.4%!important}
      }
    `;
    doc.head.appendChild(style);
  }catch(e){console.error('VIDLIK geometry injection failed',e)}
});
</script>
</body>
</html>
