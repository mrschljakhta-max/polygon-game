  <text x="800" y="352" text-anchor="middle" font-family="Arial Black, Impact, Arial, sans-serif" font-size="226" font-weight="900" font-style="italic" letter-spacing="12" fill="#0b0b0b" stroke="#fff3c6" stroke-width="7" paint-order="stroke fill" filter="url(#textShadow)">ДАЛІ</text>
  <text x="800" y="352" text-anchor="middle" font-family="Arial Black, Impact, Arial, sans-serif" font-size="226" font-weight="900" font-style="italic" letter-spacing="12" fill="#0b0b0b" stroke="#f8c526" stroke-width="3" paint-order="stroke fill">ДАЛІ</text>
