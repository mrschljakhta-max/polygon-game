      <path d="M1210 16 H1600 V500 H1330 L1435 278 Z" fill="url(#dots)"/>
      <path d="M88 128 L350 120 L242 202 L92 220 Z" fill="#ffd72d" stroke="#0b0b0b" stroke-width="12"/>
      <path d="M1280 71 L1545 56 L1432 146 L1312 152 Z" fill="#ffd72d" stroke="#0b0b0b" stroke-width="12"/>
      <path d="M70 410 L382 383 L236 490 L82 490 Z" fill="#ffd72d" stroke="#0b0b0b" stroke-width="12"/>
      <path d="M1202 410 L1510 382 L1382 486 L1234 486 Z" fill="#ffd72d" stroke="#0b0b0b" stroke-width="12"/>

