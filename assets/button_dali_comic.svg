<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">ДАЛІ</title>
  <desc id="desc">Жовта коміксова кнопка у стилі заставки Полігону</desc>
  <defs>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd72d"/>
      <stop offset="0.48" stop-color="#ffcf20"/>
      <stop offset="1" stop-color="#f3b90d"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="7" fill="#101010"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%">
