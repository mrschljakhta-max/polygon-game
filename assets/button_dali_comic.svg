        <circle cx="1240" cy="330" r="7"/><circle cx="360" cy="336" r="6"/><circle cx="1030" cy="407" r="5"/>
      </g>
      <g stroke="#101010" stroke-width="7" stroke-linecap="square" opacity=".9">
